name: Warm ECS compiler cache

on:
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - tool-versions.env
      - '**/Cargo.toml'
      - crates/build_*.rs
      - crates/feature/vmux_dx/lints/**
      - crates/feature/vmux_dx/src/ci.rs
      - crates/feature/vmux_dx/src/ci_io.rs
      - crates/feature/vmux_dx/src/ci/**
      - crates/feature/vmux_dx/src/ci_io/**
      - .github/actions/setup-ci/**
      - .github/actions/setup-compiler-cache/**
      - .github/actions/cache-sources/**
      - .github/actions/save-sources/**
      - .github/actions/cache-ecs-lints/**
      - .github/workflows/compiler-cache.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ecs-compiler-cache-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  VMUX_CI_PREBUILT_DX: "0"
  VMUX_CI_FAST_RUST: "1"
  VMUX_CI_VALIDATION: "1"
  VMUX_CI_GCS_ENABLED: "1"

jobs:
  compiler-cache:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Resolve CEF version
        id: cef
        shell: bash
        run: |
          version="$(awk -F'\"' '/^name = \"cef\"$/{getline; print $2; exit}' Cargo.lock)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-linux
        with:
          cache-key: compiler-warm
          cef-version: ${{ steps.cef.outputs.version }}
      - uses: ./.github/actions/cache-ecs-lints
      - name: Validate compiler fixtures
        run: vmux internal --root .build-tools/compiler-checkout ecs-lint -- --test
      - name: Warm nightly workspace dependencies
        run: VMUX_SKIP_DX_BUILD=1 vmux internal --root .build-tools/compiler-checkout ecs-lint -- --locked --workspace --all-targets
      - uses: ./.github/actions/save-sources
        with:
          workspace: .build-tools/compiler-checkout
          snapshot: .build-tools/lints-sources.json
          target: .build-tools/lints
      - name: Publish successful compiler workspace snapshot
        uses: ./.github/actions/save-workspace
        with:
          cache-key: compiler-warm
      - uses: ./.github/actions/report-compiler-cache
        if: always() && env.VMUX_CI_COMPILER_CACHE_READY == '1'
        with:
          name: compiler-warm
