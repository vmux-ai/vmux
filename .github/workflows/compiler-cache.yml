name: Warm ECS compiler cache

on:
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - rust-toolchain.toml
      - tool-versions.env
      - '**/Cargo.toml'
      - crates/build_*.rs
      - crates/feature/vmux_dx/lints/**
      - crates/feature/vmux_dx/src/ci.rs
      - crates/feature/vmux_dx/src/ci_io.rs
      - crates/feature/vmux_dx/src/ci/**
      - crates/feature/vmux_dx/src/ci_io/**
      - .github/actions/setup-ci/**
      - .github/actions/setup-compiler-cache/**
      - .github/actions/setup-rust/**
      - .github/actions/setup-linux/**
      - .github/actions/setup-macos/**
      - .github/actions/cache-sources/**
      - .github/actions/save-sources/**
      - .github/actions/cache-ecs-lints/**
      - .github/workflows/compiler-cache.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ecs-compiler-cache-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  VMUX_CI_PREBUILT_DX: "0"
  VMUX_CI_FAST_RUST: "1"
  VMUX_CI_VALIDATION: "1"
  VMUX_CI_GCS_ENABLED: "1"
  CI_CACHE_BUCKET: ${{ vars.CI_CACHE_BUCKET }}
  CI_CACHE_WIF_PROVIDER: ${{ vars.CI_CACHE_WIF_PROVIDER }}
  CI_CACHE_READER_ACCOUNT: ${{ vars.CI_CACHE_READER_ACCOUNT }}
  CI_CACHE_WRITER_ACCOUNT: ${{ vars.CI_CACHE_WRITER_ACCOUNT }}

jobs:
  compiler-cache:
    name: Warm ECS compiler cache (${{ matrix.os }})
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Resolve CEF version
        id: cef
        shell: bash
        run: |
          version="$(awk -F'\"' '/^name = \"cef\"$/{getline; print $2; exit}' Cargo.lock)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-linux
        if: runner.os == 'Linux'
        with:
          cache-key: lint-ecs
          dependency-cache-key: lint
          cef-version: ${{ steps.cef.outputs.version }}
      - uses: ./.github/actions/setup-macos
        if: runner.os == 'macOS'
        with:
          cache-key: lint-ecs
          cef-version: ${{ steps.cef.outputs.version }}
          packaging: "false"
          fast-rust: "true"
          cli: "build"
      - uses: ./.github/actions/cache-ecs-lints
      - name: Validate compiler fixtures
        if: runner.os == 'Linux'
        run: vmux internal --root .vmux/compiler-checkout ecs-lint -- --test
      - name: Warm nightly workspace dependencies
        run: VMUX_SKIP_DX_BUILD=1 vmux internal --root .vmux/compiler-checkout ecs-lint -- --locked --workspace --all-targets
      - uses: ./.github/actions/save-sources
        with:
          workspace: .vmux/compiler-checkout
          snapshot: .vmux/lints-sources.json
          target: .vmux/lints
      - name: Publish successful compiler workspace snapshot
        uses: ./.github/actions/save-workspace
        with:
          cache-key: lint-ecs
      - uses: ./.github/actions/report-compiler-cache
        if: always() && env.VMUX_CI_COMPILER_CACHE_READY == '1'
        with:
          name: compiler-warm-${{ matrix.os }}
