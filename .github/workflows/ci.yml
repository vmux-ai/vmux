name: CI

on:
  pull_request:
  push:
    branches:
      - "**"
    paths-ignore:
      - 'Casks/**'
      - 'website/public/updates.json'
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_name != github.event.repository.default_branch) }}

env:
  CARGO_TERM_COLOR: always
  DX_HOME: ${{ github.workspace }}/.dx

jobs:
  plan:
    name: Plan CI and reuse preflight
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      head: ${{ steps.plan.outputs.head }}
      base: ${{ steps.plan.outputs.base }}
      tree: ${{ steps.plan.outputs.tree }}
      feature: ${{ steps.plan.outputs.feature }}
      release: ${{ steps.plan.outputs.release }}
      reusable: ${{ steps.plan.outputs.reusable }}
      reuse: ${{ steps.plan.outputs.reuse }}
      receipt: ${{ steps.plan.outputs.receipt }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/github-script@v8
        id: plan
        with:
          script: |
            const Preflight = require('./scripts/ci-preflight.js');
            await new Preflight({ github, context, core }).plan();
      - name: Publish preflight input identity
        if: steps.plan.outputs.feature == 'true' && steps.plan.outputs.reusable == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: inputs-${{ steps.plan.outputs.receipt }}
          path: ci-preflight-inputs.json
          if-no-files-found: error
          retention-days: 7

  cef-version:
    name: Resolve CEF version
    needs: [plan]
    if: needs.plan.outputs.reuse == ''
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.head }}

      - uses: ./.github/actions/prepare-ci
        with:
          head: ${{ needs.plan.outputs.head }}
          base: ${{ needs.plan.outputs.base }}
          tree: ${{ needs.plan.outputs.tree }}

      - name: Resolve cef crate version from Cargo.lock
        id: resolve
        run: |
          set -euo pipefail
          version=$(awk -F'"' '/^name = "cef"$/{getline; print $2; exit}' Cargo.lock)
          if [ -z "${version:-}" ]; then
            echo "::error file=Cargo.lock::could not resolve 'cef' crate version"
            exit 1
          fi
          echo "Resolved CEF version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  format-rust:
    name: Format (rust)
    runs-on: ubuntu-latest
    needs: [plan, changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.head }}

      - uses: ./.github/actions/prepare-ci
        with:
          head: ${{ needs.plan.outputs.head }}
          base: ${{ needs.plan.outputs.base }}
          tree: ${{ needs.plan.outputs.tree }}

      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt

      - name: Select Rust format scope
        id: scope
        env:
          VMUX_CI_BASE: ${{ needs.plan.outputs.base }}
        run: vmux ci-scope >> "$GITHUB_OUTPUT"

      - name: Check formatting
        run: cargo fmt ${{ steps.scope.outputs.lint_args }} -- --check

  lint-rust:
    name: Lint (rust)
    runs-on: ubuntu-latest
    needs: [plan, cef-version, changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.head }}

      - uses: ./.github/actions/prepare-ci
        with:
          head: ${{ needs.plan.outputs.head }}
          base: ${{ needs.plan.outputs.base }}
          tree: ${{ needs.plan.outputs.tree }}

      - uses: ./.github/actions/setup-linux
        with:
          components: clippy
          cache-key: lint
          cef-version: ${{ needs.cef-version.outputs.version }}

      - name: Select Rust check scope
        id: scope
        env:
          VMUX_CI_BASE: ${{ needs.plan.outputs.base }}
        run: vmux ci-scope >> "$GITHUB_OUTPUT"

      - name: Clippy
        run: VMUX_SKIP_DX_BUILD=1 cargo clippy ${{ steps.scope.outputs.lint_args }} --all-targets -- -D warnings

      - name: Clippy lean desktop features
        if: steps.scope.outputs.lean == 'true'
        run: VMUX_SKIP_DX_BUILD=1 cargo clippy -p vmux_desktop --lib --no-default-features -- -D warnings

      - name: Clippy renderer-free record contracts
        run: cargo clippy --locked -p vmux_ecs --no-default-features --features records --all-targets -- -D warnings

  test-rust:
    name: Test (rust)
    runs-on: ubuntu-latest
    needs: [plan, cef-version, changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.head }}

      - uses: ./.github/actions/prepare-ci
        with:
          head: ${{ needs.plan.outputs.head }}
          base: ${{ needs.plan.outputs.base }}
          tree: ${{ needs.plan.outputs.tree }}

      - uses: ./.github/actions/setup-linux
        with:
          cache-key: test
          cef-version: ${{ needs.cef-version.outputs.version }}

      - name: Select Rust test scope
        id: scope
        env:
          VMUX_CI_BASE: ${{ needs.plan.outputs.base }}
        run: vmux ci-scope >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: VMUX_SKIP_DX_BUILD=1 cargo test --locked ${{ steps.scope.outputs.args }}

      - name: Test record contracts alongside Workspace storage
        run: cargo test --locked -p vmux_ecs --no-default-features --features store,records

      - name: Test lean desktop features
        if: steps.scope.outputs.lean == 'true'
        run: VMUX_SKIP_DX_BUILD=1 cargo test -p vmux_desktop --lib --no-default-features disabled_features::tests


  test-policy:
    name: Test build and ownership policy
    runs-on: ubuntu-latest
    needs: [plan, changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.head }}

      - uses: ./.github/actions/prepare-ci
        with:
          head: ${{ needs.plan.outputs.head }}
          base: ${{ needs.plan.outputs.base }}
          tree: ${{ needs.plan.outputs.tree }}
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: policy
          save-if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
      - name: Test build preparation and source ownership
        run: |
          node --test scripts/ci-preflight.test.js
          cargo test --locked -p vmux_dx --features ci-syntax --lib
          cargo test --locked -p vmux_cli --no-default-features --features dx,ci-syntax --test dx --test ci_native
          cargo test --locked -p vmux_macro --test source_conventions --test ecs_ownership

  test-sdk-path:
    name: Test public SDK from an independent workspace
    runs-on: ubuntu-latest
    needs: [plan, changes, cef-version]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.head }}

      - uses: ./.github/actions/prepare-ci
        with:
          head: ${{ needs.plan.outputs.head }}
          base: ${{ needs.plan.outputs.base }}
          tree: ${{ needs.plan.outputs.tree }}
      - uses: ./.github/actions/setup-linux
        with:
          cache-key: sdk-path
          cef-version: ${{ needs.cef-version.outputs.version }}
      - run: vmux framework-consumer
      - name: Test isolated product hosts without a renderer
        run: vmux framework-consumer -- --host

  test-sdk-git:
    name: Test SDK from immutable Git dependencies
    runs-on: ubuntu-latest
    needs: [plan, changes, cef-version]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.head }}

      - uses: ./.github/actions/prepare-ci
        with:
          head: ${{ needs.plan.outputs.head }}
          base: ${{ needs.plan.outputs.base }}
          tree: ${{ needs.plan.outputs.tree }}
      - uses: ./.github/actions/setup-linux
        with:
          cache-key: sdk-git
          cef-version: ${{ needs.cef-version.outputs.version }}
      - run: vmux framework-consumer -- --git
      - name: Test product hosts from immutable Git dependencies
        run: vmux framework-consumer -- --host --git

  test-headless:
    name: Test headless application profiles
    runs-on: ubuntu-latest
    needs: [plan, changes, cef-version]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.head }}

      - uses: ./.github/actions/prepare-ci
        with:
          head: ${{ needs.plan.outputs.head }}
          base: ${{ needs.plan.outputs.base }}
          tree: ${{ needs.plan.outputs.tree }}
      - uses: ./.github/actions/setup-linux
        with:
          cache-key: headless
          cef-version: ${{ needs.cef-version.outputs.version }}
      - run: VMUX_SKIP_DX_BUILD=1 cargo test --locked -p vmux_app --no-default-features --features daemon,mcp --lib

  changes:
    name: Detect Changes
    needs: [plan]
    if: needs.plan.outputs.reuse == ''
    runs-on: ubuntu-latest
    outputs:
      website: ${{ steps.filter.outputs.website }}
      macos: ${{ github.event_name != 'schedule' && (github.event_name == 'workflow_dispatch' || steps.filter.outputs.macos == 'true') && steps.native.outputs.native != 'false' }}
      macos_package: ${{ steps.filter.outputs.macos_package == 'true' && steps.native.outputs.native != 'false' }}
      ios: ${{ github.event_name != 'schedule' && (github.event_name == 'workflow_dispatch' || steps.filter.outputs.ios == 'true') && steps.native.outputs.native != 'false' }}
      code: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.head }}

      - uses: ./.github/actions/prepare-ci
        id: prepared
        with:
          head: ${{ needs.plan.outputs.head }}
          base: ${{ needs.plan.outputs.base }}
          tree: ${{ needs.plan.outputs.tree }}
      - uses: dorny/paths-filter@v4
        if: github.event_name != 'schedule'
        id: filter
        with:
          base: ${{ needs.plan.outputs.base || github.event.repository.default_branch }}
          ref: ${{ needs.plan.outputs.base && steps.prepared.outputs.commit || '' }}
          predicate-quantifier: 'some-with-excludes'
          filters: |
            code:
              - 'ecs-policy.ron'
              - 'crates/**'
              - 'examples/framework-consumer/**'
              - 'examples/host-consumer/**'
              - 'cef/**'
              - 'patches/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'tool-versions.env'
              - 'scripts/**'
              - '.github/actions/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/nightly.yml'
              - '.github/workflows/build-cef.yml'
            website:
              - 'website/**'
            macos:
              - 'crates/**'
              - 'cef/**'
              - 'patches/**'
              - 'packaging/**'
              - 'scripts/**'
              - '.github/actions/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'tool-versions.env'
              - '.github/workflows/ci.yml'
              - '.github/workflows/nightly.yml'
              - '.github/workflows/build-cef.yml'
              - '.github/workflows/release.yml'
              - '!crates/app/vmux_mobile/**'
              - '!packaging/ios/**'
            macos_package:
              - 'crates/app/vmux_desktop/**'
              - 'crates/app/vmux_cli/**'
              - 'crates/feature/vmux_dx/**'
              - 'crates/util/vmux_app/**'
              - 'crates/util/vmux_browser/**'
              - 'crates/util/vmux_clipboard/**'
              - 'crates/util/vmux_native/**'
              - 'crates/util/vmux_process/**'
              - 'crates/feature/vmux_capture/**'
              - 'crates/**/Cargo.toml'
              - 'crates/**/build.rs'
              - 'crates/build_*.rs'
              - 'cef/**'
              - 'patches/**'
              - 'packaging/**'
              - 'scripts/**'
              - '.github/actions/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/nightly.yml'
              - '.github/workflows/build-cef.yml'
              - '.github/workflows/release.yml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'tool-versions.env'
              - '!crates/app/vmux_mobile/**'
              - '!packaging/ios/**'
            ios:
              - 'crates/**'
              - 'packaging/ios/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'tool-versions.env'
              - 'crates/feature/vmux_dx/src/native/ios.rs'
              - '.github/actions/**'
              - '.github/workflows/ci.yml'
              - '!crates/app/vmux_desktop/**'
              - '!crates/util/vmux_native/**'
              - '!patches/**'

      - uses: ./.github/actions/setup-rust
        if: >-
          needs.plan.outputs.base != '' &&
          (github.event_name == 'pull_request' || needs.plan.outputs.feature == 'true') &&
          (steps.filter.outputs.macos == 'true' || steps.filter.outputs.ios == 'true')

      - name: Classify native build inputs
        id: native
        if: >-
          needs.plan.outputs.base != '' &&
          (github.event_name == 'pull_request' || needs.plan.outputs.feature == 'true') &&
          (steps.filter.outputs.macos == 'true' || steps.filter.outputs.ios == 'true')
        env:
          VMUX_CI_BASE: ${{ needs.plan.outputs.base }}
        run: vmux ci-native >> "$GITHUB_OUTPUT"

  deps-rust:
    name: Deps (rust)
    runs-on: ubuntu-latest
    needs: [plan, changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.head }}

      - uses: ./.github/actions/prepare-ci
        with:
          head: ${{ needs.plan.outputs.head }}
          base: ${{ needs.plan.outputs.base }}
          tree: ${{ needs.plan.outputs.tree }}

      - uses: ./.github/actions/setup-rust

      - name: No crate on the headless path links bevy_cef
        run: |
          set -euo pipefail

          out=$(mktemp)
          err=$(mktemp)

          query_cef() {
            local status
            set +e
            cargo tree --locked "$@" -i bevy_cef >"$out" 2>"$err"
            status=$?
            set -e
            if [ "$status" -ne 0 ] && ! grep -q 'did not match any packages' "$err"; then
              echo "::error::cargo tree failed, so this job proved nothing:"
              cat "$err" >&2
              exit 1
            fi
            [ "$status" -eq 0 ] || : >"$out"
          }

          query_cef -p vmux_desktop
          if [ ! -s "$out" ]; then
            echo "::error::positive control failed: bevy_cef not found in vmux_desktop, so this job is asserting nothing"
            exit 1
          fi
          echo "control ok: vmux_desktop links bevy_cef"

          query_cef -p vmux_session --no-default-features
          if [ -s "$out" ]; then
            echo "::error::render-free vmux_session links bevy_cef:"
            cat "$out"
            exit 1
          fi
          echo "ok: render-free vmux_session does not link bevy_cef"

      - name: The server links no client-only crate
        run: |
          set -euo pipefail

          out=$(mktemp)
          err=$(mktemp)

          query() {
            local status
            set +e
            cargo tree --locked --target x86_64-unknown-linux-gnu -p "$1" -i "$2" >"$out" 2>"$err"
            status=$?
            set -e
            if [ "$status" -ne 0 ] && ! grep -q 'did not match any packages' "$err"; then
              echo "::error::cargo tree failed for $1 -i $2, so this job proved nothing:"
              cat "$err" >&2
              exit 1
            fi
            [ "$status" -eq 0 ] || : >"$out"
          }

          query vmux_desktop vmux_ui
          if [ ! -s "$out" ]; then
            echo "::error::positive control failed: vmux_ui not found in vmux_desktop, so this job is asserting nothing"
            exit 1
          fi
          echo "control ok: vmux_desktop links vmux_ui"

          for pkg in vmux_ui vmux_layout vmux_editor vmux_terminal vmux_browser; do
            query vmux_service "$pkg"
            if [ -s "$out" ]; then
              echo "::error::vmux_service links client-only crate $pkg:"
              cat "$out"
              exit 1
            fi
            echo "ok: vmux_service does not link $pkg"
          done

      - name: Render-free vmux_session builds alone
        run: env -u CEF_PATH cargo check --locked -p vmux_session --all-targets --no-default-features

  ios-build:
    name: Build iOS App
    runs-on: macos-latest
    needs: [plan, changes]
    if: needs.changes.outputs.ios == 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.head }}

      - uses: ./.github/actions/prepare-ci
        with:
          head: ${{ needs.plan.outputs.head }}
          base: ${{ needs.plan.outputs.base }}
          tree: ${{ needs.plan.outputs.tree }}

      - uses: ./.github/actions/setup-ios
        with:
          cache-key: ios
          tailwind: "true"

      - name: Generate the tailwind bundle dx would
        run: |
          tailwindcss \
            -i crates/app/vmux_mobile/assets/tailwind.css \
            -o crates/app/vmux_mobile/assets/tailwind.out.css

      - name: Build the phone app
        run: cargo build --locked -p vmux_mobile --target aarch64-apple-ios --features mobile --bin vmux_mobile

      - name: Test the phone app
        run: cargo test --locked -p vmux_mobile --target aarch64-apple-darwin --features mobile --bin vmux_mobile

      - name: Check the pages that ship on the phone
        run: |
          cargo check --locked --target aarch64-apple-ios \
            -p vmux_acp -p vmux_session -p vmux_command -p vmux_editor -p vmux_history -p vmux_shortcut \
            -p vmux_layout -p vmux_setting -p vmux_space -p vmux_start -p vmux_team \
            -p vmux_terminal -p vmux_ui

      - name: The phone links no desktop-only crate
        run: |
          set -euo pipefail

          reaches() {
            cargo tree --locked --target aarch64-apple-ios -p "$1" -i "$2" 2>/dev/null
          }

          while read -r forbidden control_package control_crate; do
            [ -n "$forbidden" ] || continue
            if [ -z "$(reaches "$control_package" "$control_crate")" ]; then
              echo "::error::positive control failed: $control_crate not found in $control_package, so this job is asserting nothing about $forbidden"
              exit 1
            fi
            found="$(reaches vmux_mobile "$forbidden")"
            if [ -n "$found" ]; then
              echo "::error::$forbidden reaches the phone:"
              echo "$found"
              exit 1
            fi
            echo "ok: vmux_mobile does not link $forbidden (control: $control_package links $control_crate)"
          done <<'FORBIDDEN'
          dioxus-web vmux_mobile dioxus
          bevy_cef vmux_desktop bevy_cef
          FORBIDDEN

  lint:
    name: ${{ github.event_name == 'push' && needs.plan.outputs.feature == 'true' && 'Preflight Lint' || 'Lint' }}
    runs-on: ubuntu-latest
    needs: [plan, changes, format-rust, lint-rust, deps-rust]
    if: always()
    steps:
      - name: Gate
        env:
          PLAN: ${{ needs.plan.result }}
          PREFLIGHT: ${{ needs.plan.outputs.reuse }}
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          FORMAT: ${{ needs.format-rust.result }}
          RESULT: ${{ needs.lint-rust.result }}
          DEPS: ${{ needs.deps-rust.result }}
        run: |
          if [ "$PLAN" != "success" ]; then
            echo "::error::CI planning did not succeed ($PLAN)"
            exit 1
          fi
          if [ -n "$PREFLIGHT" ]; then
            echo "Reused verified branch CI run $PREFLIGHT"
            exit 0
          fi
          if [ "$CHANGES" != "success" ]; then
            echo "::error::Detect Changes did not succeed ($CHANGES)"
            exit 1
          fi
          if [ "$CODE" = "true" ] && [ "$RESULT" != "success" ]; then
            echo "::error::Lint (rust) result: $RESULT"
            exit 1
          fi
          if [ "$CODE" = "true" ] && [ "$FORMAT" != "success" ]; then
            echo "::error::Format (rust) result: $FORMAT"
            exit 1
          fi
          if [ "$CODE" = "true" ] && [ "$DEPS" != "success" ]; then
            echo "::error::Deps (rust) result: $DEPS"
            exit 1
          fi
          echo "Lint gate ok (code=$CODE format=$FORMAT rust=$RESULT deps=$DEPS)"

  test:
    name: ${{ github.event_name == 'push' && needs.plan.outputs.feature == 'true' && 'Preflight Test' || 'Test' }}
    runs-on: ubuntu-latest
    needs: [plan, changes, test-rust, test-policy, test-sdk-path, test-sdk-git, test-headless]
    if: always()
    steps:
      - name: Gate
        env:
          PLAN: ${{ needs.plan.result }}
          PREFLIGHT: ${{ needs.plan.outputs.reuse }}
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          RUST_TEST: ${{ needs.test-rust.result }}
          POLICY: ${{ needs.test-policy.result }}
          SDK_PATH: ${{ needs.test-sdk-path.result }}
          SDK_GIT: ${{ needs.test-sdk-git.result }}
          HEADLESS: ${{ needs.test-headless.result }}
        run: |
          if [ "$PLAN" != "success" ]; then
            echo "::error::CI planning did not succeed ($PLAN)"
            exit 1
          fi
          if [ -n "$PREFLIGHT" ]; then
            echo "Reused verified branch CI run $PREFLIGHT"
            exit 0
          fi
          if [ "$CHANGES" != "success" ]; then
            echo "::error::Detect Changes did not succeed ($CHANGES)"
            exit 1
          fi
          if [ "$CODE" = "true" ]; then
            for ci_check in RUST_TEST POLICY SDK_PATH SDK_GIT HEADLESS; do
              ci_result="${!ci_check}"
              if [ "$ci_result" != "success" ]; then
                echo "::error::$ci_check result: $ci_result"
                exit 1
              fi
            done
          fi
          echo "Test gate ok (code=$CODE)"

  build-macos:
    name: ${{ github.event_name == 'push' && needs.plan.outputs.feature == 'true' && 'Preflight Build macOS' || 'Build macOS' }}
    runs-on: ubuntu-latest
    needs: [plan, changes, check-mac, build-mac]
    if: always()
    steps:
      - name: Gate
        env:
          PLAN: ${{ needs.plan.result }}
          PREFLIGHT: ${{ needs.plan.outputs.reuse }}
          CHANGES: ${{ needs.changes.result }}
          MACOS: ${{ needs.changes.outputs.macos }}
          PACKAGE: ${{ !(github.event_name == 'pull_request' || needs.plan.outputs.feature == 'true') || needs.changes.outputs.macos_package == 'true' }}
          CHECK: ${{ needs.check-mac.result }}
          RESULT: ${{ needs.build-mac.result }}
        run: |
          if [ "$PLAN" != "success" ]; then
            echo "::error::CI planning did not succeed ($PLAN)"
            exit 1
          fi
          if [ -n "$PREFLIGHT" ]; then
            echo "Reused verified branch CI run $PREFLIGHT"
            exit 0
          fi
          if [ "$CHANGES" != "success" ]; then
            echo "::error::Detect Changes did not succeed ($CHANGES)"
            exit 1
          fi
          if [ "$MACOS" = "true" ]; then
            if [ "$PACKAGE" = "true" ]; then
              if [ "$RESULT" != "success" ]; then
                echo "::error::Build macOS App result: $RESULT"
                exit 1
              fi
            elif [ "$CHECK" != "success" ]; then
              echo "::error::Check macOS result: $CHECK"
              exit 1
            fi
          fi
          echo "Build macOS gate ok (macos=$MACOS package=$PACKAGE check=$CHECK build=$RESULT)"

  build-ios:
    name: ${{ github.event_name == 'push' && needs.plan.outputs.feature == 'true' && 'Preflight Build iOS' || 'Build iOS' }}
    runs-on: ubuntu-latest
    needs: [plan, changes, ios-build]
    if: always()
    steps:
      - name: Gate
        env:
          PLAN: ${{ needs.plan.result }}
          PREFLIGHT: ${{ needs.plan.outputs.reuse }}
          CHANGES: ${{ needs.changes.result }}
          IOS: ${{ needs.changes.outputs.ios }}
          RESULT: ${{ needs.ios-build.result }}
        run: |
          if [ "$PLAN" != "success" ]; then
            echo "::error::CI planning did not succeed ($PLAN)"
            exit 1
          fi
          if [ -n "$PREFLIGHT" ]; then
            echo "Reused verified branch CI run $PREFLIGHT"
            exit 0
          fi
          if [ "$CHANGES" != "success" ]; then
            echo "::error::Detect Changes did not succeed ($CHANGES)"
            exit 1
          fi
          if [ "$IOS" = "true" ] && [ "$RESULT" != "success" ]; then
            echo "::error::Build iOS App result: $RESULT"
            exit 1
          fi
          echo "Build iOS gate ok (ios=$IOS build=$RESULT)"

  website:
    name: Website Build
    needs: [plan, changes]
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.head }}

      - uses: ./.github/actions/prepare-ci
        with:
          head: ${{ needs.plan.outputs.head }}
          base: ${{ needs.plan.outputs.base }}
          tree: ${{ needs.plan.outputs.tree }}

      - uses: ./.github/actions/setup-web
        with:
          cache-key: website

      - name: Build website
        working-directory: website
        run: dx build --platform web --release

  check-mac:
    name: Check macOS
    needs: [plan, changes, cef-version]
    if: needs.changes.outputs.macos == 'true' && (github.event_name == 'pull_request' || needs.plan.outputs.feature == 'true') && needs.changes.outputs.macos_package != 'true'
    runs-on: macos-latest
    env:
      VMUX_CEF_SDK_CACHE: ${{ github.workspace }}/.cache/cef-sdk
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.head }}

      - uses: ./.github/actions/prepare-ci
        with:
          head: ${{ needs.plan.outputs.head }}
          base: ${{ needs.plan.outputs.base }}
          tree: ${{ needs.plan.outputs.tree }}

      - uses: ./.github/actions/setup-macos
        with:
          cache-key: check-mac
          cef-version: ${{ needs.cef-version.outputs.version }}
          packaging: "false"

      - name: Check desktop, CLI, and daemon
        run: vmux internal cargo -- check --locked -p vmux_desktop -p vmux_cli -p vmux_app --all-targets --features vmux_desktop/package,vmux_app/service-daemon

      - name: Verify generated UI assets
        run: vmux internal verify-web-bundle

      - name: Check lean macOS desktop features
        run: vmux internal cargo -- check --locked -p vmux_desktop --no-default-features --features dev

  build-mac:
    name: Build macOS App
    needs: [plan, changes, cef-version]
    if: needs.changes.outputs.macos == 'true' && (!(github.event_name == 'pull_request' || needs.plan.outputs.feature == 'true') || needs.changes.outputs.macos_package == 'true')
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      CEF_VERSION: ${{ needs.cef-version.outputs.version }}
      VMUX_CEF_SDK_CACHE: ${{ github.workspace }}/.cache/cef-sdk
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.head }}

      - uses: ./.github/actions/prepare-ci
        with:
          head: ${{ needs.plan.outputs.head }}
          base: ${{ needs.plan.outputs.base }}
          tree: ${{ needs.plan.outputs.tree }}

      - uses: ./.github/actions/setup-rust

      - name: Detect release PR + idempotency
        id: relprep
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          vmux internal release-artifacts -- "$VERSION" > "$RUNNER_TEMP/dx-release.env"
          while IFS="=" read -r key value; do export "$key=$value"; done < "$RUNNER_TEMP/dx-release.env"
          {
            echo "VERSION=$VERSION"
            echo "TAG=$VMUX_RELEASE_TAG"
            echo "DMG_NAME=$VMUX_DMG_NAME"
            echo "BINARY_ARCHIVE_NAME=$VMUX_BINARY_ARCHIVE_NAME"
            echo "APP_ARCHIVE_NAME=$VMUX_APP_ARCHIVE_NAME"
            echo "APP_SIGNATURE_NAME=$VMUX_APP_SIGNATURE_NAME"
            echo "CLI_ARCHIVE_NAME=$VMUX_CLI_ARCHIVE_NAME"
            echo "CLI_SIGNATURE_NAME=$VMUX_CLI_SIGNATURE_NAME"
            echo "DMG_URL=$VMUX_DMG_URL"
          } >> "$GITHUB_ENV"

          if [ -z "${BASE_SHA:-}" ]; then
            echo "Not a pull_request event; skipping release prep."
            echo "IS_RELEASE_PR=0" >> "$GITHUB_ENV"
            exit 0
          fi

          BASE_VERSION=$(git show "${BASE_SHA}:Cargo.toml" 2>/dev/null | grep -m1 '^version' | sed 's/.*"\(.*\)".*/\1/' || true)
          if [ "$BASE_VERSION" = "$VERSION" ]; then
            echo "Version unchanged ($VERSION); not a release PR."
            echo "IS_RELEASE_PR=0" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "Release PR detected: $BASE_VERSION -> $VERSION"
          echo "IS_RELEASE_PR=1" >> "$GITHUB_ENV"

          if gh release view "$VMUX_RELEASE_TAG" --json isDraft,assets >/tmp/r.json 2>/dev/null; then
            asset_count=$(jq '.assets | length' /tmp/r.json)
            CASK_URL=$(grep -m1 '^  url' Casks/vmux.rb | sed 's/.*"\(.*\)".*/\1/')
            if [ "$asset_count" -ge 6 ] && [ "$CASK_URL" = "$VMUX_DMG_URL" ]; then
              echo "Draft release ready and cask matches; release prep already complete."
              echo "PREP_DONE=1" >> "$GITHUB_ENV"
            fi
          fi

      - name: Configure fast PR package build
        if: (github.event_name == 'pull_request' || needs.plan.outputs.feature == 'true') && needs.plan.outputs.release != 'true' && env.IS_RELEASE_PR != '1'
        run: |
          {
            echo "VMUX_CI_FAST_PACKAGE=1"
            echo "VMUX_CI_PREFLIGHT=${{ needs.plan.outputs.feature }}"
            echo "CARGO_PROFILE_RELEASE_LTO=off"
            echo "RUSTFLAGS=${RUSTFLAGS:+$RUSTFLAGS }-C opt-level=1 -C codegen-units=16"
          } >> "$GITHUB_ENV"

      - uses: ./.github/actions/setup-macos
        with:
          cache-key: ${{ (github.event_name == 'pull_request' || needs.plan.outputs.feature == 'true') && needs.plan.outputs.release != 'true' && env.IS_RELEASE_PR != '1' && 'build-mac-pr' || 'build-mac' }}
          cef-version: ${{ needs.cef-version.outputs.version }}

      - name: Check lean macOS desktop features
        run: env VMUX_SKIP_DX_BUILD=1 vmux internal cargo -- check -p vmux_desktop --no-default-features --features dev

      - name: Build, sign, notarize, and package DMG
        if: env.PREP_DONE != '1'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VMUX_UPDATE_PUBLIC_KEY: ${{ secrets.VMUX_UPDATE_PUBLIC_KEY }}
        run: |
          if [ "$IS_RELEASE_PR" != "1" ]; then
            export SKIP_NOTARIZE=1
          fi
          vmux build -p release

      - name: Smoke test bundled app
        if: env.PREP_DONE != '1'
        run: |
          set -uo pipefail
          app="target/release/Vmux.app"
          bin="$app/Contents/MacOS/vmux_desktop"
          plist="$app/Contents/Frameworks/Chromium Embedded Framework.framework/Resources/Info.plist"

          want="${CEF_VERSION##*+}"
          got=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$plist" 2>/dev/null || true)
          echo "Bundled CEF framework: ${got:-<none>} | cef crate: $CEF_VERSION (expect prefix $want)"
          case "$got" in
            "$want" | "$want".*) ;;
            *)
              echo "::error::Bundled CEF (${got:-<none>}) does not match cef crate ($CEF_VERSION)"
              exit 1
              ;;
          esac

          VMUX_DATA_DIR="$(mktemp -d)"
          export VMUX_DATA_DIR
          log="$(mktemp)"
          "$bin" >"$log" 2>&1 &
          pid=$!
          rc=0
          sleep 25
          if kill -0 "$pid" 2>/dev/null; then
            echo "Vmux survived the 25s startup window — OK"
          else
            wait "$pid"
            code=$?
            echo "::error::Vmux exited during startup (exit $code) — startup crash"
            rc=1
          fi

          kill "$pid" 2>/dev/null || true
          pkill -f "Vmux.app/Contents/MacOS/vmux_desktop" 2>/dev/null || true
          pkill -f "vmux_service" 2>/dev/null || true
          pkill -f "Chromium Embedded Framework" 2>/dev/null || true

          echo "----- startup log -----"
          cat "$log" || true
          exit $rc

      - name: Archive PR app bundle
        if: env.PREP_DONE != '1' && env.VMUX_CI_FAST_PACKAGE == '1'
        run: tar -C target/release -czf target/release/Vmux-pr.app.tar.gz Vmux.app

      - name: Upload PR app artifact
        if: env.PREP_DONE != '1' && env.VMUX_CI_FAST_PACKAGE == '1'
        uses: actions/upload-artifact@v6
        with:
          name: Vmux-${{ github.sha }}.app
          path: target/release/Vmux-pr.app.tar.gz
          retention-days: 7

      - name: Upload .dmg artifact
        if: env.PREP_DONE != '1' && env.IS_RELEASE_PR != '1' && env.VMUX_CI_FAST_PACKAGE != '1'
        uses: actions/upload-artifact@v6
        with:
          name: Vmux-${{ github.sha }}.dmg
          path: target/release/${{ env.DMG_NAME }}
          retention-days: 7

      - name: Create binary tarball
        if: env.PREP_DONE != '1' && env.IS_RELEASE_PR == '1'
        run: |
          cd target/release/Vmux.app/Contents/MacOS
          tar czf "$GITHUB_WORKSPACE/target/release/${BINARY_ARCHIVE_NAME}" vmux_desktop

      - name: Create app bundle tarball
        if: env.PREP_DONE != '1' && env.IS_RELEASE_PR == '1'
        run: |
          cd target/release
          tar czf "$APP_ARCHIVE_NAME" Vmux.app

      - name: Build and sign standalone CLI release
        if: env.PREP_DONE != '1' && env.IS_RELEASE_PR == '1'
        env:
          VMUX_UPDATE_PUBLIC_KEY: ${{ secrets.VMUX_UPDATE_PUBLIC_KEY }}
          VMUX_UPDATE_PRIVATE_KEY: ${{ secrets.VMUX_UPDATE_PRIVATE_KEY }}
          VMUX_UPDATE_PRIVATE_KEY_PASSWORD: ${{ secrets.VMUX_UPDATE_PRIVATE_KEY_PASSWORD }}
        run: vmux internal cli-release

      - name: Sign update artifact (minisign)
        if: env.PREP_DONE != '1' && env.IS_RELEASE_PR == '1'
        env:
          VMUX_UPDATE_PRIVATE_KEY: ${{ secrets.VMUX_UPDATE_PRIVATE_KEY }}
          VMUX_UPDATE_PRIVATE_KEY_PASSWORD: ${{ secrets.VMUX_UPDATE_PRIVATE_KEY_PASSWORD }}
        run: |
          TARBALL="target/release/${APP_ARCHIVE_NAME}"
          cargo packager signer sign "${TARBALL}" \
            --private-key "${VMUX_UPDATE_PRIVATE_KEY}" \
            --password "${VMUX_UPDATE_PRIVATE_KEY_PASSWORD}"

      - name: Create or update draft release with assets
        if: env.PREP_DONE != '1' && env.IS_RELEASE_PR == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          ASSETS=(
            "target/release/${DMG_NAME}"
            "target/release/${BINARY_ARCHIVE_NAME}"
            "target/release/${APP_ARCHIVE_NAME}"
            "target/release/${APP_SIGNATURE_NAME}"
            ".build-tools/standalone/release/${CLI_ARCHIVE_NAME}"
            ".build-tools/standalone/release/${CLI_SIGNATURE_NAME}"
          )
          if gh release view "$TAG" --json isDraft >/tmp/r.json 2>/dev/null; then
            is_draft=$(jq -r .isDraft /tmp/r.json)
            if [ "$is_draft" != "true" ]; then
              echo "::error::Release $TAG already published; refusing to upload."
              exit 1
            fi
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" \
              --draft \
              --target "$HEAD_SHA" \
              --title "Vmux $TAG" \
              --generate-notes \
              "${ASSETS[@]}"
          fi

      - name: Require release metadata commit
        if: env.IS_RELEASE_PR == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: vmux internal update-release-metadata -- --check

  record-preflight:
    name: Record preflight
    runs-on: ubuntu-latest
    needs: [plan, changes, lint, test, build-macos, build-ios, website]
    if: >-
      always() && needs.plan.result == 'success' && needs.plan.outputs.feature == 'true' &&
      needs.plan.outputs.reusable == 'true' && needs.lint.result == 'success' &&
      needs.test.result == 'success' && needs.build-macos.result == 'success' &&
      needs.build-ios.result == 'success'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.head }}
      - name: Validate results and record input identity
        env:
          VMUX_CI_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/ci-preflight.js record
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ needs.plan.outputs.receipt }}
          path: ci-preflight.json
          if-no-files-found: error
          retention-days: 7
