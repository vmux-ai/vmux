name: Code & App quality

on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - 'Casks/**'
      - 'website/public/updates.json'
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: read
  actions: read
  pull-requests: read
  id-token: write

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  DX_HOME: ${{ github.workspace }}/.dx
  VMUX_CI_PREBUILT_DX: "1"
  VMUX_CI_FAST_RUST: "1"
  VMUX_CI_VALIDATION: "1"
  VMUX_CI_GCS_ENABLED: "1"
  CI_CACHE_BUCKET: ${{ vars.CI_CACHE_BUCKET }}
  CI_CACHE_WIF_PROVIDER: ${{ vars.CI_CACHE_WIF_PROVIDER }}
  CI_CACHE_READER_ACCOUNT: ${{ vars.CI_CACHE_READER_ACCOUNT }}
  CI_CACHE_WRITER_ACCOUNT: ${{ vars.CI_CACHE_WRITER_ACCOUNT }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      head: ${{ steps.plan.outputs.head }}
      base: ${{ steps.plan.outputs.base }}
      tree: ${{ steps.plan.outputs.tree }}
      cef: ${{ steps.resolve.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
      presentation_only: ${{ steps.plan.outputs.presentation_only }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-ci
      - name: Verify merge
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: vmux-ci plan >> "$GITHUB_OUTPUT"
      - name: Resolve cef crate version from Cargo.lock
        id: resolve
        run: |
          set -euo pipefail
          version=$(awk -F'"' '/^name = "cef"$/{getline; print $2; exit}' Cargo.lock)
          if [ -z "${version:-}" ]; then
            echo "::error file=Cargo.lock::could not resolve 'cef' crate version"
            exit 1
          fi
          echo "Resolved CEF version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/report-compiler-cache
        if: always() && env.VMUX_CI_COMPILER_CACHE_READY == '1'
        with:
          name: ${{ github.job }}

  changes:
    name: Prepare
    needs: [plan]
    runs-on: ubuntu-latest
    outputs:
      website: ${{ needs.plan.outputs.presentation_only != 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.website == 'true') }}
      macos: ${{ needs.plan.outputs.presentation_only != 'true' && (github.event_name != 'schedule' && (github.event_name == 'workflow_dispatch' || steps.filter.outputs.macos == 'true' || (github.event_name == 'push' && steps.filter.outputs.macos_main == 'true')) && steps.native.outputs.native != 'false') }}
      macos_tooling: ${{ needs.plan.outputs.presentation_only != 'true' && (steps.filter.outputs.macos_tooling == 'true' && steps.native.outputs.native != 'false') }}
      ios: ${{ needs.plan.outputs.presentation_only != 'true' && (github.event_name != 'pull_request' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.ios == 'true') && steps.native.outputs.native != 'false') }}
      code: ${{ needs.plan.outputs.presentation_only != 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.code == 'true') }}
      compiler_lints: ${{ steps.scope.outputs.rust == 'true' || steps.scope.outputs.desktop == 'true' || steps.scope.outputs.tooling == 'true' }}
      contracts: ${{ steps.scope.outputs.sdk == 'true' }}
      headless: ${{ steps.scope.outputs.headless == 'true' }}
      rust: ${{ steps.scope.outputs.rust == 'true' }}
      records: ${{ steps.scope.outputs.records == 'true' }}
      render_free: ${{ steps.scope.outputs.render_free == 'true' }}
      tooling: ${{ steps.scope.outputs.tooling == 'true' }}
      args: ${{ steps.scope.outputs.args }}
      lint_args: ${{ steps.scope.outputs.lint_args }}
      desktop: ${{ steps.scope.outputs.desktop == 'true' }}
      legacy_desktop: ${{ github.event_name == 'schedule' }}
      tests: ${{ steps.checks.outputs.tests }}
      test_count: ${{ steps.checks.outputs.test_count }}
      check_lint: ${{ steps.checks.outputs.check_lint }}
      reuse_lint: ${{ steps.checks.outputs.reuse_lint }}
      check_test_rust: ${{ steps.checks.outputs.check_test_rust }}
      reuse_test_rust: ${{ steps.checks.outputs.reuse_test_rust }}
      check_test_desktop: ${{ steps.checks.outputs.check_test_desktop }}
      reuse_test_desktop: ${{ steps.checks.outputs.reuse_test_desktop }}
      check_test_features: ${{ steps.checks.outputs.check_test_features }}
      reuse_test_features: ${{ steps.checks.outputs.reuse_test_features }}
      check_test_ecs: ${{ steps.checks.outputs.check_test_ecs }}
      reuse_test_ecs: ${{ steps.checks.outputs.reuse_test_ecs }}
      check_website: ${{ steps.checks.outputs.check_website }}
      reuse_website: ${{ steps.checks.outputs.reuse_website }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.head }}

      - uses: ./.github/actions/prepare-ci
        id: prepared
        with:
          head: ${{ needs.plan.outputs.head }}
          base: ${{ needs.plan.outputs.base }}
          tree: ${{ needs.plan.outputs.tree }}
      - uses: dorny/paths-filter@v4
        if: github.event_name != 'schedule'
        id: filter
        with:
          base: ${{ needs.plan.outputs.base || github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && github.event.before || github.event.repository.default_branch }}
          ref: ${{ needs.plan.outputs.base && steps.prepared.outputs.commit || '' }}
          predicate-quantifier: 'some-with-excludes'
          filters: |
            code:
              - '.github/**'
              - 'packaging/**'
              - 'docs/architecture.md'
              - 'docs/dx/architecture.md'
              - '.cargo/**'
              - '.gitattributes'
              - '.env'
              - '.env.*'
              - '**/ecs-policy.ron'
              - 'website/src/**'
              - 'website/build.rs'
              - 'website/Cargo.toml'
              - 'website/Cargo.lock'
              - 'crates/**'
              - 'examples/framework-consumer/**'
              - 'examples/host-consumer/**'
              - 'cef/**'
              - 'patches/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'tool-versions.env'
              - 'scripts/**'
              - '.github/actions/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/nightly.yml'
              - '.github/workflows/build-cef.yml'
            website:
              - 'website/**'
              - 'docs/**'
              - '.github/**'
              - '.cargo/**'
              - '.gitattributes'
              - '.env'
              - '.env.*'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'tool-versions.env'
              - 'scripts/**'
            macos:
              - '.github/**'
              - '.cargo/**'
              - '.gitattributes'
              - '.env'
              - '.env.*'
              - 'crates/**'
              - 'cef/**'
              - 'patches/**'
              - 'packaging/**'
              - 'scripts/**'
              - '.github/actions/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'tool-versions.env'
              - '.github/workflows/ci.yml'
              - '.github/workflows/nightly.yml'
              - '.github/workflows/build-cef.yml'
              - '.github/workflows/release.yml'
              - '!crates/app/vmux_mobile/**'
              - '!packaging/ios/**'
              - '!crates/feature/vmux_dx/src/native/ios.rs'
              - '!crates/app/vmux_cli/tests/dx.rs'
            macos_main:
              - 'crates/feature/vmux_dx/src/native/ios.rs'
              - 'crates/app/vmux_cli/tests/dx.rs'
            macos_tooling:
              - '.github/**'
              - '.cargo/**'
              - '.gitattributes'
              - '.env'
              - '.env.*'
              - 'crates/app/vmux_cli/**'
              - 'crates/feature/vmux_dx/**'
              - 'crates/build_product.rs'
              - 'crates/util/vmux_profile/**'
              - 'crates/**/Cargo.toml'
              - 'crates/**/build.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'tool-versions.env'
              - '.github/actions/setup-rust/**'
              - '.github/workflows/ci.yml'
            ios:
              - '.github/**'
              - '.cargo/**'
              - '.gitattributes'
              - '.env'
              - '.env.*'
              - 'crates/**'
              - 'packaging/ios/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'tool-versions.env'
              - 'crates/feature/vmux_dx/src/native/ios.rs'
              - '.github/actions/**'
              - '.github/workflows/ci.yml'
              - '!crates/app/vmux_desktop/**'
              - '!crates/util/vmux_native/**'
              - '!crates/app/vmux_cli/tests/dx.rs'
              - '!patches/**'

      - uses: ./.github/actions/setup-rust
        id: rust
        with:
          cli: build
          fast-rust: "false"
        if: needs.plan.outputs.presentation_only != 'true' && (github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' || steps.filter.outputs.website == 'true' || steps.filter.outputs.macos == 'true' || steps.filter.outputs.macos_main == 'true' || steps.filter.outputs.macos_tooling == 'true' || steps.filter.outputs.ios == 'true')

      - name: Select Rust validation scope
        id: scope
        if: needs.plan.outputs.presentation_only != 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.code == 'true')
        env:
          VMUX_CI_BASE: ${{ github.event_name == 'pull_request' && needs.plan.outputs.base || github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && github.event.before || '' }}
        run: vmux ci-scope >> "$GITHUB_OUTPUT"

      - name: Classify native build inputs
        id: native
        if: >-
          needs.plan.outputs.base != '' &&
          needs.plan.outputs.release == 'true' &&
          (steps.filter.outputs.macos == 'true' || steps.filter.outputs.ios == 'true' || steps.filter.outputs.macos_tooling == 'true')
        env:
          VMUX_CI_BASE: ${{ needs.plan.outputs.base }}
        run: vmux ci-native >> "$GITHUB_OUTPUT"

      - name: Reuse successful checks with identical inputs
        id: checks
        env:
          GH_TOKEN: ${{ github.token }}
          VMUX_CHECK_PR: ${{ github.event.pull_request.number || 0 }}
          VMUX_CHECK_BRANCH: ${{ github.event.pull_request.head.ref }}
          VMUX_CHECK_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          VMUX_CHECK_BASE: ${{ needs.plan.outputs.base }}
          VMUX_CHECK_TREE: ${{ needs.plan.outputs.tree }}
          VMUX_CHECK_RELEASE: ${{ needs.plan.outputs.release }}
          VMUX_LINT_SCOPE: ${{ steps.scope.outputs.lint_args }}
          VMUX_TEST_SCOPE: ${{ steps.scope.outputs.args }}
          VMUX_CHECK_INPUTS: ${{ steps.scope.outputs.inputs }}
          VMUX_RECORDS: ${{ steps.scope.outputs.records }}
          VMUX_CODE_REQUIRED: ${{ needs.plan.outputs.presentation_only != 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.code == 'true') }}
          VMUX_RUST_REQUIRED: ${{ steps.scope.outputs.rust }}
          VMUX_SDK_REQUIRED: ${{ steps.scope.outputs.sdk }}
          VMUX_DESKTOP_REQUIRED: ${{ steps.scope.outputs.desktop }}
          VMUX_FEATURES_REQUIRED: ${{ steps.scope.outputs.headless == 'true' || github.event_name == 'schedule' }}
          VMUX_COMPILER_REQUIRED: ${{ steps.scope.outputs.rust == 'true' || steps.scope.outputs.desktop == 'true' || steps.scope.outputs.tooling == 'true' }}
          VMUX_LEGACY_DESKTOP: ${{ github.event_name == 'schedule' }}
        run: vmux-ci checks-plan >> "$GITHUB_OUTPUT"

      - name: Record the CLI identity
        if: steps.rust.outcome == 'success'
        run: vmux-ci artifact-publish .build-tools/bin/vmux .build-tools/artifact
      - uses: actions/upload-artifact@v6
        if: steps.rust.outcome == 'success'
        with:
          name: dx-cli-${{ runner.os }}-${{ runner.arch }}
          overwrite: true
          include-hidden-files: true
          path: .build-tools/artifact
          if-no-files-found: error
          retention-days: 1

      - uses: ./.github/actions/report-compiler-cache
        if: always() && env.VMUX_CI_COMPILER_CACHE_READY == '1'
        with:
          name: ${{ github.job }}

  lint-rust:
    name: Lint Rust
    runs-on: ubuntu-latest
    needs: [plan, changes]
    if: needs.changes.outputs.code == 'true' && !needs.changes.outputs.reuse_lint
    steps:
      - name: Require CI preparation
        env:
          PLAN: ${{ needs.plan.result }}
          CHANGES: ${{ needs.changes.result }}
        run: |
          set -euo pipefail
          test "$PLAN" = success
          test "$CHANGES" = success
      - uses: actions/checkout@v5
        if: needs.changes.outputs.code == 'true' && !needs.changes.outputs.reuse_lint
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.head }}

      - uses: ./.github/actions/prepare-ci
        if: needs.changes.outputs.code == 'true' && !needs.changes.outputs.reuse_lint
        with:
          head: ${{ needs.plan.outputs.head }}
          base: ${{ needs.plan.outputs.base }}
          tree: ${{ needs.plan.outputs.tree }}

      - name: Record validation inputs
        if: needs.changes.outputs.check_lint != '' && needs.changes.outputs.code == 'true' && !needs.changes.outputs.reuse_lint
        env:
          VMUX_CHECK_NAME: ${{ needs.changes.outputs.check_lint }}
          VMUX_CHECK_TREE: ${{ needs.plan.outputs.tree }}
        run: vmux-ci checks-record
      - name: Publish validation inputs
        if: needs.changes.outputs.check_lint != '' && needs.changes.outputs.code == 'true' && !needs.changes.outputs.reuse_lint
        uses: actions/upload-artifact@v6
        with:
          name: ${{ needs.changes.outputs.check_lint }}-${{ github.run_attempt }}
          path: ci-check-inputs.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - uses: ./.github/actions/setup-linux
        if: needs.changes.outputs.code == 'true' && needs.changes.outputs.compiler_lints == 'true' && !needs.changes.outputs.reuse_lint
        with:
          components: rustfmt,clippy
          cache-key: lint
          cef-version: ${{ needs.plan.outputs.cef }}
          desktop: ${{ needs.changes.outputs.compiler_lints }}

      - name: Check formatting
        if: needs.changes.outputs.code == 'true' && !needs.changes.outputs.reuse_lint && needs.changes.outputs.compiler_lints == 'true' && needs.changes.outputs.lint_args != ''
        run: cargo fmt ${{ needs.changes.outputs.lint_args }} -- --check

      - name: Clippy
        if: needs.changes.outputs.code == 'true' && !needs.changes.outputs.reuse_lint && needs.changes.outputs.compiler_lints == 'true' && needs.changes.outputs.lint_args != ''
        run: VMUX_SKIP_DX_BUILD=1 cargo clippy ${{ needs.changes.outputs.lint_args }} --all-targets -- -D warnings

      - name: Clippy CI syntax classifier
        if: needs.changes.outputs.code == 'true' && !needs.changes.outputs.reuse_lint && needs.changes.outputs.tooling == 'true'
        run: cargo clippy --locked -p vmux_dx --features ci-syntax --all-targets -- -D warnings

      - name: Clippy lean desktop features
        if: github.event_name == 'schedule' && needs.changes.outputs.code == 'true' && !needs.changes.outputs.reuse_lint && needs.changes.outputs.desktop == 'true'
        run: VMUX_SKIP_DX_BUILD=1 cargo clippy -p vmux_desktop --lib --no-default-features -- -D warnings

      - name: Clippy renderer-free record contracts
        if: needs.changes.outputs.code == 'true' && !needs.changes.outputs.reuse_lint && needs.changes.outputs.records == 'true'
        run: cargo clippy --locked -p vmux_ecs --no-default-features --features records --all-targets -- -D warnings

      - name: No crate on the headless path links bevy_cef
        if: needs.changes.outputs.code == 'true' && !needs.changes.outputs.reuse_lint && needs.changes.outputs.render_free == 'true'
        run: |
          set -euo pipefail

          out=$(mktemp)
          err=$(mktemp)

          query_cef() {
            local status
            set +e
            cargo tree --locked "$@" -i bevy_cef >"$out" 2>"$err"
            status=$?
            set -e
            if [ "$status" -ne 0 ] && ! grep -q 'did not match any packages' "$err"; then
              echo "::error::cargo tree failed, so this job proved nothing:"
              cat "$err" >&2
              exit 1
            fi
            [ "$status" -eq 0 ] || : >"$out"
          }

          query_cef -p vmux_desktop
          if [ ! -s "$out" ]; then
            echo "::error::positive control failed: bevy_cef not found in vmux_desktop, so this job is asserting nothing"
            exit 1
          fi
          echo "control ok: vmux_desktop links bevy_cef"

          query_cef -p vmux_session --no-default-features
          if [ -s "$out" ]; then
            echo "::error::render-free vmux_session links bevy_cef:"
            cat "$out"
            exit 1
          fi
          echo "ok: render-free vmux_session does not link bevy_cef"

      - name: The server links no client-only crate
        if: needs.changes.outputs.code == 'true' && !needs.changes.outputs.reuse_lint && needs.changes.outputs.headless == 'true'
        run: |
          set -euo pipefail

          out=$(mktemp)
          err=$(mktemp)

          query() {
            local status
            set +e
            cargo tree --locked --target x86_64-unknown-linux-gnu -p "$1" -i "$2" >"$out" 2>"$err"
            status=$?
            set -e
            if [ "$status" -ne 0 ] && ! grep -q 'did not match any packages' "$err"; then
              echo "::error::cargo tree failed for $1 -i $2, so this job proved nothing:"
              cat "$err" >&2
              exit 1
            fi
            [ "$status" -eq 0 ] || : >"$out"
          }

          query vmux_desktop vmux_ui
          if [ ! -s "$out" ]; then
            echo "::error::positive control failed: vmux_ui not found in vmux_desktop, so this job is asserting nothing"
            exit 1
          fi
          echo "control ok: vmux_desktop links vmux_ui"

          for pkg in vmux_ui vmux_layout vmux_editor vmux_terminal vmux_browser; do
            query vmux_service "$pkg"
            if [ -s "$out" ]; then
              echo "::error::vmux_service links client-only crate $pkg:"
              cat "$out"
              exit 1
            fi
            echo "ok: vmux_service does not link $pkg"
          done

      - name: Render-free vmux_session builds alone
        if: needs.changes.outputs.code == 'true' && !needs.changes.outputs.reuse_lint && needs.changes.outputs.render_free == 'true'
        run: env -u CEF_PATH cargo check --locked -p vmux_session --all-targets --no-default-features

      - name: CI tool lifecycle tests
        if: needs.changes.outputs.code == 'true' && !needs.changes.outputs.reuse_lint && needs.changes.outputs.tooling == 'true'
        run: cargo test --locked -p vmux_dx --features ci-syntax --lib

      - name: CLI command and packaging tests
        if: needs.changes.outputs.code == 'true' && !needs.changes.outputs.reuse_lint && needs.changes.outputs.tooling == 'true'
        run: cargo test --locked -p vmux_cli --no-default-features --features dx,ci-syntax --test dx

      - name: Save validated compiler artifacts
        uses: ./.github/actions/save-workspace
        if: needs.changes.outputs.code == 'true' && needs.changes.outputs.compiler_lints == 'true' && !needs.changes.outputs.reuse_lint
        with:
          cache-key: lint

      - uses: ./.github/actions/report-compiler-cache
        if: always() && env.VMUX_CI_COMPILER_CACHE_READY == '1'
        with:
          name: ${{ github.job }}

  lint-ecs:
    name: Lint ECS
    runs-on: ubuntu-latest
    needs: [plan, changes]
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.compiler_lints == 'true' && !needs.changes.outputs.reuse_lint
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.head }}
      - uses: ./.github/actions/prepare-ci
        with:
          head: ${{ needs.plan.outputs.head }}
          base: ${{ needs.plan.outputs.base }}
          tree: ${{ needs.plan.outputs.tree }}
      - uses: ./.github/actions/setup-linux
        with:
          cache-key: lint-ecs
          dependency-cache-key: lint
          cef-version: ${{ needs.plan.outputs.cef }}
      - uses: ./.github/actions/cache-ecs-lints
      - name: Check typed registration fixtures
        if: needs.changes.outputs.tooling == 'true'
        run: vmux internal --root .build-tools/compiler-checkout ecs-lint -- --test
      - name: Lint registered systems
        if: needs.changes.outputs.lint_args != ''
        run: VMUX_SKIP_DX_BUILD=1 vmux internal --root .build-tools/compiler-checkout ecs-lint -- --locked ${{ needs.changes.outputs.lint_args }} --all-targets
      - uses: ./.github/actions/save-sources
        with:
          workspace: .build-tools/compiler-checkout
          snapshot: .build-tools/lints-sources.json
          target: .build-tools/lints
      - uses: ./.github/actions/save-workspace
        with:
          cache-key: lint-ecs

      - uses: ./.github/actions/report-compiler-cache
        if: always() && env.VMUX_CI_COMPILER_CACHE_READY == '1'
        with:
          name: ${{ github.job }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [plan, changes, lint-rust, lint-ecs]
    if: ${{ !cancelled() }}
    steps:
      - name: Require all selected lint checks
        env:
          PLAN: ${{ needs.plan.result }}
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          COMPILER: ${{ needs.changes.outputs.compiler_lints }}
          REUSE: ${{ needs.changes.outputs.reuse_lint }}
          RUST: ${{ needs.lint-rust.result }}
          ECS: ${{ needs.lint-ecs.result }}
        run: |
          set -euo pipefail
          test "$PLAN" = success
          test "$CHANGES" = success
          if [ "$CODE" != true ] || [ -n "$REUSE" ]; then
            test "$RUST" = skipped
            test "$ECS" = skipped
            exit 0
          fi
          test "$RUST" = success
          if [ "$COMPILER" = true ]; then
            test "$ECS" = success
          else
            test "$ECS" = skipped
          fi

  tests:
    name: ${{ matrix.name }}
    needs: [plan, changes]
    if: needs.changes.outputs.test_count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.tests) }}
    steps:
      - name: Require CI preparation
        env:
          PLAN: ${{ needs.plan.result }}
          PREPARE: ${{ needs.changes.result }}
          SUITE: ${{ matrix.key }}
        run: |
          set -euo pipefail
          test "$PLAN" = success
          test "$PREPARE" = success
          case "$SUITE" in
            test-rust|test-sdk-ecs|test-sdk-project|test-sdk-extension|test-sdk-flex|test-sdk-layout|test-sdk-lsp|test-sdk-framework|test-sdk-host|test-desktop|test-features|test-ecs) ;;
            *) echo "::error::Unknown test suite: $SUITE"; exit 1 ;;
          esac
      - name: Reuse verified test result
        if: matrix.reuse != ''
        env:
          VERIFIED_RUN: ${{ matrix.reuse }}
        run: echo "Reused matching successful tests from run $VERIFIED_RUN"
      - uses: actions/checkout@v5
        if: matrix.reuse == ''
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.head }}
      - uses: ./.github/actions/prepare-ci
        if: matrix.reuse == ''
        with:
          head: ${{ needs.plan.outputs.head }}
          base: ${{ needs.plan.outputs.base }}
          tree: ${{ needs.plan.outputs.tree }}
      - name: Record validation inputs
        if: matrix.reuse == '' && matrix.claim != ''
        env:
          VMUX_CHECK_NAME: ${{ matrix.claim }}
          VMUX_CHECK_TREE: ${{ needs.plan.outputs.tree }}
        run: vmux-ci checks-record
      - name: Publish validation inputs
        if: matrix.reuse == '' && matrix.claim != ''
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.claim }}-${{ github.run_attempt }}
          path: ci-check-inputs.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - uses: ./.github/actions/setup-linux
        if: matrix.reuse == ''
        with:
          cache-key: ${{ matrix.cache }}
          dependency-cache-key: ${{ matrix.dependencies }}
          desktop: ${{ matrix.native }}
          cef-version: ${{ needs.plan.outputs.cef }}
      - name: Rust
        if: matrix.reuse == '' && matrix.key == 'test-rust'
        run: VMUX_SKIP_DX_BUILD=1 cargo test --locked ${{ needs.changes.outputs.args }}
      - name: Records
        if: matrix.reuse == '' && matrix.key == 'test-rust' && needs.changes.outputs.records == 'true'
        run: cargo test --locked -p vmux_ecs --no-default-features --features store,records
      - name: SDK
        if: matrix.reuse == '' && startsWith(matrix.key, 'test-sdk-')
        run: vmux-ci sdk-test ${{ matrix.key }}
      - name: Git SDK
        if: matrix.reuse == '' && matrix.key == 'test-sdk-framework' && github.event_name != 'pull_request'
        run: vmux dx test sdk --git
      - name: Git host SDK
        if: matrix.reuse == '' && matrix.key == 'test-sdk-host' && github.event_name != 'pull_request'
        run: vmux dx test sdk --host --git
      - name: Desktop
        if: matrix.reuse == '' && matrix.key == 'test-desktop'
        run: VMUX_SKIP_DX_BUILD=1 cargo test --locked -p vmux_desktop
      - name: Features
        if: matrix.reuse == '' && matrix.key == 'test-features' && needs.changes.outputs.headless == 'true'
        run: VMUX_SKIP_DX_BUILD=1 cargo test --locked -p vmux_app --no-default-features --features daemon,mcp,account-local,jobs --lib
      - name: Legacy desktop features
        if: matrix.reuse == '' && matrix.key == 'test-features' && needs.changes.outputs.legacy_desktop == 'true'
        run: VMUX_SKIP_DX_BUILD=1 cargo test --locked -p vmux_desktop --lib --no-default-features disabled_features::tests
      - name: ECS composition
        if: matrix.reuse == '' && matrix.key == 'test-ecs'
        run: cargo test --locked -p vmux_dx --test policy --test conventions
      - name: Save validated compiler artifacts
        if: matrix.reuse == ''
        uses: ./.github/actions/save-workspace
        with:
          cache-key: ${{ matrix.cache }}

      - uses: ./.github/actions/report-compiler-cache
        if: always() && env.VMUX_CI_COMPILER_CACHE_READY == '1'
        with:
          name: ${{ matrix.key }}

  website:
    name: Build Web
    needs: [plan, changes]
    if: needs.changes.outputs.website == 'true' && !needs.changes.outputs.reuse_website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.head }}

      - uses: ./.github/actions/prepare-ci
        with:
          head: ${{ needs.plan.outputs.head }}
          base: ${{ needs.plan.outputs.base }}
          tree: ${{ needs.plan.outputs.tree }}

      - name: Record validation inputs
        if: needs.changes.outputs.check_website != ''
        env:
          VMUX_CHECK_NAME: ${{ needs.changes.outputs.check_website }}
          VMUX_CHECK_TREE: ${{ needs.plan.outputs.tree }}
        run: vmux-ci checks-record
      - name: Publish validation inputs
        if: needs.changes.outputs.check_website != ''
        uses: actions/upload-artifact@v6
        with:
          name: ${{ needs.changes.outputs.check_website }}-${{ github.run_attempt }}
          path: ci-check-inputs.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - uses: ./.github/actions/setup-web
        with:
          cache-key: website

      - name: Build website
        working-directory: website
        run: dx build --platform web --release

      - name: Save validated compiler artifacts
        uses: ./.github/actions/save-workspace
        with:
          cache-key: website

      - uses: ./.github/actions/report-compiler-cache
        if: always() && env.VMUX_CI_COMPILER_CACHE_READY == '1'
        with:
          name: ${{ github.job }}

  dx-macos:
    name: Prepare macOS
    needs: [plan, changes]
    if: (github.event_name != 'pull_request' || needs.plan.outputs.release == 'true') && (needs.changes.outputs.macos == 'true' || needs.changes.outputs.ios == 'true' || needs.changes.outputs.macos_tooling == 'true')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.head }}
      - uses: ./.github/actions/prepare-ci
        with:
          head: ${{ needs.plan.outputs.head }}
          base: ${{ needs.plan.outputs.base }}
          tree: ${{ needs.plan.outputs.tree }}
      - uses: ./.github/actions/setup-rust
        with:
          cli: build
          fast-rust: "true"
      - name: Test DX lifecycle and platform adapters
        if: needs.changes.outputs.macos_tooling == 'true'
        run: cargo test --locked -p vmux_dx --features ci-syntax --lib --target-dir .build-tools/cargo
      - name: Test native CLI resource and signing contracts
        if: needs.changes.outputs.macos_tooling == 'true'
        run: cargo test --locked -p vmux_cli --no-default-features --features dx,ci-syntax --test dx --target-dir .build-tools/cargo
      - name: Record the CLI identity
        run: vmux-ci artifact-publish .build-tools/bin/vmux .build-tools/artifact
      - uses: actions/upload-artifact@v6
        with:
          name: dx-cli-${{ runner.os }}-${{ runner.arch }}
          overwrite: true
          include-hidden-files: true
          path: .build-tools/artifact
          if-no-files-found: error
          retention-days: 1

      - uses: ./.github/actions/report-compiler-cache
        if: always() && env.VMUX_CI_COMPILER_CACHE_READY == '1'
        with:
          name: ${{ github.job }}

  ios-build:
    name: Build iOS
    runs-on: macos-latest
    needs: [plan, changes, dx-macos]
    if: github.event_name != 'pull_request' && needs.changes.outputs.ios == 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.head }}

      - uses: ./.github/actions/prepare-ci
        with:
          head: ${{ needs.plan.outputs.head }}
          base: ${{ needs.plan.outputs.base }}
          tree: ${{ needs.plan.outputs.tree }}

      - uses: ./.github/actions/setup-ios
        with:
          cache-key: ios
          tailwind: "true"

      - name: Generate the tailwind bundle dx would
        run: |
          tailwindcss \
            -i crates/app/vmux_mobile/assets/tailwind.css \
            -o crates/app/vmux_mobile/assets/tailwind.out.css

      - name: Build the phone app
        run: cargo build --locked -p vmux_mobile --target aarch64-apple-ios --features mobile --bin vmux_mobile

      - name: Test the phone app
        run: cargo test --locked -p vmux_mobile --target aarch64-apple-darwin --features mobile --bin vmux_mobile

      - name: Check the pages that ship on the phone
        run: |
          cargo check --locked --target aarch64-apple-ios \
            -p vmux_acp -p vmux_session -p vmux_command -p vmux_editor -p vmux_history -p vmux_shortcut \
            -p vmux_layout -p vmux_setting -p vmux_space -p vmux_start -p vmux_team \
            -p vmux_terminal -p vmux_ui

      - name: The phone links no desktop-only crate
        run: |
          set -euo pipefail

          reaches() {
            cargo tree --locked --target aarch64-apple-ios -p "$1" -i "$2" 2>/dev/null
          }

          while read -r forbidden control_package control_crate; do
            [ -n "$forbidden" ] || continue
            if [ -z "$(reaches "$control_package" "$control_crate")" ]; then
              echo "::error::positive control failed: $control_crate not found in $control_package, so this job is asserting nothing about $forbidden"
              exit 1
            fi
            found="$(reaches vmux_mobile "$forbidden")"
            if [ -n "$found" ]; then
              echo "::error::$forbidden reaches the phone:"
              echo "$found"
              exit 1
            fi
            echo "ok: vmux_mobile does not link $forbidden (control: $control_package links $control_crate)"
          done <<'FORBIDDEN'
          dioxus-web vmux_mobile dioxus
          bevy_cef vmux_desktop bevy_cef
          FORBIDDEN

      - name: Save validated compiler artifacts
        uses: ./.github/actions/save-workspace
        with:
          cache-key: ios

      - uses: ./.github/actions/report-compiler-cache
        if: always() && env.VMUX_CI_COMPILER_CACHE_READY == '1'
        with:
          name: ${{ github.job }}

  build-mac:
    name: Build macOS
    needs: [plan, changes, dx-macos]
    if: needs.changes.outputs.macos == 'true' && (github.event_name != 'pull_request' || needs.plan.outputs.release == 'true')
    runs-on: macos-latest
    permissions:
      contents: write
      id-token: write
    env:
      CEF_VERSION: ${{ needs.plan.outputs.cef }}
      VMUX_CEF_SDK_CACHE: ${{ github.workspace }}/.cache/cef-sdk
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.head }}

      - uses: ./.github/actions/prepare-ci
        with:
          head: ${{ needs.plan.outputs.head }}
          base: ${{ needs.plan.outputs.base }}
          tree: ${{ needs.plan.outputs.tree }}

      - uses: ./.github/actions/setup-rust
        with:
          fast-rust: "false"

      - name: Detect release PR + idempotency
        id: relprep
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          vmux internal release-artifacts -- "$VERSION" > "$RUNNER_TEMP/dx-release.env"
          while IFS="=" read -r key value; do export "$key=$value"; done < "$RUNNER_TEMP/dx-release.env"
          {
            echo "VERSION=$VERSION"
            echo "TAG=$VMUX_RELEASE_TAG"
            echo "DMG_NAME=$VMUX_DMG_NAME"
            echo "BINARY_ARCHIVE_NAME=$VMUX_BINARY_ARCHIVE_NAME"
            echo "APP_ARCHIVE_NAME=$VMUX_APP_ARCHIVE_NAME"
            echo "APP_SIGNATURE_NAME=$VMUX_APP_SIGNATURE_NAME"
            echo "CLI_ARCHIVE_NAME=$VMUX_CLI_ARCHIVE_NAME"
            echo "CLI_SIGNATURE_NAME=$VMUX_CLI_SIGNATURE_NAME"
            echo "DMG_URL=$VMUX_DMG_URL"
          } >> "$GITHUB_ENV"

          if [ -z "${BASE_SHA:-}" ]; then
            echo "Not a pull_request event; skipping release prep."
            echo "IS_RELEASE_PR=0" >> "$GITHUB_ENV"
            exit 0
          fi

          BASE_VERSION=$(git show "${BASE_SHA}:Cargo.toml" 2>/dev/null | grep -m1 '^version' | sed 's/.*"\(.*\)".*/\1/' || true)
          if [ "$BASE_VERSION" = "$VERSION" ]; then
            echo "Version unchanged ($VERSION); not a release PR."
            echo "IS_RELEASE_PR=0" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "Release PR detected: $BASE_VERSION -> $VERSION"
          echo "IS_RELEASE_PR=1" >> "$GITHUB_ENV"

          if gh release view "$VMUX_RELEASE_TAG" --json isDraft,assets >/tmp/r.json 2>/dev/null; then
            asset_count=$(jq '.assets | length' /tmp/r.json)
            CASK_URL=$(grep -m1 '^  url' Casks/vmux.rb | sed 's/.*"\(.*\)".*/\1/')
            if [ "$asset_count" -ge 6 ] && [ "$CASK_URL" = "$VMUX_DMG_URL" ]; then
              echo "Draft release ready and cask matches; release prep already complete."
              echo "PREP_DONE=1" >> "$GITHUB_ENV"
            fi
          fi

      - uses: ./.github/actions/setup-macos
        with:
          cache-key: build-mac
          cef-version: ${{ needs.plan.outputs.cef }}
          fast-rust: "false"

      - name: Check lean macOS desktop features
        if: github.event_name != 'pull_request'
        run: env VMUX_SKIP_DX_BUILD=1 vmux internal cargo -- check -p vmux_desktop --no-default-features --features dev

      - name: Build, sign, notarize, and package DMG
        if: env.PREP_DONE != '1'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VMUX_UPDATE_PUBLIC_KEY: ${{ secrets.VMUX_UPDATE_PUBLIC_KEY }}
        run: |
          if [ "$IS_RELEASE_PR" != "1" ]; then
            export SKIP_NOTARIZE=1
          fi
          vmux build -p release

      - name: Smoke test bundled app
        if: env.PREP_DONE != '1'
        run: |
          set -uo pipefail
          app="target/release/Vmux.app"
          bin="$app/Contents/MacOS/vmux_desktop"
          plist="$app/Contents/Frameworks/Chromium Embedded Framework.framework/Resources/Info.plist"

          want="${CEF_VERSION##*+}"
          got=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$plist" 2>/dev/null || true)
          echo "Bundled CEF framework: ${got:-<none>} | cef crate: $CEF_VERSION (expect prefix $want)"
          case "$got" in
            "$want" | "$want".*) ;;
            *)
              echo "::error::Bundled CEF (${got:-<none>}) does not match cef crate ($CEF_VERSION)"
              exit 1
              ;;
          esac

          VMUX_DATA_DIR="$(mktemp -d)"
          export VMUX_DATA_DIR
          log="$(mktemp)"
          "$bin" >"$log" 2>&1 &
          pid=$!
          rc=0
          sleep 25
          if kill -0 "$pid" 2>/dev/null; then
            echo "Vmux survived the 25s startup window — OK"
          else
            wait "$pid"
            code=$?
            echo "::error::Vmux exited during startup (exit $code) — startup crash"
            rc=1
          fi

          kill "$pid" 2>/dev/null || true
          pkill -f "Vmux.app/Contents/MacOS/vmux_desktop" 2>/dev/null || true
          pkill -f "vmux_service" 2>/dev/null || true
          pkill -f "Chromium Embedded Framework" 2>/dev/null || true

          echo "----- startup log -----"
          cat "$log" || true
          exit $rc

      - name: Upload .dmg artifact
        if: env.PREP_DONE != '1' && env.IS_RELEASE_PR != '1'
        uses: actions/upload-artifact@v6
        with:
          name: Vmux-${{ github.sha }}.dmg
          path: target/release/${{ env.DMG_NAME }}
          retention-days: 7

      - name: Create binary tarball
        if: env.PREP_DONE != '1' && env.IS_RELEASE_PR == '1'
        run: |
          cd target/release/Vmux.app/Contents/MacOS
          tar czf "$GITHUB_WORKSPACE/target/release/${BINARY_ARCHIVE_NAME}" vmux_desktop

      - name: Create app bundle tarball
        if: env.PREP_DONE != '1' && env.IS_RELEASE_PR == '1'
        run: |
          cd target/release
          tar czf "$APP_ARCHIVE_NAME" Vmux.app

      - name: Build and sign standalone CLI release
        if: env.PREP_DONE != '1' && env.IS_RELEASE_PR == '1'
        env:
          VMUX_UPDATE_PUBLIC_KEY: ${{ secrets.VMUX_UPDATE_PUBLIC_KEY }}
          VMUX_UPDATE_PRIVATE_KEY: ${{ secrets.VMUX_UPDATE_PRIVATE_KEY }}
          VMUX_UPDATE_PRIVATE_KEY_PASSWORD: ${{ secrets.VMUX_UPDATE_PRIVATE_KEY_PASSWORD }}
        run: vmux internal cli-release

      - name: Sign update artifact (minisign)
        if: env.PREP_DONE != '1' && env.IS_RELEASE_PR == '1'
        env:
          VMUX_UPDATE_PRIVATE_KEY: ${{ secrets.VMUX_UPDATE_PRIVATE_KEY }}
          VMUX_UPDATE_PRIVATE_KEY_PASSWORD: ${{ secrets.VMUX_UPDATE_PRIVATE_KEY_PASSWORD }}
        run: |
          TARBALL="target/release/${APP_ARCHIVE_NAME}"
          cargo packager signer sign "${TARBALL}" \
            --private-key "${VMUX_UPDATE_PRIVATE_KEY}" \
            --password "${VMUX_UPDATE_PRIVATE_KEY_PASSWORD}"

      - name: Create or update draft release with assets
        if: env.PREP_DONE != '1' && env.IS_RELEASE_PR == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          ASSETS=(
            "target/release/${DMG_NAME}"
            "target/release/${BINARY_ARCHIVE_NAME}"
            "target/release/${APP_ARCHIVE_NAME}"
            "target/release/${APP_SIGNATURE_NAME}"
            ".build-tools/standalone/release/${CLI_ARCHIVE_NAME}"
            ".build-tools/standalone/release/${CLI_SIGNATURE_NAME}"
          )
          if gh release view "$TAG" --json isDraft >/tmp/r.json 2>/dev/null; then
            is_draft=$(jq -r .isDraft /tmp/r.json)
            if [ "$is_draft" != "true" ]; then
              echo "::error::Release $TAG already published; refusing to upload."
              exit 1
            fi
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" \
              --draft \
              --target "$HEAD_SHA" \
              --title "Vmux $TAG" \
              --generate-notes \
              "${ASSETS[@]}"
          fi

      - name: Require release metadata commit
        if: env.IS_RELEASE_PR == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: vmux internal update-release-metadata -- --check

      - name: Save validated compiler artifacts
        uses: ./.github/actions/save-workspace
        with:
          cache-key: build-mac

      - uses: ./.github/actions/report-compiler-cache
        if: always() && env.VMUX_CI_COMPILER_CACHE_READY == '1'
        with:
          name: ${{ github.job }}

  ci:
    name: Check Results
    runs-on: ubuntu-latest
    needs: [plan, changes, lint, lint-rust, lint-ecs, tests, website, dx-macos, build-mac, ios-build]
    if: always()
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.head || github.sha }}
      - uses: ./.github/actions/setup-ci
      - uses: ./.github/actions/prepare-ci
        if: needs.plan.result == 'success' && needs.changes.result == 'success'
        with:
          head: ${{ needs.plan.outputs.head }}
          base: ${{ needs.plan.outputs.base }}
          tree: ${{ needs.plan.outputs.tree }}
      - name: Verify selected checks
        env:
          VMUX_CI_RESULTS: ${{ toJSON(needs) }}
          VMUX_CI_DISTRIBUTION: ${{ github.event_name != 'pull_request' || needs.plan.outputs.release == 'true' }}
        run: vmux-ci checks-gate
      - uses: ./.github/actions/report-compiler-cache
        if: always() && env.VMUX_CI_COMPILER_CACHE_READY == '1'
        with:
          name: ${{ github.job }}
