name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "scripts/install.sh"
      - "scripts/install-dioxus-cli.sh"
      - "scripts/install-dioxus-binaryen.sh"
      - "scripts/install-tailwindcss.sh"
      - "rust-toolchain.toml"
      - "tool-versions.env"
      - ".github/actions/setup-rust/action.yml"
      - ".github/actions/setup-web/action.yml"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  DX_HOME: ${{ github.workspace }}/.dx

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: ./.github/actions/setup-web
        with:
          cache-key: deploy-website
          tailwind: "true"

      - name: Build Tailwind CSS
        working-directory: website
        run: tailwindcss -i tailwind.input.css -o public/style.css --minify

      - name: Build website (SSG)
        working-directory: website
        run: |
          rm -rf target/dx
          dx build --platform web --ssg --release

      - name: Promote SSG home to root
        working-directory: website
        run: |
          cp target/dx/vmux_website/release/web/public/_home/index.html target/dx/vmux_website/release/web/public/index.html
          rm -rf target/dx/vmux_website/release/web/public/_home

      - name: Copy CNAME to dist
        run: cp website/CNAME website/target/dx/vmux_website/release/web/public/CNAME

      - name: Copy install script to dist
        run: install -m 0644 scripts/install.sh website/target/dx/vmux_website/release/web/public/install

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/target/dx/vmux_website/release/web/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
