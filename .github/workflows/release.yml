name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force:
        description: "Publish current Cargo.toml version even if unchanged from previous commit"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  detect-version:
    name: Detect Version Bump
    runs-on: ubuntu-latest
    env:
      BEFORE_SHA: ${{ github.event.before }}
      FORCE_RELEASE: ${{ github.event.inputs.force }}
    outputs:
      should_release: ${{ steps.detect.outputs.should_release }}
      version: ${{ steps.detect.outputs.version }}
      tag: ${{ steps.detect.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect version bump
        id: detect
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          PREV_REF="HEAD^"
          if [ -n "${BEFORE_SHA:-}" ] && ! printf '%s\n' "$BEFORE_SHA" | grep -Eq '^0+$' && git cat-file -e "${BEFORE_SHA}:Cargo.toml" 2>/dev/null; then
            PREV_REF="$BEFORE_SHA"
          fi
          PREV_VERSION=$(git show "${PREV_REF}:Cargo.toml" 2>/dev/null | grep -m1 '^version' | sed 's/.*"\(.*\)".*/\1/' || true)
          if [ "$PREV_VERSION" = "$VERSION" ] && [ "${FORCE_RELEASE:-false}" != "true" ]; then
            echo "Version unchanged ($VERSION); skipping publish."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Detected version bump: $PREV_VERSION -> $VERSION"
          {
            echo "should_release=true"
            echo "version=$VERSION"
            echo "tag=v$VERSION"
          } >> "$GITHUB_OUTPUT"

  testflight:
    name: Upload iOS to TestFlight
    needs: detect-version
    if: needs.detect-version.outputs.should_release == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ios-release

      - name: Install dioxus CLI
        run: ./scripts/install-dioxus-cli.sh

      - name: Build, sign and upload
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_IOS_SIGNING_IDENTITY: ${{ secrets.APPLE_IOS_SIGNING_IDENTITY }}
          APPLE_IOS_CERTIFICATE: ${{ secrets.APPLE_IOS_CERTIFICATE }}
          APPLE_IOS_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_IOS_CERTIFICATE_PASSWORD }}
          APPLE_IOS_PROVISIONING_PROFILE: ${{ secrets.APPLE_IOS_PROVISIONING_PROFILE }}
          # App Store Connect refuses a CFBundleVersion it has already seen, and the marketing
          # version alone cannot carry a resubmission. run_number is monotonic and needs no
          # committed state, which would otherwise trip update-release-metadata.sh --check.
          VMUX_IOS_BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/build-ios-release.sh

      - name: Verify bundle layout
        run: ./scripts/test-ios-bundle-layout.sh --signed

  publish:
    name: Publish Release
    needs: detect-version
    if: needs.detect-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.detect-version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Verify release assets and committed metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/update-release-metadata.sh --check

      - name: Re-target tag to current main HEAD
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NEW_HEAD=$(git rev-parse HEAD)
          if gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" \
              -f sha="$NEW_HEAD" -F force=true
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${TAG}" -f sha="$NEW_HEAD"
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$TAG" --draft=false

      - name: Dispatch website deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-website.yml --ref main
