name: Setup Rust
description: Load pinned tool versions and install the repository Rust toolchain
inputs:
  components:
    description: Comma-separated rustup components
    required: false
    default: ""
  targets:
    description: Comma-separated rustup targets
    required: false
    default: ""
  cli:
    description: Build the CLI producer or consume this run's verified CLI artifact
    required: false
    default: "auto"
  fast-rust:
    description: Apply the CI-only Rust compile settings (auto, true or false)
    required: false
    default: "auto"
runs:
  using: composite
  steps:
    - name: Load pinned tool versions
      shell: bash
      run: cat tool-versions.env >> "$GITHUB_ENV"

    - name: Resolve Rust toolchain
      id: rust
      shell: bash
      run: |
        channel="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)"
        test -n "$channel"
        echo "channel=$channel" >> "$GITHUB_OUTPUT"

    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.rust.outputs.channel }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}

    - name: Validate compiler cache locations
      shell: bash
      run: node scripts/ci-cache.js validate

    - name: Identify development CLI compile inputs
      id: cli-inputs
      if: inputs.cli == 'build' || env.VMUX_CI_PREBUILT_DX != '1'
      shell: bash
      run: node scripts/ci-cli.js cache-inputs

    - name: Restore unchanged development CLI binary
      if: inputs.cli == 'build' || env.VMUX_CI_PREBUILT_DX != '1'
      uses: actions/cache/restore@v5
      with:
        path: .build-tools/cli-cache
        key: ${{ steps.cli-inputs.outputs.key }}

    - name: Verify cached development CLI
      id: cli-cache
      if: inputs.cli == 'build' || env.VMUX_CI_PREBUILT_DX != '1'
      shell: bash
      run: |
        node scripts/ci-cli.js cache-reuse .build-tools/cli-cache
        echo "$GITHUB_WORKSPACE/.build-tools/bin" >> "$GITHUB_PATH"

    - name: Restore development CLI compiler cache
      if: github.ref == 'refs/heads/main' && (inputs.cli == 'build' || env.VMUX_CI_PREBUILT_DX != '1') && steps.cli-cache.outputs.reused != 'true'
      uses: actions/cache@v4
      with:
        path: .build-tools/cargo
        key: dx-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.channel }}-compile${{ env.VMUX_CI_FAST_RUST }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/app/vmux_cli/**', 'crates/feature/vmux_dx/**', 'crates/util/vmux_ecs/**', 'crates/util/vmux_api/**', 'crates/util/vmux_task/**', 'crates/util/vmux_macro/**', 'crates/build_*.rs') }}
        restore-keys: |
          dx-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.channel }}-compile${{ env.VMUX_CI_FAST_RUST }}-

    - name: Restore shared development CLI compiler cache
      if: github.ref != 'refs/heads/main' && (inputs.cli == 'build' || env.VMUX_CI_PREBUILT_DX != '1') && steps.cli-cache.outputs.reused != 'true'
      uses: actions/cache/restore@v4
      with:
        path: .build-tools/cargo
        key: dx-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.channel }}-compile${{ env.VMUX_CI_FAST_RUST }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/app/vmux_cli/**', 'crates/feature/vmux_dx/**', 'crates/util/vmux_ecs/**', 'crates/util/vmux_api/**', 'crates/util/vmux_task/**', 'crates/util/vmux_macro/**', 'crates/build_*.rs') }}
        restore-keys: |
          dx-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.channel }}-compile${{ env.VMUX_CI_FAST_RUST }}-

    - uses: ./.github/actions/cache-workspace
      if: (inputs.cli == 'build' || env.VMUX_CI_PREBUILT_DX != '1') && steps.cli-cache.outputs.reused != 'true'
      with:
        cache-key: dx-cli-compile${{ env.VMUX_CI_FAST_RUST }}
        target: .build-tools/cargo

    - name: Build development CLI
      if: (inputs.cli == 'build' || env.VMUX_CI_PREBUILT_DX != '1') && steps.cli-cache.outputs.reused != 'true'
      shell: bash
      run: |
        cli_flags=""
        if [ "${VMUX_CI_FAST_RUST:-}" = "1" ]; then
          cli_flags="-C opt-level=1 -C codegen-units=16"
        fi
        env -u CARGO_BUILD_TARGET -u CARGO_ENCODED_RUSTFLAGS RUSTFLAGS="$cli_flags" cargo build --locked -p vmux_cli --no-default-features --features dx,ci-syntax --target-dir .build-tools/cargo
        mkdir -p .build-tools/bin
        install -m 0755 .build-tools/cargo/debug/vmux .build-tools/bin/vmux
        echo "$GITHUB_WORKSPACE/.build-tools/bin" >> "$GITHUB_PATH"

    - name: Save development CLI compiler artifacts
      if: (inputs.cli == 'build' || env.VMUX_CI_PREBUILT_DX != '1') && steps.cli-cache.outputs.reused != 'true'
      uses: ./.github/actions/save-workspace
      with:
        cache-key: dx-cli-compile${{ env.VMUX_CI_FAST_RUST }}

    - name: Record reusable development CLI binary
      if: (inputs.cli == 'build' || env.VMUX_CI_PREBUILT_DX != '1') && steps.cli-cache.outputs.reused != 'true'
      shell: bash
      run: node scripts/ci-cli.js cache-publish .build-tools/cli-cache

    - name: Save reusable development CLI binary
      if: (inputs.cli == 'build' || env.VMUX_CI_PREBUILT_DX != '1') && steps.cli-cache.outputs.reused != 'true'
      uses: actions/cache/save@v5
      with:
        path: .build-tools/cli-cache
        key: ${{ steps.cli-inputs.outputs.key }}

    - name: Download this run's development CLI
      if: inputs.cli != 'build' && env.VMUX_CI_PREBUILT_DX == '1'
      uses: actions/download-artifact@v7
      with:
        name: dx-cli-${{ runner.os }}-${{ runner.arch }}
        path: .build-tools/prebuilt

    - name: Verify and install the development CLI
      if: inputs.cli != 'build' && env.VMUX_CI_PREBUILT_DX == '1'
      shell: bash
      run: |
        node scripts/ci-cli.js install .build-tools/prebuilt
        echo "$GITHUB_WORKSPACE/.build-tools/bin" >> "$GITHUB_PATH"

    - name: Configure CI Rust compilation
      if: inputs.fast-rust == 'true' || (inputs.fast-rust == 'auto' && env.VMUX_CI_FAST_RUST == '1')
      shell: bash
      run: node scripts/ci-cli.js fast-rust
