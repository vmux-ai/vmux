name: Setup Rust
description: Load pinned tool versions and install the repository Rust toolchain
inputs:
  components:
    description: Comma-separated rustup components
    required: false
    default: ""
  targets:
    description: Comma-separated rustup targets
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Load pinned tool versions
      shell: bash
      run: cat tool-versions.env >> "$GITHUB_ENV"

    - name: Resolve Rust toolchain
      id: rust
      shell: bash
      run: |
        channel="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)"
        test -n "$channel"
        echo "channel=$channel" >> "$GITHUB_OUTPUT"

    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.rust.outputs.channel }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}

    - name: Restore development CLI compiler cache
      uses: actions/cache@v4
      with:
        path: .build-tools/cargo
        key: dx-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.channel }}-${{ hashFiles('Cargo.lock', 'crates/app/vmux_cli/**', 'crates/feature/vmux_dx/**', 'crates/util/vmux_ecs/**', 'crates/util/vmux_api/**', 'crates/util/vmux_task/**', 'crates/util/vmux_macro/**', 'crates/build_*.rs') }}
        restore-keys: |
          dx-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.channel }}-

    - name: Build development CLI
      shell: bash
      run: |
        env -u CARGO_BUILD_TARGET -u CARGO_ENCODED_RUSTFLAGS -u RUSTFLAGS cargo build --locked -p vmux_cli --no-default-features --features dx,ci-syntax --target-dir .build-tools/cargo
        mkdir -p .build-tools/bin
        install -m 0755 .build-tools/cargo/debug/vmux .build-tools/bin/vmux
        echo "$GITHUB_WORKSPACE/.build-tools/bin" >> "$GITHUB_PATH"
