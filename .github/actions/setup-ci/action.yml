name: Setup CI
description: Build the source-owned Rust CI runtime from the pinned toolchain
inputs:
  components:
    description: Comma-separated rustup components
    required: false
    default: ""
  targets:
    description: Comma-separated rustup targets
    required: false
    default: ""
  runtime-sha256:
    description: Checksum of this run's verified Linux CI runtime
    required: false
    default: ""
outputs:
  channel:
    description: Pinned Rust toolchain channel
    value: ${{ steps.rust.outputs.channel }}
  runtime-sha256:
    description: Checksum of the installed CI runtime
    value: ${{ steps.activate.outputs.sha256 }}
runs:
  using: composite
  steps:
    - name: Load tool versions
      shell: bash
      run: cat tool-versions.env >> "$GITHUB_ENV"
    - name: Resolve toolchain
      id: rust
      shell: bash
      run: |
        channel="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)"
        test -n "$channel"
        echo "channel=$channel" >> "$GITHUB_OUTPUT"
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.rust.outputs.channel }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}
    - uses: ./.github/actions/setup-compiler-cache
      if: env.VMUX_CI_COMPILER_CACHE_READY != '1'
    - name: Download this run's CI runtime
      if: env.VMUX_CI_RUNTIME_READY != '1' && runner.os == 'Linux' && inputs.runtime-sha256 != ''
      uses: actions/download-artifact@v7
      with:
        name: ci-runtime-${{ runner.os }}-${{ runner.arch }}
        path: .vmux/bootstrap
    - name: Restore identical CI runtime
      id: runtime-cache
      if: env.VMUX_CI_RUNTIME_READY != '1' && (runner.os != 'Linux' || inputs.runtime-sha256 == '')
      uses: actions/cache/restore@v5
      with:
        path: .vmux/bootstrap
        key: ci-runtime-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.channel }}-${{ env.VMUX_CI_VALIDATION }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'tool-versions.env', '.cargo/**', '.env*', 'crates/build_*.rs', 'crates/feature/vmux_dx/**', '!crates/feature/vmux_dx/lints/**', 'crates/feature/vmux_feature/**', 'crates/util/vmux_api/**', 'crates/util/vmux_channel/**', 'crates/util/vmux_ecs/**', 'crates/util/vmux_macro/**', 'crates/util/vmux_task/**', 'crates/util/vmux_time/**', 'patches/**', '.github/actions/setup-ci/action.yml') }}
    - name: Verify CI runtime checksum
      id: reuse
      if: env.VMUX_CI_RUNTIME_READY != '1'
      shell: bash
      env:
        EXPECTED_SHA256: ${{ runner.os == 'Linux' && inputs.runtime-sha256 || '' }}
      run: |
        binary=.vmux/bootstrap/vmux-ci
        expected="$EXPECTED_SHA256"
        if [ -z "$expected" ] && [ -f "$binary.sha256" ] && [ ! -L "$binary.sha256" ]; then
          expected="$(cat "$binary.sha256")"
        fi
        actual=""
        if [ -f "$binary" ] && [ ! -L "$binary" ]; then
          actual="$(shasum -a 256 "$binary")"
          actual="${actual%% *}"
        fi
        if [[ "$expected" =~ ^[0-9a-f]{64}$ ]] && [ "$actual" = "$expected" ]; then
          echo 'reused=true' >> "$GITHUB_OUTPUT"
        elif [ -n "$EXPECTED_SHA256" ]; then
          echo '::error::CI runtime checksum differs from the verified Plan artifact'
          exit 1
        else
          echo 'reused=false' >> "$GITHUB_OUTPUT"
        fi
    - uses: Swatinem/rust-cache@v2
      if: env.VMUX_CI_RUNTIME_READY != '1' && steps.reuse.outputs.reused != 'true'
      env:
        RUSTFLAGS: "-C opt-level=1 -C codegen-units=16"
        CARGO_PROFILE_DEV_LTO: "off"
        CARGO_PROFILE_DEV_DEBUG: "0"
      with:
        workspaces: . -> .vmux/ci-cargo
        shared-key: ci-runtime-v3
        cache-workspace-crates: "false"
        cache-on-failure: "true"
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - name: Build CI runtime
      if: env.VMUX_CI_RUNTIME_READY != '1' && steps.reuse.outputs.reused != 'true'
      shell: bash
      run: |
        env -u CARGO_BUILD_TARGET -u CARGO_ENCODED_RUSTFLAGS -u VMUX_UPDATE_PUBLIC_KEY RUSTFLAGS="-C opt-level=1 -C codegen-units=16" CARGO_PROFILE_DEV_LTO=off CARGO_PROFILE_DEV_DEBUG=0 cargo build --locked -p vmux_dx --bin vmux-ci --no-default-features --features ci-runtime --target-dir .vmux/ci-cargo
        if [ -L .vmux/bootstrap ]; then
          rm .vmux/bootstrap
        fi
        mkdir -p .vmux/bootstrap
        rm -f .vmux/bootstrap/vmux-ci .vmux/bootstrap/vmux-ci.sha256
        install -m 0755 .vmux/ci-cargo/debug/vmux-ci .vmux/bootstrap/vmux-ci
    - name: Activate CI runtime
      id: activate
      if: env.VMUX_CI_RUNTIME_READY != '1'
      shell: bash
      run: |
        chmod 0755 .vmux/bootstrap/vmux-ci
        checksum="$(shasum -a 256 .vmux/bootstrap/vmux-ci)"
        checksum="${checksum%% *}"
        echo "$checksum" > .vmux/bootstrap/vmux-ci.sha256
        echo "sha256=$checksum" >> "$GITHUB_OUTPUT"
        echo "$GITHUB_WORKSPACE/.vmux/bootstrap" >> "$GITHUB_PATH"
        echo 'VMUX_CI_RUNTIME_READY=1' >> "$GITHUB_ENV"
    - name: Save identical CI runtime
      if: steps.reuse.outputs.reused == 'false' && steps.runtime-cache.outputs.cache-hit != 'true' && (github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
      uses: actions/cache/save@v5
      with:
        path: .vmux/bootstrap
        key: ${{ steps.runtime-cache.outputs.cache-primary-key }}
