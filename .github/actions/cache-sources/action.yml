name: Restore Cargo source timestamps
description: Reuse cached workspace artifacts only for identical source contents and modes
inputs:
  workspace:
    description: Isolated source checkout directory inside the runner workspace
    required: false
    default: "."
  snapshot:
    description: Source snapshot included in the compiler cache
    required: true
  target:
    description: Cached Cargo target directory
    required: true
  receipt:
    description: Target-specific restore receipt retained until cache publication
    required: false
    default: ""
  save:
    description: Record source inputs after successful validation
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Restore source timestamps
      shell: bash
      env:
        INPUT_WORKSPACE: ${{ inputs.workspace }}
        INPUT_SNAPSHOT: ${{ inputs.snapshot }}
        INPUT_TARGET: ${{ inputs.target }}
        INPUT_RECEIPT: ${{ inputs.receipt }}
        INPUT_SAVE: ${{ inputs.save }}
      run: vmux-ci cache-restore
