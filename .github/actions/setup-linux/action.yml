name: Setup Linux
description: Prepare a Linux runner for Rust checks that link the desktop stack
inputs:
  cache-key:
    description: Rust cache partition
    required: true
  cef-version:
    description: CEF crate version
    required: true
  components:
    description: Comma-separated rustup components
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Free disk space
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
          /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup \
          /usr/local/share/chromium /usr/local/share/edge
        sudo docker image prune --all --force || true
        df -h /

    - name: Install Linux dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          pkg-config \
          libssl-dev \
          libasound2-dev \
          libudev-dev \
          libx11-dev \
          libxi-dev \
          libxcursor-dev \
          libxrandr-dev \
          libxinerama-dev \
          libxkbcommon-dev \
          libwayland-dev \
          libgtk-3-dev \
          libxdo-dev \
          libvulkan-dev

    - uses: ./.github/actions/setup-rust
      with:
        components: ${{ inputs.components }}

    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ inputs.cache-key }}
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Use a shared Linux CEF SDK
      shell: bash
      run: echo "CEF_PATH=$HOME/.cache/vmux/cef-sdk" >> "$GITHUB_ENV"

    - name: Cache Linux CEF SDK
      uses: actions/cache@v5
      with:
        path: ~/.cache/vmux/cef-sdk
        key: cef-sdk-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cef-version }}-v1
