name: Setup Linux
description: Prepare a Linux runner for Rust checks that link the desktop stack
inputs:
  cache-key:
    description: Rust cache partition
    required: true
  cef-version:
    description: CEF crate version
    required: true
  components:
    description: Comma-separated rustup components
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Free disk space
      shell: bash
      run: |
        available="$(df -Pk / | awk 'NR == 2 { print $4 }')"
        if [ "$available" -lt 41943040 ]; then
          timeout 120 sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
        fi
        df -h /
        available="$(df -Pk / | awk 'NR == 2 { print $4 }')"
        if [ "$available" -lt 20971520 ]; then
          echo "::error::Linux runner has less than 20 GiB free after cleanup"
          exit 1
        fi

    - name: Install Linux dependencies
      shell: bash
      run: |
        sudo tee /etc/apt/apt-mirrors.txt > /dev/null <<'MIRROR'
        https://mirrors.edge.kernel.org/ubuntu
        MIRROR
        sudo tee /etc/apt/apt-mirrors-security.txt > /dev/null <<'MIRROR'
        https://mirrors.edge.kernel.org/ubuntu
        MIRROR
        timeout 180 sudo apt-get -o Acquire::Retries=1 \
          -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 \
          -o APT::Update::Error-Mode=any update
        timeout 300 sudo apt-get -o Acquire::Retries=1 \
          -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 \
          install -y --no-install-recommends \
          pkg-config \
          libssl-dev \
          libasound2-dev \
          libudev-dev \
          libx11-dev \
          libxi-dev \
          libxcursor-dev \
          libxrandr-dev \
          libxinerama-dev \
          libxkbcommon-dev \
          libwayland-dev \
          libgtk-3-dev \
          libxdo-dev \
          libvulkan-dev

    - uses: ./.github/actions/setup-rust
      with:
        components: ${{ inputs.components }}

    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ inputs.cache-key }}

    - name: Cache cargo binaries
      uses: actions/cache@v5
      with:
        path: ~/.cargo/bin
        key: cargo-bin-${{ runner.os }}-dx${{ env.DIOXUS_CLI_VERSION }}-cef${{ inputs.cef-version }}-v3

    - name: Cache CEF framework
      uses: actions/cache@v5
      with:
        path: ~/.local/share/Chromium Embedded Framework.framework
        key: cef-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cef-version }}-${{ hashFiles('cef/manifest.toml') }}

    - name: Install CEF framework
      shell: bash
      run: test -d "$HOME/.local/share/Chromium Embedded Framework.framework" || ./scripts/install-cef.sh
