name: Setup Linux
description: Prepare a Linux runner for Rust checks that link the desktop stack
inputs:
  cache-key:
    description: Rust cache partition
    required: true
  cef-version:
    description: CEF crate version
    required: true
  components:
    description: Comma-separated rustup components
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Free disk space
      shell: bash
      run: |
        available="$(df -Pk / | awk 'NR == 2 { print $4 }')"
        if [ "$available" -lt 41943040 ]; then
          timeout 120 sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
        fi
        df -h /
        available="$(df -Pk / | awk 'NR == 2 { print $4 }')"
        if [ "$available" -lt 20971520 ]; then
          echo "::error::Linux runner has less than 20 GiB free after cleanup"
          exit 1
        fi

    - name: Install Linux dependencies
      shell: bash
      run: |
        sudo tee /etc/apt/apt-mirrors.txt > /dev/null <<'MIRROR'
        https://mirrors.edge.kernel.org/ubuntu	priority:1
        https://archive.ubuntu.com/ubuntu	priority:2
        https://azure.archive.ubuntu.com/ubuntu	priority:3
        MIRROR
        sudo tee /etc/apt/apt-mirrors-security.txt > /dev/null <<'MIRROR'
        https://mirrors.edge.kernel.org/ubuntu	priority:1
        https://security.ubuntu.com/ubuntu	priority:2
        https://azure.archive.ubuntu.com/ubuntu	priority:3
        MIRROR
        timeout 180 sudo apt-get -o Acquire::Retries=1 \
          -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 \
          -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
          -o Dir::Etc::sourceparts=- \
          -o APT::Update::Error-Mode=any update
        timeout 300 sudo apt-get -o Acquire::Retries=1 \
          -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 \
          -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
          -o Dir::Etc::sourceparts=- \
          install -y --no-install-recommends \
          pkg-config \
          libssl-dev \
          libasound2-dev \
          libudev-dev \
          libx11-dev \
          libxi-dev \
          libxcursor-dev \
          libxrandr-dev \
          libxinerama-dev \
          libxkbcommon-dev \
          libwayland-dev \
          libgtk-3-dev \
          libxdo-dev \
          libvulkan-dev

    - uses: ./.github/actions/setup-rust
      with:
        components: ${{ inputs.components }}

    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ inputs.cache-key }}
        save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'pull_request' }}

    - name: Use a shared Linux CEF SDK
      shell: bash
      env:
        CEF_CRATE_VERSION: ${{ inputs.cef-version }}
      run: |
        cef_cache="$HOME/.cache/vmux/cef-sdk"
        cef_version="${CEF_CRATE_VERSION#*+}"
        case "$RUNNER_ARCH" in
          X64) cef_arch=x86_64 ;;
          ARM64) cef_arch=aarch64 ;;
          *) echo "::error::Unsupported Linux CEF runner architecture"; exit 1 ;;
        esac
        cef_runtime="$cef_cache/$cef_version/cef_linux_$cef_arch"
        {
          echo "CEF_PATH=$cef_cache"
          echo "LD_LIBRARY_PATH=$cef_runtime${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
        } >> "$GITHUB_ENV"

    - name: Cache Linux CEF SDK
      uses: actions/cache@v5
      with:
        path: ~/.cache/vmux/cef-sdk
        key: cef-sdk-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cef-version }}-v1
