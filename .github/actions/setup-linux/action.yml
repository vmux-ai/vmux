name: Setup Linux
description: Prepare a Linux runner for Rust checks that link the desktop stack
inputs:
  cache-key:
    description: Rust cache partition
    required: true
  cef-version:
    description: CEF crate version
    required: true
  components:
    description: Comma-separated rustup components
    required: false
    default: ""
  desktop:
    description: Install native desktop libraries and restore the CEF SDK
    required: false
    default: "true"
  dependency-cache-key:
    description: Shared dependency cache partition, independent of workspace artifacts
    required: false
    default: ""
  fast-rust:
    description: Apply the CI-only Rust compile settings (auto, true or false)
    required: false
    default: "auto"
  test-profile:
    description: Use unoptimized debug-free test compilation flags for faster CI builds
    required: false
    default: "false"
  branch-cache:
    description: Publish successful same-repository PR workspace caches (auto, true or false)
    required: false
    default: "false"
  save-dependency-cache:
    description: Allow saving the shared dependency cache on main (auto or false)
    required: false
    default: "auto"
runs:
  using: composite
  steps:
    - name: Free disk space
      shell: bash
      run: |
        available="$(df -Pk / | awk 'NR == 2 { print $4 }')"
        if [ "$available" -lt 41943040 ]; then
          timeout 120 sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
        fi
        df -h /
        available="$(df -Pk / | awk 'NR == 2 { print $4 }')"
        if [ "$available" -lt 20971520 ]; then
          echo "::error::Linux runner has less than 20 GiB free after cleanup"
          exit 1
        fi

    - name: Install Linux dependencies
      if: inputs.desktop == 'true'
      shell: bash
      run: |
        sudo tee /etc/apt/apt-mirrors.txt > /dev/null <<'MIRROR'
        https://mirrors.edge.kernel.org/ubuntu	priority:3
        https://archive.ubuntu.com/ubuntu	priority:2
        https://azure.archive.ubuntu.com/ubuntu	priority:1
        MIRROR
        sudo tee /etc/apt/apt-mirrors-security.txt > /dev/null <<'MIRROR'
        https://mirrors.edge.kernel.org/ubuntu	priority:3
        https://security.ubuntu.com/ubuntu	priority:2
        https://azure.archive.ubuntu.com/ubuntu	priority:1
        MIRROR
        vmux_apt_sources="$RUNNER_TEMP/vmux-ubuntu.sources"
        sed -E 's#https?://security[.]ubuntu[.]com/ubuntu/?([[:space:]]|$)#mirror+file:///etc/apt/apt-mirrors-security.txt\1#g' \
          /etc/apt/sources.list.d/ubuntu.sources > "$vmux_apt_sources"
        timeout 180 sudo apt-get -o Acquire::Retries=1 \
          -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 \
          -o Dir::Etc::sourcelist="$vmux_apt_sources" \
          -o Dir::Etc::sourceparts=- \
          -o APT::Update::Error-Mode=any update
        timeout 600 sudo apt-get -o Acquire::Retries=1 \
          -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 \
          -o Dir::Etc::sourcelist="$vmux_apt_sources" \
          -o Dir::Etc::sourceparts=- \
          install -y --no-install-recommends \
          pkg-config \
          libssl-dev \
          libasound2-dev \
          libudev-dev \
          libx11-dev \
          libxi-dev \
          libxcursor-dev \
          libxrandr-dev \
          libxinerama-dev \
          libxkbcommon-dev \
          libwayland-dev \
          libgtk-3-dev \
          libxdo-dev \
          libvulkan-dev

    - uses: ./.github/actions/setup-rust
      with:
        components: ${{ inputs.components }}
        fast-rust: ${{ inputs.fast-rust }}

    - name: Configure CI Rust test compilation
      if: inputs.test-profile == 'true'
      shell: bash
      run: |
        {
          echo 'CARGO_PROFILE_DEV_OPT_LEVEL=0'
          echo 'CARGO_PROFILE_DEV_DEBUG=0'
          echo 'CARGO_PROFILE_DEV_LTO=off'
          echo 'CARGO_PROFILE_DEV_CODEGEN_UNITS=16'
        } >> "$GITHUB_ENV"

    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ inputs.test-profile == 'true' && format('{0}-opt0', inputs.dependency-cache-key || inputs.cache-key) || (inputs.dependency-cache-key || inputs.cache-key) }}
        cache-workspace-crates: "false"
        cache-on-failure: "true"
        save-if: ${{ inputs.save-dependency-cache != 'false' && github.ref == 'refs/heads/main' && (inputs.dependency-cache-key == '' || inputs.dependency-cache-key == inputs.cache-key) }}

    - uses: ./.github/actions/cache-workspace
      with:
        cache-key: ${{ inputs.cache-key }}
        branch-cache: ${{ inputs.branch-cache }}

    - name: Use a shared Linux CEF SDK
      if: inputs.desktop == 'true'
      shell: bash
      env:
        CEF_CRATE_VERSION: ${{ inputs.cef-version }}
      run: |
        cef_cache="$HOME/.cache/vmux/cef-sdk"
        cef_version="${CEF_CRATE_VERSION#*+}"
        case "$RUNNER_ARCH" in
          X64) cef_arch=x86_64 ;;
          ARM64) cef_arch=aarch64 ;;
          *) echo "::error::Unsupported Linux CEF runner architecture"; exit 1 ;;
        esac
        cef_runtime="$cef_cache/$cef_version/cef_linux_$cef_arch"
        {
          echo "CEF_PATH=$cef_cache"
          echo "LD_LIBRARY_PATH=$cef_runtime${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
        } >> "$GITHUB_ENV"

    - name: Cache Linux CEF SDK
      if: inputs.desktop == 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache@v5
      with:
        path: ~/.cache/vmux/cef-sdk
        key: cef-sdk-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cef-version }}-v1

    - name: Restore Linux CEF SDK
      if: inputs.desktop == 'true' && github.ref != 'refs/heads/main'
      uses: actions/cache/restore@v5
      with:
        path: ~/.cache/vmux/cef-sdk
        key: cef-sdk-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cef-version }}-v1
