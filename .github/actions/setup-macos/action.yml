name: Setup macOS
description: Prepare a macOS runner for building and packaging vmux
inputs:
  cache-key:
    description: Rust cache partition
    required: true
  cef-version:
    description: CEF crate version
    required: true
  packaging:
    description: Install Dioxus and packaging tools
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-rust
      with:
        targets: wasm32-unknown-unknown

    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ inputs.cache-key }}
        save-if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
        cache-on-failure: ${{ env.VMUX_CI_FAST_PACKAGE == '1' }}

    - name: Cache cargo binaries
      if: inputs.packaging == 'true'
      uses: actions/cache@v5
      with:
        path: ~/.cargo/bin
        key: cargo-bin-${{ runner.os }}-dx${{ env.DIOXUS_CLI_VERSION }}-cp${{ env.CARGO_PACKAGER_VERSION }}-cba${{ env.BEVY_CEF_BUNDLE_APP_VERSION }}-cef${{ inputs.cef-version }}-v3

    - name: Cache binaryen
      if: inputs.packaging == 'true'
      uses: actions/cache@v5
      with:
        path: .dx/tools/binaryen-${{ env.BINARYEN_VERSION }}
        key: binaryen-${{ runner.os }}-${{ runner.arch }}-${{ env.BINARYEN_VERSION }}

    - name: Cache CEF framework
      uses: actions/cache@v5
      with:
        path: ~/.local/share/Chromium Embedded Framework.framework
        key: cef-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cef-version }}-${{ hashFiles('cef/manifest.toml') }}

    - name: Cache tailwindcss
      uses: actions/cache@v5
      with:
        path: ~/.local/bin/tailwindcss
        key: tailwindcss-${{ runner.os }}-${{ env.TAILWINDCSS_VERSION }}

    - name: Add local binaries to PATH
      shell: bash
      run: |
        mkdir -p "$HOME/.local/bin"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Install CEF framework
      shell: bash
      run: vmux internal install-cef

    - name: Install dioxus-cli
      if: inputs.packaging == 'true'
      shell: bash
      run: vmux internal install-dioxus

    - name: Install binaryen
      if: inputs.packaging == 'true'
      shell: bash
      run: vmux internal install-binaryen

    - name: Install package tools
      if: inputs.packaging == 'true'
      shell: bash
      run: vmux internal install-package-tools

    - name: Install tailwindcss
      shell: bash
      run: TAILWINDCSS_INSTALL_DIR="$HOME/.local/bin" vmux internal install-tailwindcss
