name: Cache workspace compiler artifacts
description: Restore shared compiler artifacts and retain inputs for explicit successful publication
inputs:
  cache-key:
    description: Compiler profile partition
    required: true
  target:
    description: Cargo target directory
    required: false
    default: target
  workspace:
    description: Cargo workspace directory inside the checkout
    required: false
    default: .
  branch-cache:
    description: Publish successful same-repository PR caches (auto, true or false)
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - id: inputs
      shell: bash
      env:
        VMUX_CACHE_PARTITION: ${{ inputs.cache-key }}
        VMUX_CACHE_TARGET: ${{ inputs.target }}
        VMUX_CACHE_WORKSPACE: ${{ inputs.workspace }}
        VMUX_CACHE_SAVE: ${{ github.ref == 'refs/heads/main' || inputs.branch-cache == 'true' || (inputs.branch-cache == 'auto' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
      run: vmux-ci cache-inputs >> "$GITHUB_OUTPUT"
    - uses: actions/cache/restore@v5
      with:
        path: ${{ steps.inputs.outputs.paths }}
        key: ${{ steps.inputs.outputs.key }}
        restore-keys: |
          ${{ steps.inputs.outputs.prefix }}-
          ${{ steps.inputs.outputs.restore-prefix }}-
    - name: Restore staged compiler artifacts
      shell: bash
      env:
        VMUX_CACHE_PARTITION: ${{ inputs.cache-key }}
      run: vmux-ci cache-unstage "$VMUX_CACHE_PARTITION"
    - uses: ./.github/actions/cache-sources
      with:
        snapshot: ${{ steps.inputs.outputs.snapshot }}
        receipt: ${{ steps.inputs.outputs.receipt }}
        target: ${{ steps.inputs.outputs.target }}
        save: ${{ steps.inputs.outputs.save }}
