[package]
name = "vmux_examples"
version.workspace = true
edition.workspace = true
publish = false
description = "Runnable Bevy-style examples for Vmux Framework"

[dependencies]
bevy_app = { workspace = true }
bevy_ecs = { workspace = true }
bevy_math = { workspace = true }
bevy_reflect = { workspace = true }
bevy_tasks = { workspace = true }
moonshine-save = { workspace = true }
tempfile = "3"
vmux_app = { path = "../crates/util/vmux_app", features = ["contracts", "manifest", "hosting", "project", "jobs", "watch", "flex", "layout", "menu"] }
vmux_ecs = { path = "../crates/util/vmux_ecs", features = ["store", "jobs", "watch"] }

