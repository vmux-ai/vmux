[package]
name = "vmux_examples"
version.workspace = true
edition.workspace = true
publish = false
description = "Runnable Bevy-style examples for Vmux Framework"

[features]
default = []
window = [
    "dep:dioxus",
    "dep:rkyv",
    "dep:serde",
    "dep:vmux_api",
    "vmux_app/window-native",
    "vmux_app/menu-native",
    "vmux_app/ui",
]
web = [
    "dep:dioxus",
    "dep:dioxus-ssr",
    "dep:serde",
    "dep:tokio",
    "vmux_app/http-server",
    "vmux_app/runner",
]
mobile = [
    "dep:dioxus",
    "dep:dioxus-ssr",
    "dep:rkyv",
    "dep:serde",
    "dep:vmux_api",
    "vmux_app/ui",
]
service = [
    "dep:serde",
    "dep:tokio",
    "vmux_app/http-server",
    "vmux_app/runner",
]
feature-project = [
    "window",
    "vmux_app/project-filesystem",
]
feature-account = [
    "window",
    "dep:uuid",
    "vmux_app/account-local",
]
feature-extension = [
    "window",
    "vmux_app/extension-core",
]
feature-session = [
    "window",
    "vmux_app/session-core",
]

[dependencies]
bevy_app = { workspace = true }
bevy_ecs = { workspace = true }
bevy_math = { workspace = true }
bevy_reflect = { workspace = true }
bevy_tasks = { workspace = true }
dioxus = { workspace = true, optional = true }
dioxus-ssr = { version = "=0.7.9", optional = true }
moonshine-save = { workspace = true }
rkyv = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
tempfile = "3"
tokio = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
vmux_api = { path = "../crates/util/vmux_api", optional = true }
vmux_app = { path = "../crates/util/vmux_app", features = ["contracts", "manifest", "hosting", "project", "jobs", "watch", "store", "flex", "layout", "menu"] }
vmux_ecs = { path = "../crates/util/vmux_ecs", features = ["store", "watch"] }

