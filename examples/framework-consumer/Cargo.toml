[package]
name = "framework-consumer"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
rkyv = "0.8"
bevy_app = { version = "0.19", default-features = false, features = ["bevy_reflect", "std"] }
bevy_ecs = "0.19"
bevy_math = { version = "0.19", default-features = false, features = ["std"] }
bevy_asset = "0.19"
bevy_reflect = "0.19"
moonshine-save = "0.7"
vmux_app = { path = "../../crates/util/vmux_app", features = ["contracts", "manifest", "hosting", "project", "jobs", "watch", "runner", "flex", "layout", "menu", "extension-core", "lsp"] }
vmux_ecs = { path = "../../crates/util/vmux_ecs", features = ["store", "jobs", "watch"] }
vmux_layout = { path = "../../crates/feature/vmux_layout", features = ["store"] }

vmux_extension = { path = "../../crates/feature/vmux_extension" }
vmux_api = { path = "../../crates/util/vmux_api" }

[dev-dependencies]
tempfile = "3"
crossbeam-channel = "0.5"
lsp-types = "0.97"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
