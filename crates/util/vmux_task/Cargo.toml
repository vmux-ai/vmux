[package]
name = "vmux_task"
description = "Entity-owned asynchronous tasks and guarded result application"
version.workspace = true
edition.workspace = true
publish = false

[features]
default = []
tokio = ["dep:tokio"]

[dependencies]
bevy_app = { workspace = true }
