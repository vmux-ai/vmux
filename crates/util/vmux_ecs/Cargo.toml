[package]
name = "vmux_ecs"
build = "../../build_cfg_git.rs"
description = "Shared ECS primitives and infrastructure for vmux"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
chrono = { workspace = true }
rkyv = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
vmux_profile = { path = "../vmux_profile" }
vmux_path = { path = "../vmux_path" }
vmux_api = { path = "../vmux_api", features = ["bevy"] }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = "3"

[target.'cfg(not(target_os = "ios"))'.dependencies]
bevy = { workspace = true }
bevy_cef = { workspace = true }
bevy_cef_core = { workspace = true }
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
bevy_world_serialization = { workspace = true }
moonshine-save = { workspace = true }
ron = { workspace = true }
sha2 = "0.10"
toml = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "sync"] }
url = { workspace = true }
vmux_flex = { path = "../vmux_flex" }
vmux_transport = { path = "../vmux_transport" }
zip = { version = "2", default-features = false, features = ["deflate"] }

[lints]
workspace = true
