[package]
name = "vmux_ecs"
build = "../../build_cfg_git.rs"
description = "Shared ECS primitives and infrastructure for vmux"
version.workspace = true
edition.workspace = true
publish = false

[features]
default = []
records = ["bevy_ecs/serialize", "bevy_ecs/reflect_auto_register"]
cli = []
watch = ["dep:vmux_watch"]
contracts = ["dep:rkyv", "dep:vmux_api"]
ui = ["contracts"]
store = ["dep:vmux_store"]
cef = [
    "ui",
    "dep:bevy_asset",
    "dep:bevy_cef",
    "dep:bevy_cef_core",
    "dep:tracing",
    "dep:vmux_flex",
]
headless-host = [
    "cli",
    "watch",
    "contracts",
    "store",
    "dep:tokio",
    "vmux_task/tokio",
    "dep:vmux_path",
    "dep:vmux_profile",
    "dep:vmux_transport",
    "dep:tracing",
]
host = ["headless-host", "cef"]

[dependencies]
bevy_app = { workspace = true }
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
rkyv = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
web-time = { workspace = true }
vmux_channel = { path = "../vmux_channel" }
vmux_profile = { path = "../vmux_profile", optional = true }
vmux_path = { path = "../vmux_path", optional = true }
vmux_store = { path = "../vmux_store", optional = true }
vmux_task = { path = "../vmux_task" }
vmux_time = { path = "../vmux_time" }
vmux_macro = { path = "../vmux_macro" }
vmux_api = { path = "../vmux_api", features = ["bevy"], optional = true }

[dev-dependencies]
ron = { workspace = true }
serde_json = { workspace = true }
tempfile = "3"

[target.'cfg(not(target_os = "ios"))'.dependencies]
bevy_asset = { version = "0.19", optional = true }
bevy_cef = { workspace = true, optional = true }
bevy_cef_core = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing = { version = "0.1", optional = true }
vmux_flex = { path = "../vmux_flex", optional = true }
vmux_transport = { path = "../vmux_transport", optional = true }
vmux_watch = { path = "../vmux_watch", optional = true }

[lints]
workspace = true
