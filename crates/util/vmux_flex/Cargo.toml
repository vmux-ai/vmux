[package]
name = "vmux_flex"
description = "Flexbox layout for the desktop shell, over taffy"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
bevy = { workspace = true }
taffy = { version = "0.10", default-features = false, features = [
    "std",
    "block_layout",
    "flexbox",
    "grid",
    "content_size",
    "taffy_tree",
] }

[lints]
workspace = true
