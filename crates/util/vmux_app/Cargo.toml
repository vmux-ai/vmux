[package]
name = "vmux_app"
version.workspace = true
edition.workspace = true
description = "Composable cross-platform vmux application framework"
license.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
default = []
host = ["dep:vmux_profile"]
contracts = ["ecs", "vmux_ecs/contracts", "vmux_project?/contracts", "vmux_layout?/contracts"]
conformance = ["extension", "vmux_extension/conformance"]
cli = [
    "ecs",
    "dep:vmux_container",
    "acp",
    "bookmark",
    "browser",
    "capture",
    "editor",
    "knowledge",
    "layout",
    "service",
    "simulator",
    "space",
    "team",
    "terminal",
    "tool",
    "vault",
    "dep:bevy_ecs",
    "dep:vmux_mcp",
]
mcp = ["cli"]
desktop = [
    "container",

    "account-cloud",
    "acp",
    "bookmark",
    "browser",
    "capture",
    "command",
    "editor",
    "extension",
    "git",
    "gallery",
    "history",
    "knowledge",
    "layout",
    "remote",
    "tool",
    "service",
    "session",
    "setting",
    "shortcut",
    "simulator",
    "space",
    "start",
    "team",
    "terminal",
    "vault",
]
mobile = ["session", "dep:vmux_start", "dep:vmux_team"]
service-daemon = ["daemon"]
daemon = [
    "dep:vmux_session",
    "host",
    "ecs",
    "vmux_ecs/host",
    "dep:tokio",
    "dep:tracing",
    "dep:tracing-appender",
    "dep:tracing-subscriber",
    "dep:vmux_acp",
    "dep:vmux_service",
    "dep:vmux_transport",
    "vmux_acp/service",
]
tool = ["layout-runtime", "dep:vmux_tool"]
capture = ["tool", "dep:vmux_input"]
container = ["layout-runtime", "dep:vmux_container"]
bookmark = ["layout-runtime", "dep:vmux_bookmark"]
ecs = ["dep:vmux_ecs"]
release-flags = ["ecs", "dep:bevy_ecs", "dep:vmux_feature", "dep:vmux_profile"]
account = ["ecs", "dep:bevy_ecs", "dep:vmux_account"]
account-local = ["account", "vmux_account/local"]
account-cloud = ["account-local", "vmux_account/cloud", "vmux_account/profile-sync", "release-flags", "vmux_team?/profile-sync"]
profile-account = ["account-local", "runtime"]
jobs = ["ecs", "vmux_ecs/jobs"]
flex = ["ecs", "dep:vmux_flex"]
runtime = ["flex", "vmux_flex/window", "vmux_ecs/host"]
command = ["runtime", "dep:vmux_command"]
setting = ["runtime", "dep:vmux_setting"]
session = ["vmux_session/app", "dep:vmux_session"]
layout = ["ecs", "dep:vmux_layout"]
layout-runtime = ["layout", "command", "setting", "vmux_layout/host"]
browser = ["command", "layout-runtime", "dep:vmux_browser"]
extension-core = ["ecs", "dep:vmux_extension"]
extension = ["extension-core", "browser", "vmux_extension/host"]
terminal = ["layout-runtime", "service", "dep:vmux_terminal"]
project = ["ecs", "dep:vmux_project"]
lsp = ["ecs", "dep:vmux_lsp"]
editor = ["layout-runtime", "project", "lsp", "dep:vmux_editor"]
git = ["layout-runtime", "dep:vmux_git"]
acp = [
    "command",
    "editor",
    "history",
    "knowledge",
    "service",
    "session",
    "space",
    "terminal",
    "dep:vmux_acp",
    "vmux_acp/app",
]
knowledge = ["runtime", "dep:vmux_knowledge"]
history = ["runtime", "dep:vmux_history"]
simulator = ["layout-runtime", "dep:vmux_simulator"]
gallery = ["layout-runtime", "dep:vmux_gallery"]
shortcut = ["runtime", "dep:vmux_shortcut"]
team = ["runtime", "profile-account", "dep:vmux_team"]
space = ["layout-runtime", "dep:vmux_space"]
service = ["runtime", "dep:vmux_service"]
remote = ["layout-runtime", "service", "dep:vmux_remote"]
start = ["runtime", "dep:vmux_start"]
vault = ["layout-runtime", "dep:vmux_vault"]

[dependencies]
vmux_container = { path = "../../feature/vmux_container", optional = true }
vmux_feature = { path = "../../feature/vmux_feature", features = ["http"], optional = true }
bevy_app = { workspace = true }
bevy_ecs = { workspace = true, optional = true }
vmux_account = { path = "../../feature/vmux_account", optional = true }
vmux_acp = { path = "../../feature/vmux_acp", default-features = false, optional = true }
vmux_bookmark = { path = "../../feature/vmux_bookmark", optional = true }
vmux_browser = { path = "../vmux_browser", optional = true }
vmux_command = { path = "../../feature/vmux_command", optional = true }
vmux_ecs = { path = "../vmux_ecs", optional = true }
vmux_editor = { path = "../../feature/vmux_editor", optional = true }
vmux_extension = { path = "../../feature/vmux_extension", optional = true }
vmux_flex = { path = "../vmux_flex", optional = true }
vmux_git = { path = "../../feature/vmux_git", optional = true }
vmux_gallery = { path = "../../feature/vmux_gallery", optional = true }
vmux_history = { path = "../../feature/vmux_history", optional = true }
vmux_input = { path = "../../feature/vmux_input", optional = true }
vmux_knowledge = { path = "../../feature/vmux_knowledge", optional = true }
vmux_layout = { path = "../../feature/vmux_layout", optional = true }
vmux_lsp = { path = "../vmux_lsp", optional = true }
vmux_mcp = { path = "../vmux_mcp", optional = true }
vmux_macro = { path = "../vmux_macro" }
vmux_remote = { path = "../../feature/vmux_remote", optional = true }
vmux_service = { path = "../../feature/vmux_service", optional = true }
vmux_session = { path = "../../feature/vmux_session", default-features = false, optional = true }
vmux_setting = { path = "../../feature/vmux_setting", optional = true }
vmux_shortcut = { path = "../../feature/vmux_shortcut", optional = true }
vmux_simulator = { path = "../../feature/vmux_simulator", optional = true }
vmux_space = { path = "../../feature/vmux_space", optional = true }
vmux_start = { path = "../../feature/vmux_start", optional = true }
vmux_team = { path = "../../feature/vmux_team", optional = true }
vmux_terminal = { path = "../../feature/vmux_terminal", optional = true }
vmux_tool = { path = "../../feature/vmux_tool", optional = true }
vmux_vault = { path = "../../feature/vmux_vault", optional = true }
tokio = { workspace = true, optional = true }
tracing = { version = "0.1", optional = true }
tracing-appender = { version = "0.2", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"], optional = true }
vmux_profile = { path = "../vmux_profile", optional = true }
vmux_project = { path = "../../feature/vmux_project", optional = true }
vmux_transport = { path = "../vmux_transport", optional = true }

[dev-dependencies]
bevy_ecs.workspace = true

[[bin]]
name = "vmux_service"
path = "src/bin/vmux_service.rs"
required-features = ["service-daemon"]

[lints]
workspace = true
