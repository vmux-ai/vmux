[package]
name = "vmux_window"
description = "Reusable reactive desktop window host shell for Vmux Framework applications"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
native = ["dep:bevy_input", "dep:bevy_winit", "vmux_runner/winit", "vmux_page/native"]
menu = ["dep:vmux_menu"]
menu-native = ["menu", "vmux_menu/native"]

[dependencies]
bevy_app = { workspace = true }
bevy_ecs = { workspace = true }
bevy_math = { workspace = true }
bevy_window = { workspace = true }
tracing = "0.1"
vmux_ecs = { path = "../vmux_ecs", features = ["ui"] }
vmux_flex = { path = "../vmux_flex", features = ["window"] }
vmux_menu = { path = "../vmux_menu", optional = true }
vmux_page = { path = "../vmux_page", features = ["host"] }
vmux_runner = { path = "../vmux_runner" }

[target.'cfg(not(target_os = "ios"))'.dependencies]
bevy_input = { workspace = true, optional = true }
bevy_winit = { workspace = true, optional = true }

[dev-dependencies]
dioxus = { workspace = true }
serde = { workspace = true }
vmux_api = { path = "../vmux_api", features = ["bevy"] }

[lints]
workspace = true
