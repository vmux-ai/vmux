[package]
name = "vmux_browser"
description = "Browser and page-open orchestration for vmux"
version.workspace = true
edition.workspace = true
publish = false

[features]
conformance = []

[lib]
path = "src/lib.rs"

[dependencies]
async-channel = "2"
base64 = "0.22"
bevy = { workspace = true }
bevy_cef = { workspace = true }
bevy_cef_core = { workspace = true }
chrono = { workspace = true }
crossbeam-channel = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
polling = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rkyv = { workspace = true }
ron = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
tempfile = "3"
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }
tungstenite = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
vmux_command = { path = "../../feature/vmux_command" }
vmux_core = { path = "../vmux_core" }
vmux_editor = { path = "../../feature/vmux_editor" }
vmux_extension = { path = "../../feature/vmux_extension" }
vmux_flex = { path = "../vmux_flex" }
vmux_git = { path = "../../feature/vmux_git" }
vmux_history = { path = "../../feature/vmux_history" }
vmux_input = { path = "../../feature/vmux_input" }
vmux_layout = { path = "../../feature/vmux_layout" }
vmux_tool = { path = "../../feature/vmux_tool" }
vmux_native = { path = "../vmux_native" }
vmux_setting = { path = "../../feature/vmux_setting" }
vmux_space = { path = "../../feature/vmux_space" }
vmux_start = { path = "../../feature/vmux_start" }
vmux_terminal = { path = "../../feature/vmux_terminal" }
vmux_ui = { path = "../vmux_ui", default-features = false }
vmux_api = { path = "../vmux_api" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSAppearance",
    "NSResponder",
    "NSView",
    "NSWindow",
] }
objc2 = { version = "0.6", features = ["exception"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = [
    "std",
    "CALayer",
] }
raw-window-handle = "0.6"
wry = { version = "0.53", features = ["transparent"] }

[dev-dependencies]
async-channel = "2"
vmux_agent = { path = "../../feature/vmux_agent" }
zip = { version = "2", default-features = false, features = ["deflate"] }

[lints]
workspace = true
