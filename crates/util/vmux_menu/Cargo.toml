[package]
name = "vmux_menu"
description = "Declarative ECS menu bars, submenus, and native OS context menus"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
native = ["dep:muda", "dep:objc2-foundation"]

[dependencies]
bevy_app = { workspace = true }
bevy_ecs = { workspace = true }
crossbeam-channel = { workspace = true }
muda = { version = "0.19", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = ["std"], optional = true }

[lints]
workspace = true
