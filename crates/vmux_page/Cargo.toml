[package]
name = "vmux_page"
description = "Bevy plugin: serve embedded webview pages over vmux:// URLs"
version.workspace = true
edition.workspace = true
publish = false
build = "build.rs"

[features]
default = []
build = ["dep:regex", "dep:sha2"]
web = ["dep:dioxus", "dep:vmux_layout", "dep:vmux_ui", "dep:web-sys"]

[dependencies]
regex = { workspace = true, optional = true }
sha2 = { version = "0.10", optional = true }
vmux_core = { path = "../vmux_core" }

[build-dependencies]
regex = { workspace = true }
sha2 = "0.10"

[[bin]]
name = "vmux_page"
path = "src/main.rs"
required-features = ["web"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
dioxus = { workspace = true, optional = true, features = ["web"] }
vmux_layout = { path = "../page/vmux_layout", optional = true }
vmux_ui = { path = "../vmux_ui", optional = true }
web-sys = { version = "0.3", features = ["Location", "Window"], optional = true }
