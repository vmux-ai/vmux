[package]
name = "vmux_mobile"
version.workspace = true
edition.workspace = true
description = "Native Dioxus Mobile client for Vmux"
publish = false

[features]
default = []
# Kept as the name every build script and CI job already passes, but it no longer pulls
# `dioxus/mobile`. That feature brought tao and a webview to launch the app in; the runner is
# `bevy_winit` now, and linking tao as well would put two things in the binary that each assert on
# being the one to call `UIApplicationMain`.
mobile = []

[lib]
name = "vmux_mobile"
path = "src/lib.rs"

[[bin]]
name = "vmux_mobile"
path = "src/main.rs"
required-features = ["mobile"]

[[example]]
name = "minimal"
path = "examples/minimal.rs"
required-features = ["mobile"]

[package.metadata.example.minimal]
name = "Minimal"
description = "The whole phone runtime as one plugin"
category = "Mobile"

[[example]]
name = "layout"
path = "examples/layout.rs"
required-features = ["mobile"]

[package.metadata.example.layout]
name = "Layout"
description = "Tabs, a stack and stacked sheets, driven by hand instead of by a Mac"
category = "Navigation"

[dependencies]
# The phone runs the desktop's runner: `bevy_winit` owns the loop and `app.run()` turns it. These
# are the plugins `WinitPlugin` needs around it and no more — there is no renderer, because wry
# paints every pixel this app shows.
bevy_a11y = "0.19.0"
bevy_app = { workspace = true }
bevy_ecs = { workspace = true }
bevy_input = { version = "0.19.0", default-features = false }
bevy_time = { version = "0.19.0", default-features = false, features = ["std"] }
# Only to drive the pools while the page world's plugins report themselves ready. That world is
# not the one the runner turns, so it still has to be brought up by hand.
bevy_tasks = "0.19"
bevy_window = { workspace = true }
bevy_winit = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
dioxus = { version = "=0.7.9", default-features = false, features = [
    "minimal",
    "document",
    "asset",
    "mounted",
] }
futures-util = "0.3"
rkyv = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["time"] }
url = { workspace = true }
quinn = { workspace = true }
vmux_remote = { path = "../../host/vmux_remote" }
vmux_service = { path = "../../host/vmux_service" }
vmux_wire = { path = "../../vmux_wire", features = ["bevy"] }
vmux_chat = { path = "../../page/vmux_chat" }
vmux_start = { path = "../../page/vmux_start" }
vmux_team = { path = "../../page/vmux_team" }
vmux_native = { path = "../../vmux_native" }
wry = { version = "0.53", default-features = false }
vmux_ui = { path = "../../vmux_ui" }

[target.'cfg(target_os = "ios")'.dependencies]
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-av-foundation = { version = "0.3", default-features = false, features = [
    "std",
    # requestAccessForMediaType takes a completion block.
    "block2",
    "AVAnimation",
    "AVCaptureDevice",
    "AVCaptureInput",
    "AVCaptureMetadataOutput",
    "AVCaptureOutput",
    "AVCaptureOutputBase",
    "AVCaptureSession",
    "AVCaptureVideoPreviewLayer",
    "AVMediaFormat",
    "AVMetadataObject",
    "dispatch2",
    "objc2-core-foundation",
    "objc2-quartz-core",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "CFCGTypes",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSDictionary",
    "NSError",
    "NSNotification",
    "NSObject",
    "NSString",
    "NSURL",
] }
objc2-quartz-core = { version = "0.3", default-features = false, features = [
    "std",
    "CALayer",
    "objc2-core-foundation",
] }
objc2-ui-kit = { version = "0.3", default-features = false, features = [
    "block2",
    "UIInterface",
    "UITraitCollection",
    "NSText",
    "objc2-core-foundation",
    "objc2-quartz-core",
    # openSettingsURLString, so a denied camera can be re-granted without hunting through Settings.
    "UIApplication",
    "UIButton",
    "UIColor",
    "UIControl",
    "UIFont",
    "UILabel",
    "UIGeometry",
    "UIGestureRecognizer",
    "UINavigationController",
    "UINavigationItem",
    "UIPresentationController",
    "UIResponder",
    "UISheetPresentationController",
    "UIView",
    "UIViewController",
] }

[lints]
workspace = true
