[package]
name = "vmux_mobile"
version.workspace = true
edition.workspace = true
description = "Native Dioxus Mobile client for Vmux"
publish = false

[features]
default = []
mobile = ["dioxus/mobile"]

[[bin]]
name = "vmux_mobile"
path = "src/main.rs"
required-features = ["mobile"]

[dependencies]
# The phone's ECS host, ticked from the event loop Dioxus already owns rather than a thread of its
# own. `bevy_window` is here for `AppLifecycle` alone: it carries no winit, so taking Bevy's own
# type costs nothing and keeps one vocabulary across the desktop and the phone.
bevy_app = { workspace = true }
bevy_ecs = { workspace = true }
# Only to drive the pools while plugins report themselves ready, which is what `App`'s own
# `run_once` does and the one part of a runner this crate has to reimplement.
bevy_tasks = "0.19"
bevy_window = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
dioxus = { version = "=0.7.9", default-features = false, features = [
    "minimal",
    "document",
    "asset",
    "mounted",
] }
futures-util = "0.3"
rkyv = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["time"] }
url = { workspace = true }
quinn = { workspace = true }
vmux_remote = { path = "../../host/vmux_remote" }
vmux_service = { path = "../../host/vmux_service" }
vmux_wire = { path = "../../vmux_wire" }
vmux_chat = { path = "../../page/vmux_chat" }
vmux_start = { path = "../../page/vmux_start" }
vmux_team = { path = "../../page/vmux_team" }
vmux_ui = { path = "../../vmux_ui" }

[target.'cfg(target_os = "ios")'.dependencies]
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-av-foundation = { version = "0.3", default-features = false, features = [
    "std",
    # requestAccessForMediaType takes a completion block.
    "block2",
    "AVAnimation",
    "AVCaptureDevice",
    "AVCaptureInput",
    "AVCaptureMetadataOutput",
    "AVCaptureOutput",
    "AVCaptureOutputBase",
    "AVCaptureSession",
    "AVCaptureVideoPreviewLayer",
    "AVMediaFormat",
    "AVMetadataObject",
    "dispatch2",
    "objc2-core-foundation",
    "objc2-quartz-core",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "CFCGTypes",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSDictionary",
    "NSError",
    "NSNotification",
    "NSObject",
    "NSString",
    "NSURL",
] }
objc2-quartz-core = { version = "0.3", default-features = false, features = [
    "std",
    "CALayer",
    "objc2-core-foundation",
] }
objc2-ui-kit = { version = "0.3", default-features = false, features = [
    "block2",
    "UIInterface",
    "UITraitCollection",
    "NSText",
    "objc2-core-foundation",
    "objc2-quartz-core",
    # openSettingsURLString, so a denied camera can be re-granted without hunting through Settings.
    "UIApplication",
    "UIButton",
    "UIColor",
    "UIControl",
    "UIFont",
    "UILabel",
    "UIGeometry",
    "UIPresentationController",
    "UIResponder",
    "UISheetPresentationController",
    "UIView",
    "UIViewController",
] }
