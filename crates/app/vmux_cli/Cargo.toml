[package]
name = "vmux_cli"
version.workspace = true
edition.workspace = true
description = "Vmux command-line interface"
publish = false

[[bin]]
name = "vmux"
path = "src/main.rs"

[dependencies]
bevy_app = { workspace = true }
bevy_ecs = { workspace = true }
clap = { version = "4", features = ["string"] }
tokio = { workspace = true }
vmux_app = { path = "../../util/vmux_app", features = ["cli"] }
vmux_core = { path = "../../util/vmux_core" }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[lints]
workspace = true
