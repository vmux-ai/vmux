[package]
name = "vmux_cli"
version.workspace = true
edition.workspace = true
description = "Vmux command-line interface"
publish = false

[[bin]]
name = "vmux"
path = "src/main.rs"

[dependencies]
bevy_app = { workspace = true }
bevy_ecs = { workspace = true }
bevy_tasks = { workspace = true }
clap = { version = "4", features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true }
vmux_agent = { path = "../../feature/vmux_agent" }
vmux_api = { path = "../../util/vmux_api" }
vmux_browser = { path = "../../util/vmux_browser" }
vmux_command = { path = "../../feature/vmux_command" }
vmux_editor = { path = "../../feature/vmux_editor" }
vmux_knowledge = { path = "../../feature/vmux_knowledge" }
vmux_layout = { path = "../../feature/vmux_layout" }
vmux_mcp = { path = "../../util/vmux_mcp" }
vmux_setting = { path = "../../feature/vmux_setting" }
vmux_simulator = { path = "../../feature/vmux_simulator" }
vmux_space = { path = "../../feature/vmux_space" }
vmux_team = { path = "../../feature/vmux_team" }
vmux_terminal = { path = "../../feature/vmux_terminal" }
vmux_transport = { path = "../../util/vmux_transport" }
vmux_tool = { path = "../../feature/vmux_tool" }
vmux_service = { path = "../../feature/vmux_service" }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[lints]
workspace = true
