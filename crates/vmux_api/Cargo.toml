[package]
name = "vmux_api"
description = "Shared API types for vmux process and UI boundaries"
version.workspace = true
edition.workspace = true
publish = false

[features]
default = []
bevy = ["dep:bevy_ecs", "dep:bevy_reflect"]

[dependencies]
rkyv = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
unicode-segmentation = "1"
vmux_macro = { path = "../vmux_macro" }
url = { workspace = true }
uuid = { workspace = true }

bevy_ecs = { workspace = true, optional = true }
bevy_reflect = { workspace = true, optional = true }

[lints]
workspace = true
