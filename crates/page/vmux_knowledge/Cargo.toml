[package]
name = "vmux_knowledge"
build = "../../build_cfg.rs"
description = "Local-first Markdown knowledge base"
version.workspace = true
edition.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
vmux_core = { path = "../../vmux_core" }
vmux_api = { path = "../../vmux_api" }

[target.'cfg(not(target_os = "ios"))'.dependencies]
bevy = { workspace = true }
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
moonshine-save = { workspace = true }
notify = { workspace = true }
vmux_git = { path = "../../vmux_git" }
vmux_tool = { path = "../../vmux_tool" }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
