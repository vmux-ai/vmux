[package]
name = "vmux_team"
build = "../../build_cfg.rs"
description = "Team / profiles (user + agents)"
version.workspace = true
edition.workspace = true
publish = false

[features]
default = []

[lib]
path = "src/lib.rs"

[dependencies]
# Unconditional, unlike  below: the roster's model is plain ECS over wire types and the
# phone runs it too. Only the desktop half needs the whole engine.
bevy_app = { workspace = true }
bevy_ecs = { workspace = true }
rkyv = { workspace = true }
serde = { workspace = true }
vmux_wire = { path = "../../vmux_wire", features = ["bevy"] }

[target.'cfg(not(target_os = "ios"))'.dependencies]
serde_json = { workspace = true }
vmux_service = { path = "../../host/vmux_service" }
vmux_core = { path = "../../vmux_core" }
bevy = { workspace = true }
bevy_cef = { workspace = true }
ron = { workspace = true }
vmux_agent = { path = "../vmux_agent" }
vmux_command = { path = "../vmux_command" }
vmux_layout = { path = "../vmux_layout" }
vmux_space = { path = "../vmux_space" }

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
dioxus = { workspace = true }
vmux_ui = { path = "../../vmux_ui", default-features = false }
