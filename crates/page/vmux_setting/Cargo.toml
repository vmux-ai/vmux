[package]
name = "vmux_setting"
build = "../../build_cfg.rs"
description = "Settings webview app"
version.workspace = true
edition.workspace = true
publish = false

[features]
default = []

[lib]
path = "src/lib.rs"

[dependencies]
rkyv = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
vmux_ui = { path = "../../vmux_ui", default-features = false }

[target.'cfg(not(any(target_arch = "wasm32", target_os = "ios")))'.dependencies]
# Dioxus does.
# The `ui` alias, spelled out: Cargo resolves dependencies before any build script runs, so a
# manifest cannot use it. The settings page reaches no further than Dioxus, so it renders wherever
bevy = { workspace = true }
bevy_cef = { workspace = true }
bevy_ecs = { workspace = true }
notify = { workspace = true }
ron = { workspace = true }
tempfile = "3"
vmux_command = { path = "../vmux_command" }
vmux_core = { path = "../../vmux_core" }
vmux_flex = { path = "../../vmux_flex" }
vmux_history = { path = "../vmux_history" }
vmux_layout = { path = "../vmux_layout" }

[target.'cfg(any(target_arch = "wasm32", target_os = "ios"))'.dependencies]
dioxus = { workspace = true }

[dev-dependencies]
tempfile = "3"
