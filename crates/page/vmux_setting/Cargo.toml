[package]
name = "vmux_setting"
build = "../../build_cfg.rs"
description = "Settings webview app"
version.workspace = true
edition.workspace = true
publish = false

[features]
default = []

[lib]
path = "src/lib.rs"

[dependencies]
rkyv = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
vmux_ui = { path = "../../vmux_ui", default-features = false }
vmux_api = { path = "../../vmux_api" }
vmux_native = { path = "../../vmux_native" }
vmux_path = { path = "../../vmux_path" }

[target.'cfg(not(target_os = "ios"))'.dependencies]
bevy = { workspace = true }
bevy_cef = { workspace = true }
bevy_ecs = { workspace = true }
notify = { workspace = true }
ron = { workspace = true }
vmux_command = { path = "../vmux_command" }
vmux_core = { path = "../../vmux_core" }
vmux_flex = { path = "../../vmux_flex" }
vmux_history = { path = "../vmux_history" }
vmux_layout = { path = "../vmux_layout" }
vmux_macro = { path = "../../vmux_macro" }

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
dioxus = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
