[package]
name = "vmux_editor"
build = "../../build_cfg.rs"
description = "Bevy + CEF + Dioxus file viewer webview"
version.workspace = true
edition.workspace = true
publish = false

[features]
default = []

[lib]
path = "src/lib.rs"

[dependencies]
regex.workspace = true
serde = { workspace = true }
rkyv = { workspace = true }
vmux_core = { path = "../../vmux_core" }
vmux_git = { path = "../../vmux_git" }

[target.'cfg(not(any(target_arch = "wasm32", target_os = "ios")))'.dependencies]
arboard = "3"
bevy = { workspace = true }
bevy_cef = { workspace = true }
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
lsp-types = "0.97"
notify = { workspace = true }
percent-encoding = "2"
pulldown-cmark = { version = "0.12", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
ron = { workspace = true }
ropey = "1"
serde_json = { workspace = true }
sha2 = "0.10"
syntect = { workspace = true }
tar = "0.4"
tracing = "0.1"
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
unicode-segmentation = "1"
unicode-width = "0.2"
url = { workspace = true }
vmux_command = { path = "../vmux_command" }
vmux_flex = { path = "../../vmux_flex" }
vmux_layout = { path = "../vmux_layout" }
vmux_setting = { path = "../vmux_setting" }
vmux_space = { path = "../vmux_space" }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(not(any(target_arch = "wasm32", target_os = "ios")))'.dev-dependencies]
tempfile = "3"
url = { workspace = true }

# The `ui` alias, spelled out: Cargo resolves dependencies before any build script runs, so a
# manifest cannot use it. `lsp_page` reaches no further than Dioxus, so it renders wherever Dioxus
# does; the editor proper still needs the DOM and stays in the wasm block below.
[target.'cfg(any(target_arch = "wasm32", target_os = "ios", target_os = "macos"))'.dependencies]
dioxus = { workspace = true }
vmux_ui = { path = "../../vmux_ui", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
unicode-width = "0.2"
wasm-bindgen = { workspace = true }
web-sys = { version = "0.3", features = [
    "Window", "Document", "DocumentFragment", "Element", "FocusOptions", "HtmlElement", "Node",
    "CaretPosition", "DomRect", "Range", "Selection", "CssStyleDeclaration",
    "ResizeObserver", "ResizeObserverEntry",
    "WheelEvent", "KeyboardEvent", "Location",
    "Blob", "Url",
    "HtmlTextAreaElement", "InputEvent", "CompositionEvent", "MouseEvent",
    "ScrollIntoViewOptions", "ScrollLogicalPosition",
] }

[[bin]]
name = "vmux_mock_lsp"
path = "src/bin/vmux_mock_lsp.rs"
