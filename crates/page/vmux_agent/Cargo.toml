[package]
name = "vmux_agent"
build = "../../build_cfg.rs"
description = "Agent CLI strategies (vibe, claude, codex) and shared session ECS abstractions"
version.workspace = true
edition.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
rkyv = { workspace = true }
similar = "2"
vmux_chat = { path = "../vmux_chat" }
vmux_wire = { path = "../../vmux_wire" }

[target.'cfg(not(target_os = "ios"))'.dependencies]
vmux_clipboard = { path = "../../vmux_clipboard" }
vmux_command = { path = "../vmux_command" }
base64 = "0.22"
bevy = { workspace = true }
bevy_cef = { workspace = true }
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
chrono = { workspace = true }
notify = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "blocking"] }
rfd = { workspace = true }
crossbeam-channel = "0.5"
futures-lite = "2"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff"] }
tokio = { workspace = true, features = ["rt"] }
toml = { workspace = true }
uuid = { workspace = true }
url = { workspace = true }
vmux_core = { path = "../../vmux_core" }
vmux_editor = { path = "../vmux_editor" }
vmux_git = { path = "../../vmux_git" }
vmux_history = { path = "../vmux_history" }
vmux_layout = { path = "../vmux_layout" }
vmux_start = { path = "../vmux_start" }
vmux_mcp = { path = "../../host/vmux_mcp" }
vmux_remote = { path = "../../host/vmux_remote" }
vmux_service = { path = "../../host/vmux_service" }
vmux_session = { path = "../../vmux_session" }
vmux_setting = { path = "../vmux_setting" }
vmux_space = { path = "../vmux_space" }
vmux_terminal = { path = "../vmux_terminal" }

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
dioxus = { workspace = true }
vmux_ui = { path = "../../vmux_ui", default-features = false }

[dev-dependencies]
mockito = "1"
serial_test = "3"
tempfile = "3"
tokio = { workspace = true, features = ["rt", "macros"] }
