[package]
name = "vmux_start"
description = "The shared launcher: result ranking, row rendering, and the start page"
version.workspace = true
edition.workspace = true
publish = false
build = "../../build_cfg.rs"

[lib]
path = "src/lib.rs"

[dependencies]
dioxus = { version = "=0.7.9", default-features = false, features = [
    "minimal",
    "document",
    "asset",
    "mounted",
] }
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", package = "dioxus-primitives", rev = "ccdb07f69383de008a0afadda0e5ab7ec14c1a9c", default-features = false }
rkyv = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
vmux_command = { path = "../vmux_command" }
vmux_core = { path = "../../vmux_core" }
vmux_ui = { path = "../../vmux_ui" }
vmux_wire = { path = "../../vmux_wire" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2.115"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "EventTarget", "Event", "AddEventListenerOptions"] }

[target.'cfg(not(any(target_arch = "wasm32", target_os = "ios")))'.dependencies]
bevy = { workspace = true }
bevy_cef = { workspace = true }
bevy_ecs = { workspace = true }
rfd = { workspace = true }
vmux_flex = { path = "../../vmux_flex" }
vmux_git = { path = "../../vmux_git" }
vmux_layout = { path = "../vmux_layout" }
vmux_space = { path = "../vmux_space" }
