[package]
name = "vmux_start"
description = "The shared launcher: result ranking, row rendering, and the start page"
version.workspace = true
edition.workspace = true
publish = false
build = "../../build_cfg.rs"

[lib]
path = "src/lib.rs"

[dependencies]
# Unconditional, unlike `bevy` below: the launcher's model is plain ECS over wire types, and the
# phone runs it too. Only the desktop half needs the whole engine, which is why the two are named
# separately — a split this manifest already had before there was a phone to want it.
bevy_app = { workspace = true }
bevy_ecs = { workspace = true }
dioxus = { version = "=0.7.9", default-features = false, features = [
    "minimal",
    "document",
    "asset",
    "mounted",
] }
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", package = "dioxus-primitives", rev = "ccdb07f69383de008a0afadda0e5ab7ec14c1a9c", default-features = false }
rkyv = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
vmux_command = { path = "../vmux_command" }
vmux_core = { path = "../../vmux_core" }
vmux_ui = { path = "../../vmux_ui" }
vmux_wire = { path = "../../vmux_wire", features = ["bevy"] }

[target.'cfg(not(target_os = "ios"))'.dependencies]
bevy = { workspace = true }
bevy_cef = { workspace = true }
rfd = { workspace = true }
vmux_flex = { path = "../../vmux_flex" }
vmux_git = { path = "../../vmux_git" }
vmux_layout = { path = "../vmux_layout" }
vmux_space = { path = "../vmux_space" }

[lints]
workspace = true
