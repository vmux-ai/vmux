[package]
name = "vmux_chat"
description = "The shared chat transcript UI rendered by every vmux client"
version.workspace = true
edition.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
dioxus = { version = "=0.7.9", default-features = false, features = [
    "minimal",
    "document",
    "asset",
    "mounted",
] }
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", package = "dioxus-primitives", rev = "ccdb07f69383de008a0afadda0e5ab7ec14c1a9c", default-features = false }
pulldown-cmark = { version = "0.12", default-features = false, features = [
    "html",
] }
rkyv = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
similar = "2"
unicode-segmentation = "1"
vmux_ui = { path = "../../vmux_ui" }
vmux_wire = { path = "../../vmux_wire" }

# MatrixRain is a canvas animation, so the install backdrop it paints exists only on the CEF host;
# every other target renders nothing and does without the crate. The keyboard seam is the same
# shape: only a webview has a host keymap to hand a stroke to, so `vmux_core`'s wire types for it
# are needed here and nowhere else.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
vmux_core = { path = "../../vmux_core" }
vmux_terminal = { path = "../vmux_terminal" }
wasm-bindgen = { workspace = true }
web-sys = { version = "0.3", features = [
    "Clipboard",
    "Document",
    "Element",
    "HtmlTextAreaElement",
    "Navigator",
    "Selection",
    "Window",
] }
