[package]
name = "vmux_extension"
description = "Browser extension catalog, installation, permissions, and protocol support"
version.workspace = true
edition.workspace = true
publish = false
build = "../../build_cfg.rs"

[lib]
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
serde = { workspace = true }
serde_json = { workspace = true }
vmux_api = { path = "../../vmux_api" }
vmux_core = { path = "../../vmux_core" }
vmux_layout = { path = "../vmux_layout" }
vmux_native = { path = "../../vmux_native" }
vmux_ui = { path = "../../vmux_ui", default-features = false }

[target.'cfg(not(target_os = "ios"))'.dependencies]
bevy = { workspace = true }
bevy_ecs = { workspace = true }
bevy_cef = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
url = { workspace = true }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
dioxus = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
