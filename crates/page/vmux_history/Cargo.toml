[package]
name = "vmux_history"
description = "Minimal Bevy + CEF + Dioxus POC (history host message bridge)"
version.workspace = true
edition.workspace = true
publish = false

[features]
default = []
debug = []

[lib]
path = "src/lib.rs"

[dependencies]
rkyv = { workspace = true }
serde = { workspace = true }
vmux_wire = { path = "../../vmux_wire" }

[target.'cfg(not(any(target_arch = "wasm32", target_os = "ios")))'.dependencies]
bevy = { workspace = true }
bevy_cef = { workspace = true }
bevy_cef_core = { workspace = true }
bevy_reflect = { workspace = true }
moonshine-save = { workspace = true }
bevy_ecs = { workspace = true }
ron = { workspace = true }
vmux_core = { path = "../../vmux_core" }

[target.'cfg(not(any(target_arch = "wasm32", target_os = "ios")))'.dev-dependencies]
bevy = { workspace = true }

[target.'cfg(any(target_arch = "wasm32", target_os = "ios"))'.dependencies]
dioxus = { workspace = true }
vmux_ui = { path = "../../vmux_ui", default-features = false }
