[package]
name = "vmux_simulator"
build = "../../build_cfg.rs"
description = "Mirror and drive a booted iOS Simulator"
version.workspace = true
edition.workspace = true
publish = false

[features]
default = []

[lib]
path = "src/lib.rs"

[dependencies]
rkyv = { workspace = true }
serde = { workspace = true }

[target.'cfg(not(any(target_arch = "wasm32", target_os = "ios")))'.dependencies]
bevy = { workspace = true }
bevy_cef = { workspace = true }
bevy_ecs = { workspace = true }
serde_json = { workspace = true }
vmux_core = { path = "../../vmux_core" }

[target.'cfg(any(target_arch = "wasm32", target_os = "ios"))'.dependencies]
dioxus = { workspace = true }
vmux_ui = { path = "../../vmux_ui", default-features = false }
wasm-bindgen = { workspace = true }
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "History",
    "HtmlElement",
    "Location",
    "Window",
] }
