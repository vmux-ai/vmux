[package]
name = "vmux_terminal"
build = "../../build_cfg.rs"
description = "Bevy + Dioxus terminal"
version.workspace = true
edition.workspace = true
publish = false

[features]
default = []

[lib]
path = "src/lib.rs"

[dependencies]
dioxus = { workspace = true }
serde = { workspace = true }
rkyv = { workspace = true }
unicode-width = "0.2"
vmux_core = { path = "../../vmux_core" }
vmux_ui = { path = "../../vmux_ui", default-features = false }

[target.'cfg(not(any(target_arch = "wasm32", target_os = "ios")))'.dependencies]
vmux_clipboard = { path = "../../vmux_clipboard" }
bevy = { workspace = true }
bevy_cef = { workspace = true }
bevy_ecs = { workspace = true }
portable-pty = { workspace = true }
rfd = { workspace = true }
sysinfo = "0.38"
tracing = "0.1"
url = { workspace = true }
vmux_command = { path = "../vmux_command" }
vmux_flex = { path = "../../vmux_flex" }
vmux_history = { path = "../vmux_history" }
vmux_layout = { path = "../vmux_layout" }
vmux_service = { path = "../../host/vmux_service" }
vmux_setting = { path = "../vmux_setting" }
vmux_space = { path = "../vmux_space" }

[target.'cfg(not(any(target_arch = "wasm32", target_os = "ios")))'.dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
