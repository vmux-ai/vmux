[package]
name = "vmux_dioxus"
description = "Drive a Dioxus VirtualDom in the host process and speak the interpreter's wire protocol"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
base64 = "0.22"
dioxus-core = "=0.7.9"
dioxus-html = { version = "=0.7.9", features = ["serialize"] }
# `binary-protocol` and `sledgehammer` are what gate `MutationState`, the `WriteMutations` sink
# that turns a render into the byte batch `run_from_bytes` applies. Without both, this crate has
# nothing to send.
dioxus-interpreter-js = { version = "=0.7.9", features = [
    "binary-protocol",
    "sledgehammer",
] }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
dioxus = { workspace = true }
