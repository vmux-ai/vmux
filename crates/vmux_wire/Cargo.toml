[package]
name = "vmux_wire"
description = "Lightweight wire types shared by vmux processes"
version.workspace = true
edition.workspace = true
publish = false

[features]
default = []
bevy = ["dep:bevy_ecs", "dep:bevy_reflect"]

[dependencies]
rkyv = { workspace = true }
serde = { workspace = true }
unicode-segmentation = "1"
vmux_macro = { path = "../vmux_macro" }
url = { workspace = true }
uuid = { workspace = true }

# Not iOS-excluded, unlike the bevy blocks elsewhere in the tree. Those exclude `bevy` proper and
# `bevy_cef`, which cannot build for a phone. These two are plain Rust and the phone's world wants
# them, so what decides whether they are pulled in is the feature, not the target.
bevy_ecs = { workspace = true, optional = true }
bevy_reflect = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
