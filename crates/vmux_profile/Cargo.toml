[package]
name = "vmux_profile"
description = "Vmux profile names and filesystem paths"
version.workspace = true
edition.workspace = true
publish = false
build = "../build_cfg_git.rs"

[dependencies]
chrono = { workspace = true }
ring = "0.17"
ron = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
zeroize = "1"

# Native, iOS included: deliberately not a host block, which would drop these from the phone.

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
security-framework-sys = "2.17"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
