[package]
name = "vmux_team"
description = "Team / profiles (user + agents)"
version.workspace = true
edition.workspace = true
publish = false

[features]
default = []
web = []

[lib]
path = "src/lib.rs"

[dependencies]
rkyv = { workspace = true }
serde = { workspace = true }
vmux_wire = { path = "../vmux_wire" }

[target.'cfg(not(any(target_arch = "wasm32", target_os = "ios")))'.dependencies]
vmux_core = { path = "../vmux_core" }
bevy = { workspace = true }
bevy_cef = { workspace = true }
bevy_ecs = { workspace = true }
ron = { workspace = true }
vmux_agent = { path = "../vmux_agent" }
vmux_command = { path = "../vmux_command" }
vmux_layout = { path = "../vmux_layout" }
vmux_space = { path = "../vmux_space" }

[target.'cfg(any(target_arch = "wasm32", target_os = "ios"))'.dependencies]
dioxus = { workspace = true }
vmux_ui = { path = "../vmux_ui", default-features = false }
