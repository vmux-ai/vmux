[package]
name = "vmux_git"
build = "../build_cfg.rs"
description = "Host-side git engine + bridge for the file:// editor page"
version.workspace = true
edition.workspace = true
publish = false

[features]
default = []

[lib]
path = "src/lib.rs"

[dependencies]
rkyv = { workspace = true }
serde = { workspace = true }

[target.'cfg(not(any(target_arch = "wasm32", target_os = "ios")))'.dependencies]
bevy = { workspace = true }
bevy_ecs = { workspace = true }
bevy_cef = { workspace = true }
bevy_cef_core = { workspace = true }
libc = "0.2"
notify = { workspace = true }
syntect = { workspace = true }
similar = "2"
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }

[target.'cfg(not(any(target_arch = "wasm32", target_os = "ios")))'.dev-dependencies]
tempfile = "3"

# The `ui` alias, spelled out: Cargo resolves dependencies before any build script runs, so a
# manifest cannot use it.
[target.'cfg(any(target_arch = "wasm32", target_os = "ios", target_os = "macos"))'.dependencies]
dioxus = { workspace = true }
vmux_ui = { path = "../vmux_ui", default-features = false }
