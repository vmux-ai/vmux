[package]
name = "vmux_space"
description = "Space list webview app"
version.workspace = true
edition.workspace = true
publish = false

[features]
default = []
web = []

[lib]
path = "src/lib.rs"

[dependencies]
rkyv = { workspace = true }
serde = { workspace = true }
vmux_wire = { path = "../vmux_wire" }

[target.'cfg(not(any(target_arch = "wasm32", target_os = "ios")))'.dependencies]
vmux_core = { path = "../vmux_core" }
bevy = { workspace = true }
bevy_cef = { workspace = true }
bevy_ecs = { workspace = true }
moonshine-save = { workspace = true }
ron = { workspace = true }
vmux_command = { path = "../vmux_command" }
vmux_history = { path = "../vmux_history" }
vmux_layout = { path = "../vmux_layout" }
vmux_setting = { path = "../vmux_setting" }

[target.'cfg(any(target_arch = "wasm32", target_os = "ios"))'.dependencies]
dioxus = { workspace = true }
vmux_ui = { path = "../vmux_ui", default-features = false }

[dev-dependencies]
tempfile = "3"

[target.'cfg(not(any(target_arch = "wasm32", target_os = "ios")))'.dev-dependencies]
bevy_cef_core = { workspace = true }
serde_json = { workspace = true }
