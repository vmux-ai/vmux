[package]
name = "vmux_github"
build = "../../build_cfg.rs"
description = "GitHub resources, synchronization, and authenticated Git operations"
version.workspace = true
edition.workspace = true
publish = false

[features]
default = []

[lib]
path = "src/lib.rs"

[dependencies]
bevy = { workspace = true }
bevy_app = { workspace = true }
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
futures-lite = "2"
moonshine-save = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = "3"
url = { workspace = true }
uuid = { workspace = true }
vmux_api = { path = "../../util/vmux_api", features = ["bevy"] }
vmux_auth = { path = "../vmux_auth" }
vmux_ecs = { path = "../../util/vmux_ecs" }
vmux_editor = { path = "../vmux_editor" }
vmux_git = { path = "../vmux_git" }
vmux_path = { path = "../../util/vmux_path" }
vmux_session = { path = "../vmux_session" }

vmux_connector = { path = "../../util/vmux_connector" }

[lints]
workspace = true
