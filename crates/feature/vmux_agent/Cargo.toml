[package]
name = "vmux_agent"
build = "../../build_cfg.rs"
description = "Agent CLI strategies (vibe, claude, codex) and shared session ECS abstractions"
version.workspace = true
edition.workspace = true
publish = false

[features]
default = ["app"]
provider = [
    "dep:crossbeam-channel",
    "dep:futures-util",
    "dep:reqwest",
]
service = [
    "provider",
    "dep:bevy",
    "dep:bevy_ecs",
    "dep:tokio",
    "dep:vmux_core",
]
app = [
    "provider",
    "dep:base64",
    "dep:bevy",
    "dep:bevy_cef",
    "dep:bevy_ecs",
    "dep:bevy_reflect",
    "dep:chrono",
    "dep:dioxus",
    "dep:futures-lite",
    "dep:image",
    "dep:notify",
    "dep:rfd",
    "dep:tempfile",
    "dep:tokio",
    "dep:toml",
    "dep:url",
    "dep:uuid",
    "dep:vmux_browser",
    "dep:vmux_chat",
    "dep:vmux_clipboard",
    "dep:vmux_command",
    "dep:vmux_core",
    "dep:vmux_editor",
    "dep:vmux_extension",
    "dep:vmux_git",
    "dep:vmux_history",
    "dep:vmux_layout",
    "dep:vmux_mcp",
    "dep:vmux_path",
    "dep:vmux_session",
    "dep:vmux_setting",
    "dep:vmux_simulator",
    "dep:vmux_space",
    "dep:vmux_start",
    "dep:vmux_terminal",
    "dep:vmux_tool",
    "dep:vmux_transport",
    "dep:vmux_ui",
]

[lib]
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
rkyv = { workspace = true }
vmux_chat = { path = "../vmux_chat", optional = true }
vmux_api = { path = "../../util/vmux_api" }

[target.'cfg(not(target_os = "ios"))'.dependencies]
vmux_clipboard = { path = "../../util/vmux_clipboard", optional = true }
vmux_command = { path = "../vmux_command", optional = true }
base64 = { version = "0.22", optional = true }
bevy = { workspace = true, optional = true }
bevy_cef = { workspace = true, optional = true }
bevy_ecs = { workspace = true, optional = true }
bevy_reflect = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
notify = { workspace = true, optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "blocking"], optional = true }
rfd = { workspace = true, optional = true }
crossbeam-channel = { version = "0.5", optional = true }
futures-lite = { version = "2", optional = true }
futures-util = { version = "0.3", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff"], optional = true }
tokio = { workspace = true, features = ["rt"], optional = true }
toml = { workspace = true, optional = true }
tempfile = { version = "3", optional = true }
uuid = { workspace = true, optional = true }
url = { workspace = true, optional = true }
vmux_core = { path = "../../util/vmux_core", optional = true }
vmux_browser = { path = "../../util/vmux_browser", optional = true }
vmux_editor = { path = "../vmux_editor", optional = true }
vmux_extension = { path = "../vmux_extension", optional = true }
vmux_git = { path = "../vmux_git", optional = true }
vmux_history = { path = "../vmux_history", optional = true }
vmux_layout = { path = "../vmux_layout", optional = true }
vmux_start = { path = "../vmux_start", optional = true }
vmux_mcp = { path = "../../util/vmux_mcp", optional = true }
vmux_path = { path = "../../util/vmux_path", optional = true }
vmux_transport = { path = "../../util/vmux_transport", optional = true }
vmux_session = { path = "../../util/vmux_session", optional = true }
vmux_setting = { path = "../vmux_setting", optional = true }
vmux_simulator = { path = "../vmux_simulator", optional = true }
vmux_space = { path = "../vmux_space", optional = true }
vmux_terminal = { path = "../vmux_terminal", optional = true }
vmux_tool = { path = "../vmux_tool", optional = true }

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
dioxus = { workspace = true, optional = true }
vmux_ui = { path = "../../util/vmux_ui", default-features = false, optional = true }

[dev-dependencies]
mockito = "1"
serial_test = "3"
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
