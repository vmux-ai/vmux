[package]
name = "vmux_vault"
build = "../../build_cfg.rs"
description = "Vault page and host runtime"
version.workspace = true
edition.workspace = true
publish = false

[features]
default = []

[lib]
path = "src/lib.rs"

[dependencies]
rkyv = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
vmux_api = { path = "../../util/vmux_api" }
vmux_ecs = { path = "../../util/vmux_ecs" }
vmux_native = { path = "../../util/vmux_native" }
vmux_ui = { path = "../../util/vmux_ui", default-features = false }

[target.'cfg(not(target_os = "ios"))'.dependencies]
bevy = { workspace = true }
bevy_cef = { workspace = true }
bevy_ecs = { workspace = true }
notify = { workspace = true }
parking_lot = "0.12"
rfd = { workspace = true }
vmux_layout = { path = "../vmux_layout" }
vmux_tool = { path = "../vmux_tool" }

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
dioxus = { workspace = true }

[lints]
workspace = true
