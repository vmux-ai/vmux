[package]
name = "vmux_auth"
build = "../../build_cfg.rs"
description = "Declarative OAuth connections and credential leases"
version.workspace = true
edition.workspace = true
publish = false

[features]
default = []

[lib]
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
bevy = { workspace = true }
bevy_app = { workspace = true }
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
chrono = { workspace = true }
futures-lite = "2"
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
ron = { workspace = true }
ring = "0.17"
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
vmux_api = { path = "../../util/vmux_api", features = ["bevy"] }
vmux_ecs = { path = "../../util/vmux_ecs" }
vmux_profile = { path = "../../util/vmux_profile" }
vmux_path = { path = "../../util/vmux_path" }
zeroize = "1"

vmux_connector = { path = "../../util/vmux_connector" }

[lints]
workspace = true
