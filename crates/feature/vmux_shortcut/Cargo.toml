[package]
name = "vmux_shortcut"
build = "../../build_cfg.rs"
description = "Keyboard shortcut dispatch, context claims, and reference UI"
version.workspace = true
edition.workspace = true
publish = false

[features]
default = []

[lib]
path = "src/lib.rs"

[dependencies]
rkyv = { workspace = true }
serde = { workspace = true }
vmux_ecs = { path = "../../util/vmux_ecs" }
vmux_native = { path = "../../util/vmux_native" }
vmux_api = { path = "../../util/vmux_api" }

[target.'cfg(not(target_os = "ios"))'.dependencies]
bevy = { workspace = true }
bevy_cef = { workspace = true }
bevy_ecs = { workspace = true }
vmux_command = { path = "../vmux_command" }
vmux_input = { path = "../vmux_input" }
vmux_layout = { path = "../vmux_layout" }
vmux_setting = { path = "../vmux_setting" }
vmux_ui = { path = "../../util/vmux_ui", default-features = false }

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
dioxus = { workspace = true }
vmux_ui = { path = "../../util/vmux_ui", default-features = false }

[lints]
workspace = true
