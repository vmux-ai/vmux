[package]
name = "vmux_layout"
description = "Bevy layout shell and single CEF layout webview"
version.workspace = true
edition.workspace = true
publish = false
build = "../../build_cfg_git.rs"

[features]
default = []
debug = []

[lib]
path = "src/lib.rs"

[dependencies]
rkyv = { workspace = true }
serde = { workspace = true }
vmux_ecs = { path = "../../util/vmux_ecs" }
vmux_native = { path = "../../util/vmux_native" }
vmux_ui = { path = "../../util/vmux_ui", default-features = false }
vmux_api = { path = "../../util/vmux_api" }

[dev-dependencies]
serde_json = { workspace = true }

[target.'cfg(not(target_os = "ios"))'.dependencies]
bevy = { workspace = true }
bevy_asset = "0.19.0"
bevy_cef = { workspace = true }
bevy_cef_core = { workspace = true }
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
libc = "0.2"
moonshine-save = { workspace = true }
raw-window-handle = "0.6"
rfd = { workspace = true }
ron = { workspace = true }
sha2 = "0.10"
uuid = { workspace = true }
vmux_command = { path = "../vmux_command" }
vmux_flex = { path = "../../util/vmux_flex" }
vmux_git = { path = "../vmux_git" }
vmux_history = { path = "../vmux_history" }
vmux_input = { path = "../vmux_input" }
vmux_tool = { path = "../vmux_tool" }

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
dioxus = { workspace = true }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
serde_json = { workspace = true }
vmux_command = { path = "../vmux_command" }

[target.'cfg(not(target_os = "ios"))'.dev-dependencies]
tempfile = "3"

[lints]
workspace = true
