[package]
name = "vmux_container"
build = "../../build_cfg.rs"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Vmux-managed Linux VM and container engine commands"

[dependencies]
bevy_app = { workspace = true }
bevy_ecs = { workspace = true }
bevy_tasks = { workspace = true, features = ["multi_threaded"] }
vmux_ecs = { path = "../../util/vmux_ecs" }
vmux_profile = { path = "../../util/vmux_profile" }
vmux_vm = { path = "../../util/vmux_vm" }
vmux_api = { path = "../../util/vmux_api" }
vmux_page = { path = "../../util/vmux_page" }
rkyv = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = "3"
url = { workspace = true }
percent-encoding = "2"

[target.'cfg(not(target_os = "ios"))'.dependencies]
bevy = { workspace = true }
bevy_cef = { workspace = true }

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
dioxus = { workspace = true }
vmux_ui = { path = "../../util/vmux_ui", default-features = false }

[lints]
workspace = true

[dev-dependencies]
serde_json = { workspace = true }
tempfile = "3"
dioxus-ssr = "=0.7.9"
