[package]
name = "vmux_tool"
build = "../../build_cfg.rs"
description = "Tool inventory, manifests, imports, and dotfile management"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
bevy_app = { workspace = true }
bevy_ecs = { workspace = true }
bevy_tasks = { workspace = true }
ron = "0.8"
rkyv = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
vmux_path = { path = "../../util/vmux_path" }
vmux_profile = { path = "../../util/vmux_profile" }
vmux_core = { path = "../../util/vmux_core" }
vmux_api = { path = "../../util/vmux_api" }
vmux_native = { path = "../../util/vmux_native" }
vmux_ui = { path = "../../util/vmux_ui", default-features = false }

[target.'cfg(not(target_os = "ios"))'.dependencies]
bevy = { workspace = true }
bevy_cef = { workspace = true }
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
ring = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
dioxus = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
