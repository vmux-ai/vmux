[package]
name = "vmux_lints"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dylint_linting = "=6.4.0"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
bevy_app = { version = "=0.19.0", default-features = false, features = ["std"] }
bevy_ecs = { version = "=0.19.0", default-features = false, features = ["std"] }

[package.metadata.rust-analyzer]
rustc_private = true
