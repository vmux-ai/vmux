[package]
name = "vmux_dx"
description = "ECS-owned development commands for Vmux"
version.workspace = true
edition.workspace = true
publish = false

[features]
default = ["development"]
development = ["ci-runtime"]
ci-runtime = []
runtime-cli = []
ci-syntax = ["dep:proc-macro2", "dep:syn"]

[dependencies]
vmux_feature = { path = "../vmux_feature", default-features = false, features = ["ecs"] }
proc-macro2 = { version = "1", features = ["span-locations"], optional = true }
syn = { version = "2", features = ["full", "visit"], optional = true }
plist = "1"
bevy_app = { workspace = true }
bevy_ecs = { workspace = true }
vmux_ecs = { path = "../../util/vmux_ecs", features = ["cli"] }
vmux_job = { path = "../../util/vmux_job" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
ron = { workspace = true }
sha2 = "0.10"
base64 = "0.22"
flate2 = "1"
minisign-verify = "0.2"
semver = "1"
tar = "0.4"
libc = "0.2"
globset = "0.4"
yaml-rust = "0.4"
filetime = "0.2"

[[bin]]
name = "vmux-ci"
path = "src/ci_main.rs"
required-features = ["ci-runtime"]

[build-dependencies]
libc = "0.2"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
dioxus-rsx = "=0.7.9"
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
syn = { version = "2", features = ["full", "visit", "visit-mut"] }

[lints]
workspace = true
