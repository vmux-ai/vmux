[package]
name = "vmux_session"
build = "../../build_cfg.rs"
description = "Render-free ECS model of a canonical session"
version.workspace = true
edition.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
bevy_app = { workspace = true }
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
moonshine-save = { workspace = true }
percent-encoding = "2"
ron = { workspace = true }
rkyv = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
unicode-segmentation = "1"
url = { workspace = true }
uuid = { workspace = true }
vmux_api = { path = "../../util/vmux_api", features = ["bevy"] }
vmux_ecs = { path = "../../util/vmux_ecs", default-features = false }

[lints]
workspace = true
