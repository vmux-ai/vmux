[package]
name = "vmux_extension"
description = "Browser extension catalog, installation, permissions, and protocol support"
version.workspace = true
edition.workspace = true
publish = false
build = "../../build_cfg.rs"

[lib]
path = "src/lib.rs"

[features]
conformance = []

[dependencies]
base64 = "0.22"
serde = { workspace = true }
serde_json = { workspace = true }
vmux_api = { path = "../../util/vmux_api" }
vmux_ecs = { path = "../../util/vmux_ecs" }
vmux_layout = { path = "../vmux_layout" }
vmux_page = { path = "../../util/vmux_page" }
vmux_ui = { path = "../../util/vmux_ui", default-features = false }

[target.'cfg(not(target_os = "ios"))'.dependencies]
bevy = { workspace = true }
bevy_ecs = { workspace = true }
bevy_cef = { workspace = true }
crossbeam-channel = { workspace = true }
libc = "0.2"
polling = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rkyv = { workspace = true }
sha2 = "0.10"
tempfile = "3"
tungstenite = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
vmux_browser = { path = "../../util/vmux_browser" }
vmux_flex = { path = "../../util/vmux_flex" }
vmux_history = { path = "../vmux_history" }
vmux_tool = { path = "../vmux_tool" }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
dioxus = { workspace = true }

[lints]
workspace = true
