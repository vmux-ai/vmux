[package]
name = "vmux_extension"
description = "Browser extension catalog, installation, permissions, and protocol support"
version.workspace = true
edition.workspace = true
publish = false
build = "../../build_cfg.rs"

[lib]
path = "src/lib.rs"

[features]
default = []
conformance = ["host"]
filesystem = ["vmux_ecs/jobs", "dep:vmux_path", "dep:sha2"]
host = [
    "filesystem", "vmux_ecs/host", "dep:vmux_layout", "dep:bevy", "dep:bevy_cef",
    "dep:crossbeam-channel", "dep:base64", "dep:libc", "dep:polling", "dep:reqwest", "dep:rkyv",
    "dep:sha2", "dep:tempfile", "dep:tungstenite", "dep:url", "dep:uuid",
    "dep:vmux_browser", "dep:vmux_flex", "dep:vmux_history", "dep:vmux_tool", "dep:zip",
]

[dependencies]
base64 = { version = "0.22", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
vmux_api = { path = "../../util/vmux_api" }
bevy_app = { workspace = true }
bevy_ecs = { workspace = true }
vmux_ecs = { path = "../../util/vmux_ecs", features = ["store"] }
vmux_layout = { path = "../vmux_layout", optional = true }
vmux_path = { path = "../../util/vmux_path", optional = true }
sha2 = { version = "0.10", optional = true }

[target.'cfg(not(target_os = "ios"))'.dependencies]
bevy = { workspace = true, optional = true }
bevy_cef = { workspace = true, optional = true }
crossbeam-channel = { workspace = true, optional = true }
libc = { version = "0.2", optional = true }
polling = { workspace = true, optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"], optional = true }
rkyv = { workspace = true, optional = true }
tempfile = { version = "3", optional = true }
tungstenite = { workspace = true, optional = true }
url = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
vmux_browser = { path = "../../util/vmux_browser", optional = true }
vmux_flex = { path = "../../util/vmux_flex", optional = true }
vmux_history = { path = "../vmux_history", optional = true }
vmux_tool = { path = "../vmux_tool", optional = true }
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }

[[bin]]
name = "vmux-extension-conformance"
path = "src/bin/vmux-extension-conformance.rs"
required-features = ["conformance"]

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
