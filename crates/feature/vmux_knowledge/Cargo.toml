[package]
name = "vmux_knowledge"
build = "../../build_cfg.rs"
description = "Local-first Markdown knowledge base"
version.workspace = true
edition.workspace = true
publish = false

[features]
default = ["host"]
host = [
    "vmux_feature/page-binding",
    "vmux_ecs/host",
    "dep:bevy",
    "dep:moonshine-save",
    "dep:vmux_git",
    "dep:vmux_layout",
    "dep:vmux_page",
    "dep:vmux_tool",
]

[lib]
path = "src/lib.rs"

[dependencies]
vmux_feature = { path = "../vmux_feature", default-features = false, features = ["ecs"] }
bevy_app = { workspace = true }
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
rkyv = { workspace = true }
serde = { workspace = true }
vmux_ecs = { path = "../../util/vmux_ecs", features = ["contracts"] }
vmux_api = { path = "../../util/vmux_api" }

[target.'cfg(not(target_os = "ios"))'.dependencies]
bevy = { workspace = true, optional = true }
moonshine-save = { workspace = true, optional = true }
serde_json = { workspace = true }
toml = { workspace = true }
vmux_git = { path = "../vmux_git", optional = true }
vmux_layout = { path = "../vmux_layout", features = ["host"], optional = true }
vmux_page = { path = "../../util/vmux_page", optional = true }
vmux_path = { path = "../../util/vmux_path" }
vmux_tool = { path = "../vmux_tool", optional = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
