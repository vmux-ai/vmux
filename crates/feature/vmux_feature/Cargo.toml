[package]
name = "vmux_feature"
build = "../../build_cfg.rs"
description = "Feature declarations and cloud-controlled release availability"
version.workspace = true
edition.workspace = true
publish = false

[features]
default = ["ecs"]
manifest = ["dep:ron", "dep:vmux_api", "dep:inventory", "dep:semver"]
ecs = ["manifest", "dep:bevy_app", "dep:bevy_ecs", "dep:vmux_ecs", "dep:sha2"]
hosting = ["ecs", "dep:url"]
page-binding = ["ecs", "dep:vmux_page", "vmux_ecs/host"]
http = ["ecs", "dep:reqwest", "dep:async-io", "dep:getrandom", "vmux_ecs/jobs"]
page = ["page-binding", "http", "dep:bevy", "dep:bevy_cef", "dep:vmux_api", "dep:vmux_macro", "dep:vmux_ui", "dep:dioxus", "dep:inventory", "dep:uuid", "dep:rkyv"]

[dependencies]
url = { workspace = true, optional = true }
ron = { workspace = true, optional = true }
semver = { version = "1", optional = true }
bevy_app = { workspace = true, optional = true }
bevy_ecs = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { version = "3", default-features = false, features = ["std"] }
sha2 = { version = "0.10", optional = true }
async-io = { version = "2", optional = true }
getrandom = { version = "0.4", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"], optional = true }
vmux_ecs = { path = "../../util/vmux_ecs", optional = true }
bevy = { workspace = true, optional = true }
bevy_cef = { workspace = true, optional = true }
dioxus = { workspace = true, optional = true }
inventory = { version = "0.3", optional = true }
rkyv = { workspace = true, optional = true }
chrono = { version = "0.4", default-features = false, features = ["std"] }
uuid = { workspace = true, optional = true }
vmux_api = { path = "../../util/vmux_api", optional = true }
vmux_macro = { path = "../../util/vmux_macro", optional = true }
vmux_page = { path = "../../util/vmux_page", optional = true }
vmux_ui = { path = "../../util/vmux_ui", default-features = false, optional = true }

[lints]
workspace = true

[dev-dependencies]
dioxus-ssr = "=0.7.9"
