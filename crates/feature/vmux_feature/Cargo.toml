[package]
name = "vmux_feature"
description = "Feature declarations and cloud-controlled release availability"
version.workspace = true
edition.workspace = true
publish = false

[features]
default = ["ecs"]
ecs = ["dep:bevy_app", "dep:bevy_ecs", "dep:vmux_ecs", "dep:sha2"]
http = ["ecs", "dep:reqwest", "dep:async-io", "dep:getrandom", "vmux_ecs/jobs"]

[dependencies]
bevy_app = { workspace = true, optional = true }
bevy_ecs = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { version = "3", default-features = false, features = ["std"] }
sha2 = { version = "0.10", optional = true }
async-io = { version = "2", optional = true }
getrandom = { version = "0.4", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"], optional = true }
vmux_ecs = { path = "../../util/vmux_ecs", optional = true }

[lints]
workspace = true
