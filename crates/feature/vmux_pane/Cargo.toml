[package]
name = "vmux_pane"
description = "Renderer-independent pane topology and owner-scoped selection"
version.workspace = true
edition.workspace = true
publish = false

[features]
default = []
contracts = ["dep:vmux_api"]
geometry = ["dep:vmux_flex", "dep:bevy_transform"]
store = ["vmux_ecs/store", "dep:moonshine-save"]

[dependencies]
bevy_app = { workspace = true }
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
vmux_ecs = { path = "../../util/vmux_ecs" }
vmux_api = { path = "../../util/vmux_api", optional = true }
vmux_flex = { path = "../../util/vmux_flex", optional = true }
bevy_transform = { version = "0.19.0", default-features = false, features = ["std", "bevy-support"], optional = true }
moonshine-save = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
