[package]
name = "vmux_gallery"
description = "Interactive catalog of shared Vmux UI components"
build = "../../build_cfg.rs"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
rkyv.workspace = true
serde.workspace = true
ron.workspace = true
vmux_api = { path = "../../util/vmux_api" }
vmux_ecs = { path = "../../util/vmux_ecs", features = ["host"] }
vmux_page = { path = "../../util/vmux_page" }
vmux_macro = { path = "../../util/vmux_macro" }

[target.'cfg(not(target_os = "ios"))'.dependencies]
bevy.workspace = true
bevy_ecs.workspace = true
bevy_cef.workspace = true
vmux_layout = { path = "../vmux_layout", features = ["host"] }

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
dioxus.workspace = true
vmux_ui = { path = "../../util/vmux_ui" }

[lints]
workspace = true

[dev-dependencies]
fluent-syntax = "0.12"
