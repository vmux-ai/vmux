[package]
name = "vmux_input"
build = "../../build_cfg_git.rs"
description = "Native keyboard and pointer input for vmux"
version.workspace = true
edition.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
bevy = { workspace = true }
bevy_cef_core = { workspace = true }
crossbeam-channel = { workspace = true }
parking_lot = "0.12"
rkyv = { workspace = true }
serde = { workspace = true }
vmux_api = { path = "../../util/vmux_api" }
vmux_command = { path = "../vmux_command" }
vmux_core = { path = "../../util/vmux_core" }
vmux_tool = { path = "../vmux_tool" }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "block2",
    "std",
    "NSEvent",
] }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
