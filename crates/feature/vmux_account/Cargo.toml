[package]
name = "vmux_account"
description = "Local-first account and profile ownership"
version.workspace = true
edition.workspace = true
publish = false

[features]
default = []
local = ["dep:rusqlite"]
cloud = ["dep:quinn", "dep:tokio", "dep:vmux_transport", "dep:vmux_feature", "vmux_feature/http", "dep:vmux_api"]

profile-sync = ["cloud", "local"]

[dependencies]
vmux_feature = { path = "../vmux_feature", optional = true }
bevy_app = { workspace = true }
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
vmux_ecs = { path = "../../util/vmux_ecs", features = ["records"] }
vmux_job = { path = "../../util/vmux_job" }
vmux_profile = { path = "../../util/vmux_profile" }
ring = "0.17"
zeroize = "1"
url = { workspace = true }
quinn = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
vmux_transport = { path = "../../util/vmux_transport", optional = true }
vmux_api = { path = "../../util/vmux_api", optional = true }
rusqlite = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
