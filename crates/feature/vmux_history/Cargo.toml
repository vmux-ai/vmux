[package]
name = "vmux_history"
build = "../../build_cfg.rs"
description = "Minimal Bevy + CEF + Dioxus POC (history host message bridge)"
version.workspace = true
edition.workspace = true
publish = false

[features]
default = []
debug = []

[lib]
path = "src/lib.rs"

[dependencies]
rkyv = { workspace = true }
serde = { workspace = true }
vmux_api = { path = "../../util/vmux_api" }
vmux_page = { path = "../../util/vmux_page" }

[target.'cfg(not(target_os = "ios"))'.dependencies]
bevy = { workspace = true }
bevy_cef = { workspace = true }
bevy_cef_core = { workspace = true }
bevy_reflect = { workspace = true }
moonshine-save = { workspace = true }
bevy_ecs = { workspace = true }
ron = { workspace = true }
vmux_ecs = { path = "../../util/vmux_ecs" }

[target.'cfg(not(target_os = "ios"))'.dev-dependencies]
bevy = { workspace = true }

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
dioxus = { workspace = true }
vmux_ui = { path = "../../util/vmux_ui", default-features = false }

[lints]
workspace = true
