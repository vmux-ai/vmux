[package]
name = "vmux_fold"
description = "Owner-scoped durable fold preferences and asynchronous store contracts"
version.workspace = true
edition.workspace = true
publish = false

[features]
default = []
filesystem = ["dep:bevy_tasks", "dep:crossbeam-channel", "dep:ron", "dep:vmux_path"]

[dependencies]
bevy_app = { workspace = true }
bevy_ecs = { workspace = true }
serde = { workspace = true }
vmux_ecs = { path = "../../util/vmux_ecs", features = ["store"] }
bevy_tasks = { workspace = true, optional = true }
crossbeam-channel = { workspace = true, optional = true }
ron = { workspace = true, optional = true }
vmux_path = { path = "../../util/vmux_path", optional = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
