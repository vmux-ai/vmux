[package]
name = "vmux_mcp"
version.workspace = true
edition.workspace = true
description = "MCP stdio server for Vmux project controls"
publish = false

[features]
default = []
connection = [
    "dep:bevy",
    "dep:bevy_cef",
    "dep:parking_lot",
    "dep:reqwest",
    "dep:ring",
    "dep:url",
    "dep:uuid",
    "dep:vmux_core",
    "dep:vmux_layout",
    "dep:vmux_tool",
]

[lib]
name = "vmux_mcp"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
bevy = { workspace = true, optional = true }
bevy_app = { workspace = true }
bevy_cef = { workspace = true, optional = true }
bevy_ecs = { workspace = true }
parking_lot = { version = "0.12", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }
ring = { workspace = true, optional = true }
ron = "0.8"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
url = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
vmux_client = { path = "../vmux_client" }
vmux_api = { path = "../../vmux_api" }
vmux_core = { path = "../../vmux_core", optional = true }
vmux_layout = { path = "../../page/vmux_layout", optional = true }
vmux_tool = { path = "../../vmux_tool", optional = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
