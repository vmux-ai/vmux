[package]
name = "vmux_client"
description = "Lightweight client and CLI for vmux_service"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
chrono = { workspace = true }
ring = { workspace = true }
rkyv = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = "0.1"
url = { workspace = true }
uuid = { workspace = true }
vmux_profile = { path = "../../vmux_profile" }
vmux_transport = { path = "../vmux_transport" }
vmux_api = { path = "../../vmux_api" }
vmux_path = { path = "../../vmux_path" }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
