[package]
name = "vmux_native"
description = "Run a vmux page in this process: a Dioxus VirtualDom, painted by a webview of its own"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
base64 = "0.22"
dioxus-core = "=0.7.9"
dioxus-html = { version = "=0.7.9", features = ["serialize"] }
dioxus-interpreter-js = { version = "=0.7.9", features = [
    "binary-protocol",
    "sledgehammer",
] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = "0.1"

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
objc2-quartz-core = { version = "0.3", default-features = false, features = [
    "std",
    "CALayer",
] }
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }
vmux_clipboard = { path = "../vmux_clipboard" }
vmux_ui = { path = "../vmux_ui", default-features = false }
wry = { version = "0.53", features = ["transparent"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSAppearance",
    "NSResponder",
    "NSView",
    "NSWindow",
] }
objc2-web-kit = { version = "0.3", default-features = false, features = [
    "std",
    "WKProcessPool",
    "WKWebViewConfiguration",
] }

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "CFCGTypes",
] }
objc2-ui-kit = { version = "0.3", default-features = false, features = [
    "std",
    "UIInterface",
    "UIResponder",
    "UIView",
    "objc2-core-foundation",
    # `UIView::layer` is gated on this, and `raise_above_layers` is the whole reason we reach for
    # a view at all.
    "objc2-quartz-core",
] }

[dev-dependencies]
dioxus = { workspace = true }

[lints]
workspace = true
