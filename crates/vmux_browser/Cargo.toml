[package]
name = "vmux_browser"
description = "Browser and page-open orchestration for vmux"
version.workspace = true
edition.workspace = true
publish = false

[features]
conformance = []

[lib]
path = "src/lib.rs"

[dependencies]
async-channel = "2"
base64 = "0.22"
bevy = { workspace = true }
bevy_cef = { workspace = true }
bevy_cef_core = { workspace = true }
chrono = { workspace = true }
crossbeam-channel = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
polling = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
ron = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
tungstenite = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
tempfile = "3"
vmux_command = { path = "../page/vmux_command" }
vmux_core = { path = "../vmux_core" }
vmux_git = { path = "../vmux_git" }
vmux_history = { path = "../page/vmux_history" }
vmux_layout = { path = "../page/vmux_layout" }
vmux_service = { path = "../host/vmux_service" }
vmux_setting = { path = "../page/vmux_setting" }
vmux_space = { path = "../page/vmux_space" }
vmux_terminal = { path = "../page/vmux_terminal" }
vmux_ui = { path = "../vmux_ui", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSAppearance",
    "NSResponder",
    "NSView",
    "NSWindow",
] }
objc2 = { version = "0.6", features = ["exception"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = [
    "std",
    "CALayer",
] }
raw-window-handle = "0.6"
wry = { version = "0.53", features = ["transparent"] }

[dev-dependencies]
async-channel = "2"
vmux_agent = { path = "../page/vmux_agent" }
zip = { version = "2", default-features = false, features = ["deflate"] }
