[workspace]
members = ["crates/app/*", "crates/host/*", "crates/page/*", "crates/vmux_*", "patches/*"]
exclude = ["patches/cargo-packager-0.11.8", "website"]
default-members = ["crates/app/vmux_desktop"]
resolver = "3"

[workspace.package]
version = "0.0.34"
edition = "2024"
description = "AI-native workspace combining browser and terminal panes"
license = "GPL-3.0-or-later"
homepage = "https://vmux.ai"
repository = "https://github.com/vmux-ai/vmux"

[workspace.lints.clippy]
let_underscore_future = "deny"

[workspace.dependencies]
bytes = "1"
webpki-roots = "1"
bevy = { version = "0.19.0", default-features = false, features = [
    "std",
    "multi_threaded",
    "async_executor",
    "bevy_asset",
    "bevy_log",
    "bevy_winit",
    "bevy_window",
    "reflect_auto_register",
    "x11",
    "wayland",
] }
bevy_ecs = { version = "0.19.0", default-features = true }
bevy_reflect = { version = "0.19.0", default-features = true }
bevy_app = { version = "0.19.0", default-features = false, features = ["bevy_reflect", "std"] }
bevy_window = { version = "0.19.0", default-features = false, features = ["std"] }
bevy_winit = { version = "0.19.0", default-features = false, features = [
    "x11",
    "wayland",
] }
bevy_world_serialization = "0.19.1"
bevy_cef = "0.5.2"
bevy_cef_core = "0.5.2"
moonshine-save = "0.7.0"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "sync",
    "macros",
    "net",
    "io-util",
    "signal",
    "time",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.8"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "std",
] }
crossbeam-channel = "0.5"
polling = "3.11"
tungstenite = "0.28"
url = "2"
notify = "6"
dioxus = { version = "=0.7.9", default-features = false, features = [
    "minimal",
    "document",
    "asset",
    "mounted",
] }
fluent-bundle = "0.16"
unic-langid = "0.9"
sys-locale = "0.3"
regex = "1"
smallvec = "1"

alacritty_terminal = "0.26"
portable-pty = "0.9"
rfd = "0.15"
rkyv = { version = "0.8", features = ["alloc"] }
uuid = { version = "1", features = ["v4", "serde", "js"] }

quinn = { version = "0.11", default-features = false, features = [
    "runtime-tokio",
    "rustls-ring",
] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
rcgen = "0.14"
ring = "0.17"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.dev.package.bevy_cef]
opt-level = 3
codegen-units = 1

[profile.dev.package.bevy_cef_core]
opt-level = 3

[profile.dev.package.vmux_service]
codegen-units = 1

[profile.release]
strip = true
lto = "thin"

[profile.cef-helper]
inherits = "release"
lto = "off"

[profile.release.package.vmux_history]
opt-level = "z"
codegen-units = 1

[profile.release.package.vmux_shortcut]
opt-level = "z"
codegen-units = 1

[profile.release.package.vmux_ui]
opt-level = "z"
codegen-units = 1

[profile.release.package.vmux_command]
opt-level = "z"
codegen-units = 1

[profile.release.package.vmux_terminal]
opt-level = "z"
codegen-units = 1

[profile.release.package.vmux_service]
opt-level = "z"
codegen-units = 1

[profile.release.package.vmux_space]
opt-level = "z"
codegen-units = 1

[patch.crates-io]
bevy_cef = { path = "patches/bevy_cef-0.5.2" }
bevy_cef_core = { path = "patches/bevy_cef_core-0.5.2" }
bevy_window = { path = "patches/bevy_window-0.19.0" }
bevy_world_serialization = { path = "patches/bevy_world_serialization-0.19.1" }
