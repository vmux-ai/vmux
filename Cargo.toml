[workspace]
members = ["crates/app/*", "crates/host/*", "crates/page/*", "crates/vmux_*", "examples/*/*", "patches/*"]
exclude = ["patches/cargo-packager-0.11.8", "website"]
default-members = ["crates/app/vmux_desktop"]
resolver = "3"

[workspace.package]
version = "0.0.32"
edition = "2024"
description = "AI-native workspace combining browser and terminal panes"
license = "GPL-3.0-or-later"
homepage = "https://vmux.ai"
repository = "https://github.com/vmux-ai/vmux"

[workspace.lints.clippy]
# `let _ = async_fn()` drops the future without polling it, so the work never runs at all — a
# quieter failure than discarding a completed future's error, and never intentional.
let_underscore_future = "deny"

[workspace.dependencies]
bytes = "1"
webpki-roots = "1"
bevy = { version = "0.19.0", default-features = false, features = [
    "std",
    "multi_threaded",
    "async_executor",
    "bevy_asset",
    "bevy_log",
    "bevy_winit",
    "bevy_window",
    "reflect_auto_register",
    "x11",
    "wayland",
] }
bevy_ecs = { version = "0.19.0", default-features = true }
bevy_reflect = { version = "0.19.0", default-features = true }
# Reproduces the feature set bevy_internal already resolves bevy_app to. Its defaults would add
# error_panic_hook, which bevy does not forward, changing the desktop's panic handler.
bevy_app = { version = "0.19.0", default-features = false, features = ["bevy_reflect", "std"] }
# For `AppLifecycle` on the phone, where there is no winit to supply it. `std` only: what is wanted
# is the vocabulary, not the windowing, and the default set also drags `bevy_reflect` in.
bevy_window = { version = "0.19.0", default-features = false, features = ["std"] }
bevy_winit = { version = "0.19.0", default-features = false, features = [
    "x11",
    "wayland",
] }
bevy_world_serialization = "0.19.1"
bevy_cef = "0.5.2"
bevy_cef_core = "0.5.2"
moonshine-save = "0.7.0"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "sync",
    "macros",
    "net",
    "io-util",
    "signal",
    "time",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.8"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "std",
] }
crossbeam-channel = "0.5"
polling = "3.11"
tungstenite = "0.28"
url = "2"
notify = "6"
# No "web" here, and nothing in this workspace should add it. Dioxus declares `dioxus-web` in a
# plain `[dependencies]` block — it carries no `[target.*]` sections at all — so the feature is not
# target-gated, and every crate inheriting this spec would drag the wasm renderer into the iOS
# build. Nothing here compiles to wasm any more, which makes the mistake cost-free to make and
# just as expensive to ship.
dioxus = { version = "=0.7.9", default-features = false, features = [
    "minimal",
    "document",
    "asset",
    "mounted",
] }
fluent-bundle = "0.16"
unic-langid = "0.9"
sys-locale = "0.3"
regex = "1"
smallvec = "1"

alacritty_terminal = "0.26"
portable-pty = "0.9"
rfd = "0.15"
rkyv = { version = "0.8", features = ["alloc"] }
uuid = { version = "1", features = ["v4", "serde", "js"] }

# ring, not the default aws-lc-rs: aws-lc-rs needs cmake and NASM and does not cross-compile to
# aarch64-apple-ios, which is the one target that has no CI job to catch it.
quinn = { version = "0.11", default-features = false, features = [
    "runtime-tokio",
    "rustls-ring",
] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
rcgen = "0.14"
# Already in the tree via quinn/rcgen/rustls; a direct dep only so the fingerprint hash can
# reach it without pulling in a second crypto library.
ring = "0.17"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }

# Dev builds of a Bevy + CEF app are unusably slow without optimizing dependencies.
# Our crates stay at opt-level 1 for fast rebuilds; all deps compile at 3 (cached).
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

# Hot CEF render/compositing path: optimize even in dev so the texture pipeline
# isn't bottlenecked by an unoptimized build during development.
# codegen-units=1 keeps bevy_cef's reflect/rkyv generic instantiations in one CGU so
# their internal `_anon.*.llvm.*` symbols aren't dropped across CGUs at -dead_strip link
# time (otherwise binaries linking bevy_cef fail with undefined bevy_reflect symbols).
[profile.dev.package.bevy_cef]
opt-level = 3
codegen-units = 1

[profile.dev.package.bevy_cef_core]
opt-level = 3

# Single codegen unit so rkyv's derive-generated internal symbols aren't dropped
# across CGUs at link time (undefined `_anon.*.llvm.*` under --gc-sections /
# -dead_strip — surfaces in Linux test-binary links and the dev dynamic-linking build).
[profile.dev.package.vmux_service]
codegen-units = 1

[profile.release]
strip = true
lto = "thin"

[profile.cef-helper]
inherits = "release"
lto = "off"

[profile.release.package.vmux_history]
opt-level = "z"
codegen-units = 1

[profile.release.package.vmux_ui]
opt-level = "z"
codegen-units = 1

[profile.release.package.vmux_command]
opt-level = "z"
codegen-units = 1

[profile.release.package.vmux_terminal]
opt-level = "z"
codegen-units = 1

[profile.release.package.vmux_service]
opt-level = "z"
codegen-units = 1

[profile.release.package.vmux_space]
opt-level = "z"
codegen-units = 1

[patch.crates-io]
bevy_cef = { path = "patches/bevy_cef-0.5.2" }
bevy_cef_core = { path = "patches/bevy_cef_core-0.5.2" }
bevy_window = { path = "patches/bevy_window-0.19.0" }
bevy_world_serialization = { path = "patches/bevy_world_serialization-0.19.1" }
